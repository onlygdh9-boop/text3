  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;circle-equation-classroom&#x27;);
      const workspace = root.querySelector(&#x27;#lesson-workspace&#x27;);
      const focusLayer = root.querySelector(&#x27;#focus-layer&#x27;);
      const focusSlot = root.querySelector(&#x27;#focus-slot&#x27;);
      const state = { topic: &#x27;prop-basic&#x27;, steps: {} };
      let focused = null;
      let focusHome = null;
      let focusNext = null;

      const topicInfo = {
        &#x27;prop-basic&#x27;: {
          label: &#x27;명제와 조건&#x27;, pages: &#x27;교과서 82-85쪽&#x27;,
          title: &#x27;문장의 참과 거짓을 판단하고 조건의 진리집합을 찾는다&#x27;,
          problem: &#x27;명제와 조건의 뜻을 알고, ‘모든’이나 ‘어떤’을 포함한 명제를 이해하고 설명할 수 있다.&#x27;,
          principle: &#x27;&lt;strong&gt;핵심&lt;/strong&gt; 참 또는 거짓을 분명하게 판별할 수 있는 문장을 명제라 하고, 조건을 참이 되게 하는 원소 전체의 집합을 진리집합이라 한다.&#x27;
        },
        &#x27;prop-relation&#x27;: {
          label: &#x27;명제 사이의 관계&#x27;, pages: &#x27;교과서 86-90쪽&#x27;,
          title: &#x27;명제의 역과 대우, 충분조건과 필요조건의 관계를 연결한다&#x27;,
          problem: &#x27;p→q → 역과 대우 → 대우의 참·거짓 → 충분조건과 필요조건 순서로 진행한다.&#x27;,
          principle: &#x27;&lt;strong&gt;핵심&lt;/strong&gt; 명제와 그 대우의 참·거짓은 같고, p→q가 참이면 p는 q이기 위한 충분조건이며 q는 p이기 위한 필요조건이다.&#x27;
        },
        &#x27;prop-proof&#x27;: {
          label: &#x27;명제의 증명&#x27;, pages: &#x27;교과서 91-94쪽&#x27;,
          title: &#x27;대우와 귀류법을 이용해 명제를 증명하고 절대부등식을 확인한다&#x27;,
          problem: &#x27;대우를 이용한 증명 → 귀류법 → 절대부등식 → 산술평균과 기하평균 순서로 진행한다.&#x27;,
          principle: &#x27;&lt;strong&gt;핵심&lt;/strong&gt; 직접 증명하기 어려우면 대우를 증명하거나 결론의 부정을 가정하여 모순을 이끌어 낸다.&#x27;
        },
        &#x27;prop-wrapup&#x27;: {
          label: &#x27;중단원 및 대단원 마무리 문제&#x27;, pages: &#x27;교과서 97·100·101쪽&#x27;,
          title: &#x27;중단원 10·11번과 대단원 14·17번을 차근차근 해결한다&#x27;,
          problem: &#x27;중단원 10번과 11번, 대단원 14번과 17번을 순서대로 풀며 그림과 등호 조건을 확인한다.&#x27;,
          principle: &#x27;&lt;strong&gt;풀이 기준&lt;/strong&gt; 문제의 조건을 읽고 → 식과 그림을 연결하고 → 등호가 실제로 가능한지 확인한다.&#x27;
        }
      };

      const escapeMath = (text) =&gt; String(text).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;).replace(/&quot;/g,&#x27;&amp;quot;&#x27;);
      function mathML(source) {
        const plain = String(source).replace(/&lt;\/?strong&gt;/g,&#x27;&#x27;).replace(/&amp;nbsp;/g,&#x27; &#x27;).replace(/&lt;br\s*\/?&gt;/gi,&#x27; &#x27;);
        const tokens = [];
        const single = new Set([&#x27;+&#x27;,&#x27;-&#x27;,&#x27;×&#x27;,&#x27;·&#x27;,&#x27;=&#x27;,&#x27;≠&#x27;,&#x27;&lt;&#x27;,&#x27;&gt;&#x27;,&#x27;≤&#x27;,&#x27;≥&#x27;,&#x27;→&#x27;,&#x27;⇔&#x27;,&#x27;,&#x27;,&#x27;:&#x27;,&#x27;|&#x27;,&#x27;/&#x27;,&#x27;(&#x27;,&#x27;)&#x27;,&#x27;{&#x27;,&#x27;}&#x27;,&#x27;√&#x27;,&#x27;∈&#x27;,&#x27;∉&#x27;,&#x27;⊂&#x27;,&#x27;⊄&#x27;,&#x27;⊆&#x27;,&#x27;⊈&#x27;,&#x27;⊊&#x27;,&#x27;∩&#x27;,&#x27;∪&#x27;,&#x27;∅&#x27;,&#x27;∖&#x27;]);
        for (let i=0; i&lt;plain.length;) {
          if (/\s/.test(plain[i])) { i += 1; continue; }
          if (plain.slice(i,i+3) === &#x27;···&#x27;) { tokens.push(&#x27;···&#x27;); i += 3; continue; }
          if (single.has(plain[i])) { tokens.push(plain[i]); i += 1; continue; }
          let j=i+1;
          while (j&lt;plain.length &amp;&amp; !/\s/.test(plain[j]) &amp;&amp; !single.has(plain[j])) j += 1;
          const rawToken=plain.slice(i,j);
          const koreanBoundary=rawToken.match(/^([A-Za-z0-9₀-₉′²³ᶜ.]+)([가-힣].*)$/);
          if (koreanBoundary) tokens.push(koreanBoundary[1],koreanBoundary[2]);
          else tokens.push(rawToken);
          i=j;
        }
        let pos=0;
        const subscriptMap = {&#x27;₀&#x27;:&#x27;0&#x27;,&#x27;₁&#x27;:&#x27;1&#x27;,&#x27;₂&#x27;:&#x27;2&#x27;,&#x27;₃&#x27;:&#x27;3&#x27;,&#x27;₄&#x27;:&#x27;4&#x27;,&#x27;₅&#x27;:&#x27;5&#x27;,&#x27;₆&#x27;:&#x27;6&#x27;,&#x27;₇&#x27;:&#x27;7&#x27;,&#x27;₈&#x27;:&#x27;8&#x27;,&#x27;₉&#x27;:&#x27;9&#x27;};
        const superscriptMap = {&#x27;²&#x27;:&#x27;2&#x27;,&#x27;³&#x27;:&#x27;3&#x27;,&#x27;ᶜ&#x27;:&#x27;C&#x27;};
        const atom = (value) =&gt; {
          if (/^\d+(?:\.\d+)?$/.test(value)) return `&lt;mn&gt;${escapeMath(value)}&lt;/mn&gt;`;
          const superscript=value.match(/^(.*)([²³ᶜ])$/);
          if (superscript) {
            const exponent=superscript[2]===&#x27;ᶜ&#x27;?`&lt;mi&gt;C&lt;/mi&gt;`:`&lt;mn&gt;${superscriptMap[superscript[2]]}&lt;/mn&gt;`;
            return `&lt;msup&gt;${atom(superscript[1])}${exponent}&lt;/msup&gt;`;
          }
          const subscript=value.match(/^(.*?)([A-Za-z])([₀-₉]+)(′?)$/);
          if (subscript) {
            const prefix=subscript[1] ? `&lt;mi&gt;${escapeMath(subscript[1])}&lt;/mi&gt;` : &#x27;&#x27;;
            const digits=[...subscript[3]].map(ch=&gt;subscriptMap[ch]).join(&#x27;&#x27;);
            const base=`&lt;mrow&gt;${prefix}&lt;msub&gt;&lt;mi&gt;${escapeMath(subscript[2])}&lt;/mi&gt;&lt;mn&gt;${digits}&lt;/mn&gt;&lt;/msub&gt;&lt;/mrow&gt;`;
            return subscript[4] ? `&lt;msup&gt;${base}&lt;mo&gt;′&lt;/mo&gt;&lt;/msup&gt;` : base;
          }
          return `&lt;mi&gt;${escapeMath(value)}&lt;/mi&gt;`;
        };
        const row = (parts) =&gt; parts.length === 1 ? parts[0] : `&lt;mrow&gt;${parts.join(&#x27;&#x27;)}&lt;/mrow&gt;`;
        const unwrapGroup = (html) =&gt; {
          const start=&#x27;&lt;mrow&gt;&lt;mo&gt;(&lt;/mo&gt;&#x27;, end=&#x27;&lt;mo&gt;)&lt;/mo&gt;&lt;/mrow&gt;&#x27;;
          return html.startsWith(start) &amp;&amp; html.endsWith(end) ? html.slice(start.length,-end.length) : html;
        };
        const applyPostfix = (html) =&gt; {
          while (tokens[pos] === &#x27;²&#x27; || tokens[pos] === &#x27;³&#x27;) {
            const power=tokens[pos++];
            html=`&lt;msup&gt;${html}&lt;mn&gt;${superscriptMap[power]}&lt;/mn&gt;&lt;/msup&gt;`;
          }
          return html;
        };
        const parseFactor = (stops) =&gt; {
          const token=tokens[pos];
          if (token === &#x27;-&#x27;) { pos += 1; return `&lt;mrow&gt;&lt;mo&gt;−&lt;/mo&gt;${parseFactor(stops)}&lt;/mrow&gt;`; }
          if (token === &#x27;√&#x27;) {
            pos += 1;
            const adjacentProduct=tokens[pos] &amp;&amp; tokens[pos].match(/^(\d+(?:\.\d+)?)([A-Za-z].*)$/);
            if (adjacentProduct) tokens.splice(pos,1,adjacentProduct[1],adjacentProduct[2]);
            if (tokens[pos] === &#x27;(&#x27; || tokens[pos] === &#x27;{&#x27;) {
              const open=tokens[pos++], close=open === &#x27;(&#x27; ? &#x27;)&#x27; : &#x27;}&#x27;;
              const inside=parseRelation(new Set([close]));
              if (tokens[pos] === close) pos += 1;
              return applyPostfix(`&lt;msqrt&gt;${inside}&lt;/msqrt&gt;`);
            }
            return applyPostfix(`&lt;msqrt&gt;${parseFactor(stops)}&lt;/msqrt&gt;`);
          }
          if (token === &#x27;(&#x27; || token === &#x27;{&#x27;) {
            const open=tokens[pos++], close=open === &#x27;(&#x27; ? &#x27;)&#x27; : &#x27;}&#x27;;
            const inside=parseRelation(new Set([close]));
            if (tokens[pos] === close) pos += 1;
            return applyPostfix(open === &#x27;(&#x27; ? `&lt;mrow&gt;&lt;mo&gt;(&lt;/mo&gt;${inside}&lt;mo&gt;)&lt;/mo&gt;&lt;/mrow&gt;` : `&lt;mrow&gt;${inside}&lt;/mrow&gt;`);
          }
          if (token === &#x27;|&#x27;) {
            pos += 1;
            const inside=parseRelation(new Set([&#x27;|&#x27;]));
            if (tokens[pos] === &#x27;|&#x27;) pos += 1;
            return applyPostfix(`&lt;mrow&gt;&lt;mo&gt;|&lt;/mo&gt;${inside}&lt;mo&gt;|&lt;/mo&gt;&lt;/mrow&gt;`);
          }
          pos += 1;
          return applyPostfix(atom(token || &#x27;&#x27;));
        };
        const isFactorStart = (token) =&gt; token &amp;&amp; ![&#x27;+&#x27;, &#x27;-&#x27;, &#x27;×&#x27;, &#x27;·&#x27;, &#x27;=&#x27;, &#x27;≠&#x27;, &#x27;&lt;&#x27;, &#x27;&gt;&#x27;, &#x27;≤&#x27;, &#x27;≥&#x27;, &#x27;→&#x27;, &#x27;⇔&#x27;, &#x27;,&#x27;, &#x27;:&#x27;, &#x27;/&#x27;, &#x27;)&#x27;, &#x27;}&#x27;].includes(token);
        const parseMulDiv = (stops) =&gt; {
          const unaryMinus=tokens[pos] === &#x27;-&#x27;;
          if (unaryMinus) pos += 1;
          let left=parseFactor(stops);
          while (pos&lt;tokens.length &amp;&amp; !stops.has(tokens[pos])) {
            const op=tokens[pos];
            if (op === &#x27;/&#x27;) { pos += 1; left=`&lt;mfrac&gt;${unwrapGroup(left)}${unwrapGroup(parseFactor(stops))}&lt;/mfrac&gt;`; continue; }
            if (op === &#x27;×&#x27; || op === &#x27;·&#x27;) { pos += 1; left=`&lt;mrow&gt;${left}&lt;mo&gt;${op}&lt;/mo&gt;${parseFactor(stops)}&lt;/mrow&gt;`; continue; }
            if (isFactorStart(op)) { left=`&lt;mrow&gt;${left}${parseFactor(stops)}&lt;/mrow&gt;`; continue; }
            break;
          }
          return unaryMinus ? `&lt;mrow&gt;&lt;mo&gt;−&lt;/mo&gt;${left}&lt;/mrow&gt;` : left;
        };
        const parseAdd = (stops) =&gt; {
          const parts=[parseMulDiv(stops)];
          while (pos&lt;tokens.length &amp;&amp; !stops.has(tokens[pos]) &amp;&amp; (tokens[pos] === &#x27;+&#x27; || tokens[pos] === &#x27;-&#x27;)) {
            const op=tokens[pos++]; parts.push(`&lt;mo&gt;${op === &#x27;-&#x27; ? &#x27;−&#x27; : &#x27;+&#x27;}&lt;/mo&gt;`,parseMulDiv(stops));
          }
          return row(parts);
        };
        function parseRelation(stops=new Set()) {
          const parts=[parseAdd(stops)];
          while (pos&lt;tokens.length &amp;&amp; !stops.has(tokens[pos])) {
            const op=tokens[pos];
            if (![&#x27;=&#x27;, &#x27;≠&#x27;, &#x27;&lt;&#x27;, &#x27;&gt;&#x27;, &#x27;≤&#x27;, &#x27;≥&#x27;, &#x27;→&#x27;, &#x27;⇔&#x27;, &#x27;,&#x27;, &#x27;:&#x27;, &#x27;···&#x27;].includes(op)) break;
            pos += 1; parts.push(`&lt;mo&gt;${escapeMath(op)}&lt;/mo&gt;`,parseAdd(stops));
          }
          return row(parts);
        }
        const rendered=parseRelation();
        return `&lt;math xmlns=&quot;http://www.w3.org/1998/Math/MathML&quot; aria-label=&quot;${escapeMath(plain)}&quot;&gt;&lt;mrow&gt;${rendered}&lt;/mrow&gt;&lt;/math&gt;`;
      }
      function typesetInline(html) {
        const saved=[];
        const hold=(markup) =&gt; `@@MATH${saved.push(markup)-1}@@`;
        const holdInlineMath=(markup) =&gt; hold(`&lt;span class=&quot;inline-math-boundary&quot;&gt;${markup}&lt;/span&gt;`);
        const radicalHTML=(radicand,coefficient=&#x27;&#x27;) =&gt; `&lt;span class=&quot;inline-math-boundary inline-radical-math&quot;&gt;${mathML(`${coefficient}√${radicand}`)}&lt;/span&gt;`;
        let result=String(html).replace(/&lt;(math|svg)\b[\s\S]*?&lt;\/\1&gt;/gi, hold);
        const transformText=(text) =&gt; text
          .replace(/\{([^{}]+)\}\/\{([^{}]+)\}/g, (_,num,den) =&gt; holdInlineMath(mathML(`{${num}}/{${den}}`)))
          .replace(/\{([^{}]+)\}\/([A-Za-z0-9₀-₉]+)/g, (_,num,den) =&gt; holdInlineMath(mathML(`{${num}}/${den}`)))
          .replace(/\(([^()]+)\)\/\(([^()]+)\)/g, (_,num,den) =&gt; holdInlineMath(mathML(`{${num}}/{${den}}`)))
          .replace(/\(([^()]+)\)\/([A-Za-z0-9₀-₉]+)/g, (_,num,den) =&gt; holdInlineMath(mathML(`{${num}}/${den}`)))
          .replace(/([A-Za-z0-9₀-₉]+)\/\(([^()]+)\)/g, (_,num,den) =&gt; holdInlineMath(mathML(`${num}/{${den}}`)))
          .replace(/(-?\d*)√(\d+)\/(\d+)/g, (_,coef,rad,den) =&gt; holdInlineMath(mathML(`{${coef}√${rad}}/${den}`)))
          .replace(/(^|[^\d])(-?\d+)\/(-?\d+)(?!\d)/g, (_,lead,num,den) =&gt; `${lead}${holdInlineMath(mathML(`${num}/${den}`))}`)
          .replace(/(^|[^A-Za-z0-9₀-₉])(-?[A-Za-z0-9₀-₉]+)\/([A-Za-z0-9₀-₉]+)(?=$|[^A-Za-z0-9₀-₉])/g, (_,lead,num,den) =&gt; `${lead}${holdInlineMath(mathML(`${num}/${den}`))}`)
          .replace(/√\(([^()]+)\)/g, (_,rad) =&gt; hold(radicalHTML(`(${rad})`)))
          .replace(/(-?\d*)√([A-Za-z](?:[₀-₉]+)?|\d+)/g, (_,coef,rad) =&gt; hold(radicalHTML(rad,coef)));
        result=result
          .split(/(&lt;[^&gt;]+&gt;)/g)
          .map((part) =&gt; part.startsWith(&#x27;&lt;&#x27;) ? part : transformText(part))
          .join(&#x27;&#x27;);
        return result.replace(/@@MATH(\d+)@@/g, (_,index) =&gt; saved[Number(index)]);
      }
      const markSegments = (html) =&gt; {
        const saved=[];
        const hold=(markup)=&gt;`@@SEGMENTSAFE${saved.push(markup)-1}@@`;
        let result=String(html).replace(/&lt;(math|svg)\b[\s\S]*?&lt;\/\1&gt;/gi, hold);
        result=result.replace(/&lt;span class=&quot;segment-symbol&quot;[^&gt;]*&gt;[\s\S]*?&lt;\/span&gt;/gi, hold);
        result=result.replace(/&lt;span class=&quot;line-name&quot;[^&gt;]*&gt;[\s\S]*?&lt;\/span&gt;/gi, hold);

      function divisionCards() {
        return [
          card({ id:&#x27;d12&#x27;, page:12, pdf:4, labels:[&#x27;생각 열기&#x27;,&#x27;개념&#x27;,&#x27;문제 1&#x27;], kind:&#x27;concept&#x27;, title:&#x27;수직선 위의 선분의 내분점&#x27;, subtitle:&#x27;학습 목표: 선분의 내분을 이해하고 내분점의 좌표를 계산한다.&#x27;,
            body:`&lt;p&gt;한 선분을 두 부분으로 나눌 때, 전체에 대한 큰 부분의 비와 큰 부분에 대한 작은 부분의 비가 같게 한 비를 &lt;strong&gt;황금비&lt;/strong&gt;라고 한다.&lt;/p&gt;
              &lt;p class=&quot;thought-opening&quot;&gt;&lt;strong&gt;생각 열기&lt;/strong&gt;&lt;span&gt;창원대로: 한 눈금을 1 km로 한 직선 위의 A, B, C에 대하여 AB와 BC의 거리, AB : BC를 구한다.&lt;/span&gt;&lt;/p&gt;
              &lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;문제 1&#x27;, &#x27;⑴ A(-3), B(3) ⑵ A(6), B(-2) 사이의 거리를 구하시오.&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 수직선 위의 거리&#x27;, `&lt;p&gt;x₁≤x₂이면 AB=x₂-x₁, x₁&amp;gt;x₂이면 AB=x₁-x₂이다.&lt;/p&gt;${formula(&#x27;&lt;strong&gt;AB=|x₂-x₁|&lt;/strong&gt;&#x27;)}`),
              step(&#x27;2단계 · 문제 1 확인&#x27;, answer(&#x27;⑴ 6 &amp;nbsp;&amp;nbsp; ⑵ 8&#x27;)),
              step(&#x27;3단계 · 내분의 정의&#x27;, `&lt;p&gt;선분 AB 위의 점 P에 대하여 &lt;strong&gt;AP : PB=m : n (m&amp;gt;0, n&amp;gt;0)&lt;/strong&gt;일 때, P는 AB를 m:n으로 내분하며 P를 내분점이라 한다.&lt;/p&gt;`)
            ] }),
          card({ id:&#x27;d13&#x27;, page:13, pdf:5, labels:[&#x27;개념&#x27;,&#x27;문제 2&#x27;], kind:&#x27;concept&#x27;, title:&#x27;수직선 위 내분점의 좌표&#x27;, subtitle:&#x27;교과서의 함께하기에서 공식을 완성한다.&#x27;,
            body:`&lt;p&gt;A(x₁), B(x₂)를 m:n으로 내분하는 P(x)를 생각한다. x₁&amp;lt;x₂이면 AP=x-x₁, PB=x₂-x이다.&lt;/p&gt;
              ${formula(&#x27;(x-x₁):(x₂-x)=m:n&#x27;)}
              &lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;문제 2&#x27;, &#x27;A(-6), B(8)에 대하여 ⑴ 2:5 내분점 ⑵ 중점을 구하시오.&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 비례식 정리&#x27;, `${formula(&#x27;&lt;strong&gt;x=(mx₂+nx₁)/(m+n)&lt;/strong&gt;&#x27;)}&lt;p&gt;x₁&amp;gt;x₂일 때도 같은 결과를 얻는다.&lt;/p&gt;`),
              step(&#x27;2단계 · 중점&#x27;, `${formula(&#x27;M((x₁+x₂)/2)&#x27;)}&lt;p&gt;중점은 선분을 1:1로 내분한다.&lt;/p&gt;`),
              step(&#x27;3단계 · 보기&#x27;, `&lt;p&gt;A(7), B(-1)을 1:3으로 내분하는 점&lt;/p&gt;${formula(&#x27;{1×(-1)+3×7}/4=&lt;strong&gt;5&lt;/strong&gt;&#x27;)}`),
              step(&#x27;4단계 · 문제 2 확인&#x27;, answer(&#x27;⑴ -2 &amp;nbsp;&amp;nbsp; ⑵ 1&#x27;))
            ] }),
          card({ id:&#x27;d14&#x27;, page:14, pdf:6, labels:[&#x27;개념&#x27;,&#x27;문제 3&#x27;,&#x27;탐구 문제 4&#x27;], kind:&#x27;concept&#x27;, title:&#x27;좌표평면 위의 두 점 사이의 거리&#x27;, subtitle:&#x27;가로와 세로의 차로 직각삼각형을 만든다.&#x27;,
            body:`&lt;p&gt;A(x₁,y₁)를 지나고 x축에 평행한 직선과 B(x₂,y₂)를 지나고 y축에 평행한 직선의 교점을 C라 한다.&lt;/p&gt;
              &lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;문제 3&#x27;, &#x27;⑴ A(1,5), B(-3,3) ⑵ O(0,0), A(3,-4)&#x27;)}${problem(&#x27;탐구 문제 4&#x27;, &#x27;A(-2,9), B(6,7), C(5,3)으로 만든 삼각형의 종류를 말하시오.&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 두 변의 길이&#x27;, `${formula(&#x27;AC=|x₂-x₁|, &amp;nbsp; BC=|y₂-y₁|&#x27;)}`),
              step(&#x27;2단계 · 피타고라스 정리&#x27;, `${formula(&#x27;AB²=(x₂-x₁)²+(y₂-y₁)²&#x27;)} ${formula(&#x27;&lt;strong&gt;AB=√{(x₂-x₁)²+(y₂-y₁)²}&lt;/strong&gt;&#x27;)}&lt;p&gt;특히 OA=√(x₁²+y₁²)이다.&lt;/p&gt;`),
              step(&#x27;3단계 · 보기&#x27;, `${formula(&#x27;A(-1,-1), B(5,7): √(6²+8²)=&lt;strong&gt;10&lt;/strong&gt;&#x27;)}`),
              step(&#x27;4단계 · 문제 확인&#x27;, answer(&#x27;문제 3: ⑴ 2√5 ⑵ 5&lt;br&gt;탐구 문제 4: AB²+BC²=AC²이므로 ∠B=90°인 직각삼각형&#x27;))
            ] }),
          card({ id:&#x27;d15&#x27;, page:15, pdf:7, labels:[&#x27;개념&#x27;,&#x27;문제 5&#x27;], kind:&#x27;concept&#x27;, title:&#x27;좌표평면 위의 선분의 내분점&#x27;, subtitle:&#x27;x좌표와 y좌표를 각각 같은 비로 내분한다.&#x27;,
            body:`&lt;p&gt;A(x₁,y₁), B(x₂,y₂)를 m:n으로 내분하는 점을 P(x,y)라 한다. A, P, B에서 x축에 내린 수선의 발을 A′, P′, B′이라 하면 A′P′:P′B′=m:n이다.&lt;/p&gt;
              &lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;문제 5&#x27;, &#x27;A(6,-7), B(-4,3)에 대하여 ⑴ 3:2 내분점 ⑵ 중점을 구하시오.&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · x좌표와 y좌표&#x27;, `${formula(&#x27;x=(mx₂+nx₁)/(m+n), &amp;nbsp; y=(my₂+ny₁)/(m+n)&#x27;)}`),
              step(&#x27;2단계 · 평면의 내분점 공식&#x27;, `${formula(&#x27;&lt;strong&gt;P((mx₂+nx₁)/(m+n), (my₂+ny₁)/(m+n))&lt;/strong&gt;&#x27;)}&lt;p&gt;중점은 M((x₁+x₂)/2, (y₁+y₂)/2)이다.&lt;/p&gt;`),
              step(&#x27;3단계 · 보기&#x27;, `${formula(&#x27;A(-5,-1), B(1,2)를 2:1로 내분 → &lt;strong&gt;P(-1,1)&lt;/strong&gt;&#x27;)}`),
              step(&#x27;4단계 · 시뮬레이션&#x27;, `&lt;div class=&quot;sim-panel&quot;&gt;&lt;div class=&quot;status-row&quot;&gt;&lt;span id=&quot;division-result&quot; class=&quot;viz-badge&quot;&gt;P(-1,1)&lt;/span&gt;&lt;span id=&quot;division-detail&quot;&gt;AP : PB = 2 : 1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sim-controls&quot;&gt;&lt;label class=&quot;form-label&quot; for=&quot;division-m&quot;&gt;m=&lt;span id=&quot;division-m-value&quot;&gt;2&lt;/span&gt;&lt;input id=&quot;division-m&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;6&quot; step=&quot;1&quot; value=&quot;2&quot;&gt;&lt;/label&gt;&lt;label class=&quot;form-label&quot; for=&quot;division-n&quot;&gt;n=&lt;span id=&quot;division-n-value&quot;&gt;1&lt;/span&gt;&lt;input id=&quot;division-n&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;6&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;svg id=&quot;division-svg&quot; viewBox=&quot;0 0 520 360&quot; role=&quot;img&quot; aria-label=&quot;좌표평면 위의 내분점&quot;&gt;&lt;title&gt;좌표평면 위 내분점 시뮬레이션&lt;/title&gt;&lt;/svg&gt;&lt;/div&gt;`),
              step(&#x27;5단계 · 문제 5 확인&#x27;, answer(&#x27;⑴ (0,-1) &amp;nbsp;&amp;nbsp; ⑵ (1,-2)&#x27;))
            ] }),
          card({ id:&#x27;d16&#x27;, page:16, pdf:8, labels:[&#x27;개념&#x27;,&#x27;예제 1&#x27;,&#x27;탐구 문제 6&#x27;,&#x27;생각 넓히기&#x27;], kind:&#x27;concept&#x27;, title:&#x27;삼각형의 무게중심&#x27;, subtitle:&#x27;중선을 2:1로 내분하는 성질을 내분점 공식에 연결한다.&#x27;,
            body:`&lt;p&gt;삼각형의 한 꼭짓점과 대변의 중점을 이은 선분을 &lt;strong&gt;중선&lt;/strong&gt;이라 하고, 세 중선의 교점을 &lt;strong&gt;무게중심&lt;/strong&gt;이라 한다. 무게중심은 각 중선을 꼭짓점에서부터 2:1로 내분한다.&lt;/p&gt;
              &lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;탐구 문제 6&#x27;, &#x27;A(6,3), B(0,-3), C(-3,9)의 무게중심과, 각 변을 2:1로 내분한 D, E, F로 만든 삼각형의 무게중심을 비교하시오.&#x27;)}${problem(&#x27;생각 넓히기&#x27;, &#x27;B(-3,0), C(3,0), BP:PC=1:2, AB=√17, BC=6, AC=√41일 때 P와 A의 좌표, AP를 구한다.&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 예제 1&#x27;, `&lt;p&gt;BC의 중점을 M이라 하고 AM을 2:1로 내분하면&lt;/p&gt;${formula(&#x27;&lt;strong&gt;G((x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3)&lt;/strong&gt;&#x27;)}`),
              step(&#x27;2단계 · 탐구 문제 6&#x27;, answer(&#x27;△ABC의 무게중심은 (1,3). D(2,-1), E(-2,5), F(3,5)의 무게중심도 (1,3)으로 같다.&#x27;)),
              step(&#x27;3단계 · 생각 넓히기&#x27;, answer(&#x27;P(-1,0), A(-2,4), AP=√17 m&#x27;))
            ] }),
          card({ id:&#x27;d17&#x27;, page:17, pdf:9, labels:[&#x27;탐구&#x27;], kind:&#x27;review&#x27;, title:&#x27;탐구 - 아름다운 비율, 황금비&#x27;, subtitle:&#x27;황금 분할의 비를 이차방정식으로 구한다.&#x27;,
            body:`&lt;p&gt;선분 AB 위의 P에 대하여 &lt;strong&gt;AB:AP=AP:PB&lt;/strong&gt;가 성립하도록 나누는 것을 황금 분할이라 하고, AB/AP를 황금비라고 한다.&lt;/p&gt;
              &lt;p&gt;교과서는 다 빈치, 「모나리자」, 에펠탑과 정오각형의 별에서 황금비를 살펴본다.&lt;/p&gt;`,
            steps:[
              step(&#x27;1단계 · 식 세우기&#x27;, `&lt;p&gt;AB=1, AP=x이면 PB=1-x이고 1:x=x:(1-x)이다.&lt;/p&gt;${formula(&#x27;x²+x-1=0&#x27;)}`),
              step(&#x27;2단계 · 양수인 해 선택&#x27;, `${formula(&#x27;x=(√5-1)/2&#x27;)}`),
              step(&#x27;3단계 · 황금비&#x27;, `${formula(&#x27;&lt;strong&gt;AB/AP=(√5+1)/2=1.618033…&lt;/strong&gt;&#x27;)}`),
              step(&#x27;4단계 · 정오각형 탐구&#x27;, `&lt;p&gt;△ABC∽△CAD를 이용하여 BC/BD의 값이 황금비임을 설명한다.&lt;/p&gt;`)
            ] })
        ].join(&#x27;&#x27;);
      }

      function relationCards() {
        return [
          card({ id:&#x27;r18&#x27;, page:18, pdf:10, labels:[&#x27;생각 열기&#x27;,&#x27;개념&#x27;], kind:&#x27;thinking&#x27;, title:&#x27;점과 기울기로 직선의 방정식 구하기&#x27;, subtitle:&#x27;학습 목표: 두 직선의 평행 조건과 수직 조건을 탐구하고 이해한다.&#x27;,
            body:`&lt;p class=&quot;thought-opening&quot;&gt;&lt;strong&gt;생각 열기&lt;/strong&gt;&lt;span&gt;에스컬레이터: l은 (0,3), (4,5), m은 (0,1), (2,2)를 지난다. 두 직선의 기울기와 평행 여부를 확인한다.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;기울기가 m이고 y절편이 n인 직선은 y=mx+n이다.&lt;/p&gt;`,
            steps:[
              step(&#x27;1단계 · 한 점을 지나는 조건&#x27;, `&lt;p&gt;A(x₁,y₁)을 지나므로 y₁=mx₁+n, 즉 n=y₁-mx₁이다.&lt;/p&gt;`),
              step(&#x27;2단계 · 직선의 방정식&#x27;, `${formula(&#x27;&lt;strong&gt;y-y₁=m(x-x₁)&lt;/strong&gt;&#x27;)}`),
              step(&#x27;3단계 · 보기&#x27;, `${formula(&#x27;(1,2), m=-3 → y-2=-3(x-1) → &lt;strong&gt;y=-3x+5&lt;/strong&gt;&#x27;)}`),
              step(&#x27;4단계 · 생각 열기 확인&#x27;, answer(&#x27;두 직선의 기울기는 모두 1/2이므로 서로 평행하다.&#x27;))
            ] }),
          card({ id:&#x27;r19&#x27;, page:19, pdf:11, labels:[&#x27;개념&#x27;,&#x27;문제 1&#x27;,&#x27;문제 2&#x27;], kind:&#x27;concept&#x27;, title:&#x27;두 직선의 평행 조건&#x27;, subtitle:&#x27;기울기와 y절편을 비교한다.&#x27;,
            body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;문제 1&#x27;, &#x27;⑴ (3,-4)를 지나고 기울기가 2인 직선 ⑵ (-1,5)를 지나고 x축에 평행한 직선&#x27;)}${problem(&#x27;문제 2&#x27;, &#x27;(-2,-4)를 지나고 ⑴ y=-2x-1 ⑵ 3x-2y+5=0에 평행한 직선&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 평행 조건&#x27;, `${formula(&#x27;&lt;strong&gt;m=m′, n≠n′ ⇔ 두 직선은 서로 평행&lt;/strong&gt;&#x27;)}&lt;p&gt;m=m′, n=n′이면 두 직선은 일치한다.&lt;/p&gt;`),
              step(&#x27;2단계 · 예제 1&#x27;, `&lt;p&gt;(2,3)을 지나고 2x-y+1=0에 평행한 직선&lt;/p&gt;${formula(&#x27;y-3=2(x-2) → &lt;strong&gt;y=2x-1&lt;/strong&gt;&#x27;)}`),
              step(&#x27;3단계 · 문제 확인&#x27;, answer(&#x27;문제 1: ⑴ y=2x-10 ⑵ y=5&lt;br&gt;문제 2: ⑴ y=-2x-8 ⑵ y=(3/2)x-1&#x27;))
            ] }),
          card({ id:&#x27;r20&#x27;, page:20, pdf:12, labels:[&#x27;생각 열기&#x27;,&#x27;개념&#x27;], kind:&#x27;thinking&#x27;, title:&#x27;두 직선의 수직 조건 유도&#x27;, subtitle:&#x27;피타고라스 정리로 두 기울기의 곱을 구한다.&#x27;,
            body:`&lt;p class=&quot;thought-opening&quot;&gt;&lt;strong&gt;생각 열기&lt;/strong&gt;&lt;span&gt;O(0,0), A(1,3), B(3,-1)로 만든 △AOB가 직각삼각형인지 확인하고 OA와 OB의 기울기의 곱을 구한다.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;원점을 지나는 l₁:y=mx, l₁′:y=m′x와 x=1의 교점을 P(1,m), Q(1,m′)라 한다.&lt;/p&gt;`,
            steps:[
              step(&#x27;1단계 · 세 변의 제곱&#x27;, `${formula(&#x27;OP²=1+m², &amp;nbsp; OQ²=1+m′², &amp;nbsp; PQ²=(m-m′)²&#x27;)}`),
              step(&#x27;2단계 · 피타고라스 정리&#x27;, `${formula(&#x27;(1+m²)+(1+m′²)=(m-m′)²&#x27;)}`),
              step(&#x27;3단계 · 정리&#x27;, `${formula(&#x27;&lt;strong&gt;mm′=-1&lt;/strong&gt;&#x27;)}&lt;p&gt;반대로 mm′=-1이면 피타고라스 정리의 역에 따라 두 직선은 수직이다.&lt;/p&gt;`),
              step(&#x27;4단계 · 생각 열기 확인&#x27;, answer(&#x27;OA²=10, OB²=10, AB²=20이므로 ∠AOB=90°. 기울기는 3과 -1/3이고 곱은 -1이다.&#x27;))
            ] }),
          card({ id:&#x27;r21&#x27;, page:21, pdf:13, labels:[&#x27;개념&#x27;,&#x27;예제 2&#x27;,&#x27;문제 3&#x27;,&#x27;생각 넓히기&#x27;], kind:&#x27;concept&#x27;, title:&#x27;수직 조건 적용&#x27;, subtitle:&#x27;주어진 직선에 수직인 직선과 수직이등분선을 구한다.&#x27;,
            body:`${formula(&#x27;&lt;strong&gt;mm′=-1 ⇔ 두 직선은 서로 수직&lt;/strong&gt;&#x27;)}&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;문제 3&#x27;, &#x27;(-2,2)를 지나고 ⑴ y=2x+5 ⑵ 2x+3y-4=0에 수직인 직선&#x27;)}${problem(&#x27;생각 넓히기&#x27;, &#x27;A(-2,-3), B(6,5)의 수직이등분선을 두 가지 방법으로 구한다.&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 예제 2&#x27;, `&lt;p&gt;x-2y+2=0의 기울기는 1/2. 수직인 직선의 기울기는 -2이다.&lt;/p&gt;${formula(&#x27;(4,1)을 지나므로 &lt;strong&gt;y=-2x+9&lt;/strong&gt;&#x27;)}`),
              step(&#x27;2단계 · 문제 3&#x27;, answer(&#x27;⑴ y=-(1/2)x+1 &amp;nbsp;&amp;nbsp; ⑵ y=(3/2)x+5&#x27;)),
              step(&#x27;3단계 · 수직이등분선&#x27;, `&lt;p&gt;AB의 중점은 (2,1), AB의 기울기는 1이므로 수직인 기울기는 -1이다.&lt;/p&gt;${formula(&#x27;&lt;strong&gt;y=-x+3&lt;/strong&gt;&#x27;)}&lt;p&gt;두 점까지의 거리가 같다고 두어도 같은 식을 얻는다.&lt;/p&gt;`)
            ] })
        ].join(&#x27;&#x27;);
      }

      function distanceCards() {
        return [
          card({ id:&#x27;p23&#x27;, page:23, pdf:15, labels:[&#x27;생각 열기&#x27;,&#x27;개념&#x27;], kind:&#x27;thinking&#x27;, title:&#x27;점과 직선 사이의 거리 유도 ①&#x27;, subtitle:&#x27;학습 목표: 점과 직선 사이의 거리를 구하고 관련 문제를 해결한다.&#x27;,
            body:`&lt;p class=&quot;thought-opening&quot;&gt;&lt;strong&gt;생각 열기&lt;/strong&gt;&lt;span&gt;방사형 사장교: 네 점 A, B, C, D 중 주탑 위의 P에서 가장 가까운 점을 찾는다.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;점과 직선 사이의 거리는 그 점에서 직선에 이르는 &lt;strong&gt;최단 거리&lt;/strong&gt;이다. P(x₁,y₁)에서 l:ax+by+c=0에 내린 수선의 발을 H(x₂,y₂)라 하면 거리는 PH이다.&lt;/p&gt;`,
            steps:[
              step(&#x27;1단계 · 수선의 기울기&#x27;, `&lt;p&gt;a≠0, b≠0일 때 l의 기울기는 -a/b, PH의 기울기는 b/a이다.&lt;/p&gt;${formula(&#x27;y₂-y₁=(b/a)(x₂-x₁) ··· ①&#x27;)}`),
              step(&#x27;2단계 · H가 직선 위에 있음&#x27;, `${formula(&#x27;ax₂+by₂+c=0 ··· ②&#x27;)}`),
              step(&#x27;3단계 · 두 식 변형&#x27;, `${formula(&#x27;b(x₂-x₁)-a(y₂-y₁)=0 ··· ③&#x27;)} ${formula(&#x27;a(x₂-x₁)+b(y₂-y₁)+ax₁+by₁+c=0 ··· ④&#x27;)}`)
            ] }),
          card({ id:&#x27;p24&#x27;, page:24, pdf:16, labels:[&#x27;개념&#x27;,&#x27;문제 1&#x27;,&#x27;문제 2&#x27;], kind:&#x27;concept&#x27;, title:&#x27;점과 직선 사이의 거리 공식&#x27;, subtitle:&#x27;③과 ④를 연립하여 PH를 계산한다.&#x27;,
            body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;문제 1&#x27;, &#x27;⑴ (2,2)와 6x+8y-3=0 ⑵ 원점과 y=3x-10 사이의 거리&#x27;)}${problem(&#x27;문제 2&#x27;, &#x27;평행한 두 직선 x+2y+1=0과 x+2y+6=0 사이의 거리&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 좌표 차&#x27;, `${formula(&#x27;x₂-x₁=-a(ax₁+by₁+c)/(a²+b²)&#x27;)} ${formula(&#x27;y₂-y₁=-b(ax₁+by₁+c)/(a²+b²)&#x27;)}`),
              step(&#x27;2단계 · 거리 공식&#x27;, `${formula(&#x27;&lt;strong&gt;d=|ax₁+by₁+c|/√(a²+b²)&lt;/strong&gt;&#x27;)}&lt;p&gt;a=0 또는 b=0인 경우에도 같은 공식이 성립한다. 원점과의 거리는 |c|/√(a²+b²)이다.&lt;/p&gt;`),
              step(&#x27;3단계 · 보기&#x27;, `${formula(&#x27;(3,5)와 4x-3y-12=0 사이의 거리 = &lt;strong&gt;3&lt;/strong&gt;&#x27;)}`),
              step(&#x27;4단계 · 시뮬레이션&#x27;, `&lt;div class=&quot;sim-panel&quot;&gt;&lt;div class=&quot;status-row&quot;&gt;&lt;span id=&quot;point-line-result&quot; class=&quot;viz-badge&quot;&gt;d=3&lt;/span&gt;&lt;span id=&quot;point-line-detail&quot;&gt;|4·3-3·5-12|/5=3&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sim-controls&quot;&gt;&lt;label class=&quot;form-label&quot; for=&quot;point-x&quot;&gt;x₁=&lt;span id=&quot;point-x-value&quot;&gt;3&lt;/span&gt;&lt;input id=&quot;point-x&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-2&quot; max=&quot;6&quot; step=&quot;1&quot; value=&quot;3&quot;&gt;&lt;/label&gt;&lt;label class=&quot;form-label&quot; for=&quot;point-y&quot;&gt;y₁=&lt;span id=&quot;point-y-value&quot;&gt;5&lt;/span&gt;&lt;input id=&quot;point-y&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-2&quot; max=&quot;7&quot; step=&quot;1&quot; value=&quot;5&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;svg id=&quot;point-line-svg&quot; viewBox=&quot;0 0 520 420&quot; role=&quot;img&quot; aria-label=&quot;점과 직선 사이의 거리 시뮬레이션&quot;&gt;&lt;title&gt;점과 직선 사이의 거리&lt;/title&gt;&lt;/svg&gt;&lt;/div&gt;`),
              step(&#x27;5단계 · 문제 확인&#x27;, answer(&#x27;문제 1: ⑴ 5/2 ⑵ √10&lt;br&gt;문제 2: √5&#x27;))
            ] }),
          card({ id:&#x27;p25&#x27;, page:25, pdf:17, labels:[&#x27;개념&#x27;,&#x27;예제 1&#x27;,&#x27;문제 3&#x27;,&#x27;생각 넓히기&#x27;], kind:&#x27;concept&#x27;, title:&#x27;거리 공식의 적용&#x27;, subtitle:&#x27;평행선의 방정식과 삼각형의 넓이에 연결한다.&#x27;,
            body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;예제 1&#x27;, &#x27;x-3y+2=0에 평행하고 원점에서의 거리가 √10인 직선&#x27;)}${problem(&#x27;문제 3&#x27;, &#x27;⑴ 3x+4y-5=0에 평행하고 원점에서의 거리가 2인 직선 ⑵ 2x-y-4=0에 수직이고 (2,-1)에서의 거리가 4인 직선&#x27;)}${problem(&#x27;생각 넓히기&#x27;, &#x27;O(0,0), A(x₁,y₁), B(x₂,y₂)로 만든 삼각형 OAB의 넓이를 원점과 직선 AB 사이의 거리로 구한다.&#x27;)}&lt;/div&gt;`,
            steps:[
              step(&#x27;1단계 · 예제 1의 평행선&#x27;, `&lt;p&gt;기울기가 1/3이므로 x-3y+3k=0으로 둔다.&lt;/p&gt;`),
              step(&#x27;2단계 · 원점에서의 거리&#x27;, `${formula(&#x27;|3k|/√10=√10 → |3k|=10&#x27;)}`),

      function circleLessonCards() {
        return [
          card({ id:&#x27;c30-open&#x27;, page:30, label:&#x27;생각 열기&#x27;, kind:&#x27;thinking&#x27;, title:&#x27;정부 상징 문양의 가장자리 점&#x27;, subtitle:&#x27;학습 목표: 원의 방정식을 구하고, 그래프를 그릴 수 있다.&#x27;, body:`&lt;p&gt;오른쪽 그림은 반지름의 길이가 10인 원 모양의 우리나라 정부 상징 문양을 중심이 원점 O와 일치하도록 좌표평면 위에 나타낸 것이다.&lt;/p&gt;&lt;p&gt;문양의 가장자리의 한 점을 P(x,y)라 할 때, OP=10을 이용하여 다음 식을 완성해 보자.&lt;/p&gt;${formula(&#x27;x²+y²=□&#x27;)}`, visual:governmentCircleFigure(), steps:[step(&#x27;1단계: 원점에서 P까지의 거리를 식으로 나타낸다&#x27;, `${formula(&#x27;OP=√(x²+y²)&#x27;)}&lt;p&gt;점 P가 어느 곳에 있더라도 원점에서의 거리는 10이다.&lt;/p&gt;`),step(&#x27;2단계: OP=10을 대입한다&#x27;, formula(&#x27;√(x²+y²)=10&#x27;)),step(&#x27;3단계: 양변을 제곱한다&#x27;, formula(&#x27;x²+y²=100&#x27;)),answer(&#x27;빈칸은 100이다.&#x27;)] }),
          card({ id:&#x27;c30-concept&#x27;, page:30, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;중심과 반지름으로 원의 방정식 만들기&#x27;, body:`&lt;p&gt;좌표평면 위의 한 점 C(a,b)를 중심으로 하고 반지름의 길이가 r인 원을 생각한다. 원 위의 점을 P(x,y)라 하면 CP=r이다.&lt;/p&gt;`, visual:circleDefinitionFigure(), steps:[step(&#x27;1단계: 두 점 C와 P 사이의 거리를 쓴다&#x27;, formula(&#x27;CP=√{(x-a)²+(y-b)²}&#x27;)),step(&#x27;2단계: 원 위의 점이므로 거리가 r임을 이용한다&#x27;, formula(&#x27;√{(x-a)²+(y-b)²}=r&#x27;)),step(&#x27;3단계: 양변을 제곱한다&#x27;, formula(&#x27;(x-a)²+(y-b)²=r²&#x27;)),step(&#x27;4단계: 반대 방향도 확인한다&#x27;, &#x27;&lt;p&gt;이 식을 만족하는 P(x,y)는 중심 C에서의 거리가 r이므로 반드시 원 위의 점이다.&lt;/p&gt;&#x27;),step(&#x27;5단계: 중심과 반지름을 움직여 식과 그래프를 함께 확인한다&#x27;, circleCenterRadiusSimulation()),answer(&#x27;중심이 (a,b), 반지름이 r인 원: (x-a)²+(y-b)²=r²&#x27;)] }),
          card({ id:&#x27;c31-view&#x27;, page:31, label:&#x27;보기&#x27;, kind:&#x27;example&#x27;, title:&#x27;원의 방정식에 중심과 반지름을 넣기&#x27;, body:`&lt;p&gt;특히 중심이 원점이면 a=0, b=0이므로 x²+y²=r²이다.&lt;/p&gt;`, steps:[step(&#x27;보기 ①: 중심 (2,-1), 반지름 3&#x27;, `${formula(&#x27;(x-2)²+{y-(-1)}²=3²&#x27;)}${formula(&#x27;(x-2)²+(y+1)²=9&#x27;)}`),step(&#x27;보기 ②: 중심이 원점, 반지름 √5&#x27;, `${formula(&#x27;x²+y²=(√5)²&#x27;)}${formula(&#x27;x²+y²=5&#x27;)}`)] }),
          card({ id:&#x27;c31-p1&#x27;, page:31, label:&#x27;문제 1&#x27;, kind:&#x27;problem&#x27;, title:&#x27;다음 원의 방정식을 구하시오&#x27;, body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;중심의 좌표가 (-3,0)이고 반지름의 길이가 2인 원&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;중심이 원점이고 점 (3,-4)를 지나는 원&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: 중심과 반지름을 확인한다&#x27;, formula(&#x27;a=-3, b=0, r=2&#x27;)),step(&#x27;⑴ 2단계: 원의 방정식에 대입한다&#x27;, formula(&#x27;(x+3)²+y²=4&#x27;)),step(&#x27;⑵ 1단계: 반지름을 먼저 구한다&#x27;, `${formula(&#x27;r=√(3²+(-4)²)=5&#x27;)}&lt;p&gt;원점에서 (3,-4)까지의 거리가 반지름이다.&lt;/p&gt;`),step(&#x27;⑵ 2단계: 중심이 원점인 식에 대입한다&#x27;, formula(&#x27;x²+y²=25&#x27;)),answer(&#x27;⑴ (x+3)²+y²=4　⑵ x²+y²=25&#x27;)] }),
          card({ id:&#x27;c31-ex1&#x27;, page:31, label:&#x27;예제 1&#x27;, kind:&#x27;example&#x27;, title:&#x27;두 점을 지름의 양 끝점으로 하는 원&#x27;, body:`&lt;p&gt;두 점 A(2,8)과 B(10,2)를 지름의 양 끝점으로 하는 원의 방정식을 구하고, 그 원을 그리시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 원의 중심을 C(a,b)라 둔다&#x27;, &#x27;&lt;p&gt;지름의 양 끝점이 A와 B이므로 원의 중심 C는 선분 AB의 중점이다. 따라서 a는 두 x좌표의 평균, b는 두 y좌표의 평균이다.&lt;/p&gt;&#x27;),step(&#x27;2단계: 중점 공식으로 a와 b를 구한다&#x27;, `${formula(&#x27;a=(2+10)/2=6&#x27;)}${formula(&#x27;b=(8+2)/2=5&#x27;)}&lt;p&gt;따라서 원의 중심은 C(6,5)이다.&lt;/p&gt;`),step(&#x27;3단계: 중심 C에서 지름의 끝점 A까지의 거리를 구한다&#x27;, `${formula(&#x27;AC=√{(6-2)²+(5-8)²}&#x27;)}${formula(&#x27;AC=√(16+9)=√25=5&#x27;)}&lt;p&gt;중심에서 원 위의 점까지의 거리가 반지름이므로 r=5이다.&lt;/p&gt;`),step(&#x27;4단계: 중심과 반지름을 원의 방정식에 대입한다&#x27;, `${formula(&#x27;(x-a)²+(y-b)²=r²&#x27;)}${formula(&#x27;(x-6)²+(y-5)²=25&#x27;)}`),step(&#x27;마지막 단계: 정답과 그래프 확인&#x27;, `${answer(&#x27;(x-6)²+(y-5)²=25&#x27;)}${diameterExampleFigure()}`)] }),
          card({ id:&#x27;c31-p2&#x27;, page:31, label:&#x27;문제 2&#x27;, kind:&#x27;problem&#x27;, title:&#x27;지름의 양 끝점에서 원의 방정식 구하기&#x27;, body:`&lt;p&gt;두 점 A(-4,10)과 B(8,-6)을 지름의 양 끝점으로 하는 원의 방정식을 구하고, 그 원을 그리시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 원의 중심을 C(a,b)라 둔다&#x27;, &#x27;&lt;p&gt;원의 중심 C는 지름 AB의 중점이다. 두 끝점의 같은 종류의 좌표끼리 더한 뒤 2로 나눈다.&lt;/p&gt;&#x27;),step(&#x27;2단계: 중점 공식으로 중심을 구한다&#x27;, `${formula(&#x27;a={-4+8}/2=2&#x27;)}${formula(&#x27;b={10+(-6)}/2=2&#x27;)}&lt;p&gt;따라서 원의 중심은 C(2,2)이다.&lt;/p&gt;`),step(&#x27;3단계: 중심 C에서 A까지의 거리를 구한다&#x27;, `${formula(&#x27;AC=√{(-4-2)²+(10-2)²}&#x27;)}${formula(&#x27;AC=√(36+64)=√100=10&#x27;)}&lt;p&gt;그러므로 반지름은 r=10이다.&lt;/p&gt;`),step(&#x27;4단계: 원의 방정식에 대입한다&#x27;, `${formula(&#x27;(x-a)²+(y-b)²=r²&#x27;)}${formula(&#x27;(x-2)²+(y-2)²=100&#x27;)}`),step(&#x27;마지막 단계: 정답과 그래프 확인&#x27;, `${answer(&#x27;(x-2)²+(y-2)²=100&#x27;)}${diameterProblemFigure()}`)] }),
          card({ id:&#x27;c32-ex2&#x27;, page:32, label:&#x27;예제 2&#x27;, kind:&#x27;example&#x27;, title:&#x27;세 점을 지나는 원의 방정식&#x27;, body:`&lt;p&gt;세 점 A(1,5), B(2,4), C(-1,1)을 지나는 원의 방정식을 구하시오.&lt;/p&gt;`, visual:threePointCircleFigure(), steps:[step(&#x27;1단계: 중심을 P(a,b)라 둔다&#x27;, &#x27;&lt;p&gt;외심에서 세 꼭짓점까지의 거리가 같으므로 PA=PB=PC이다. 계산을 쉽게 하려고 거리의 제곱을 비교한다.&lt;/p&gt;&#x27;),step(&#x27;2단계: PA²=PB²를 정리한다&#x27;, `${formula(&#x27;(a-1)²+(b-5)²=(a-2)²+(b-4)²&#x27;)}${formula(&#x27;a-b+3=0 ··· ①&#x27;)}`),step(&#x27;3단계: PB²=PC²를 정리한다&#x27;, `${formula(&#x27;(a-2)²+(b-4)²=(a+1)²+(b-1)²&#x27;)}${formula(&#x27;a+b-3=0 ··· ②&#x27;)}`),step(&#x27;4단계: ①과 ②를 연립한다&#x27;, formula(&#x27;a=0, b=3&#x27;)),step(&#x27;5단계: 반지름을 구한다&#x27;, formula(&#x27;PA=√{(1-0)²+(5-3)²}=√5&#x27;)),step(&#x27;6단계: 원의 방정식을 완성한다&#x27;, formula(&#x27;x²+(y-3)²=5&#x27;)),answer(&#x27;x²+(y-3)²=5&#x27;)] }),
          card({ id:&#x27;c32-p3&#x27;, page:32, label:&#x27;문제 3&#x27;, kind:&#x27;problem&#x27;, title:&#x27;세 점 A, B, C를 지나는 원&#x27;, body:`&lt;p&gt;세 점 A(-2,6), B(-5,-3), C(2,-2)를 지나는 원의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 중심을 P(a,b)라 둔다&#x27;, &#x27;&lt;p&gt;PA²=PB²와 PB²=PC²를 이용한다.&lt;/p&gt;&#x27;),step(&#x27;2단계: 첫 번째 식을 정리한다&#x27;, `${formula(&#x27;(a+2)²+(b-6)²=(a+5)²+(b+3)²&#x27;)}${formula(&#x27;a+3b-1=0 ··· ①&#x27;)}`),step(&#x27;3단계: 두 번째 식을 정리한다&#x27;, `${formula(&#x27;(a+5)²+(b+3)²=(a-2)²+(b+2)²&#x27;)}${formula(&#x27;7a+b+13=0 ··· ②&#x27;)}`),step(&#x27;4단계: 연립하여 중심을 구한다&#x27;, formula(&#x27;a=-2, b=1&#x27;)),step(&#x27;5단계: 반지름을 구한다&#x27;, formula(&#x27;PA=√{0²+5²}=5&#x27;)),step(&#x27;6단계: 원의 방정식을 쓴다&#x27;, formula(&#x27;(x+2)²+(y-1)²=25&#x27;)),answer(&#x27;(x+2)²+(y-1)²=25&#x27;)] }),
          card({ id:&#x27;c32-general&#x27;, page:32, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;이차방정식이 나타내는 원&#x27;, body:`&lt;p&gt;원의 방정식 (x-a)²+(y-b)²=r²을 전개하면 x²+y²+Ax+By+C=0 꼴이 된다. 반대로 x항과 y항을 각각 완전제곱식으로 고치면 중심과 반지름을 찾을 수 있다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 상수항 C를 오른쪽으로 옮긴다&#x27;, formula(&#x27;x²+Ax+y²+By=-C&#x27;)),step(&#x27;2단계: x항과 y항에 필요한 수를 양변에 더한다&#x27;, `${formula(&#x27;x²+Ax+(A/2)²+y²+By+(B/2)²&#x27;)}${formula(&#x27;=-C+(A/2)²+(B/2)²&#x27;)}&lt;p&gt;양변에 같은 수를 더해야 등식이 그대로 유지된다.&lt;/p&gt;`),step(&#x27;3단계: 완전제곱식으로 묶는다&#x27;, formula(&#x27;(x+A/2)²+(y+B/2)²=(A²+B²-4C)/4&#x27;)),step(&#x27;4단계: 중심과 반지름을 읽는다&#x27;, `${formula(&#x27;중심=(-A/2,-B/2)&#x27;)}${formula(&#x27;r=√(A²+B²-4C)/2&#x27;)}`),step(&#x27;5단계: 실제 원이 되는 조건을 확인한다&#x27;, &#x27;&lt;p&gt;반지름의 제곱은 양수여야 한다. A²+B²-4C&amp;gt;0이면 원, =0이면 한 점, &amp;lt;0이면 식을 만족하는 실수 x,y가 없다.&lt;/p&gt;&#x27;),step(&#x27;마지막 단계: 표준형을 분수까지 정확히 정리한다&#x27;, `${answer(&#x27;표준형은 다음과 같다.&#x27;)}${formula(&#x27;(x+A/2)²+(y+B/2)²=(A²+B²-4C)/4&#x27;)}`)] }),
          card({ id:&#x27;c33-ex3&#x27;, page:33, label:&#x27;예제 3&#x27;, kind:&#x27;example&#x27;, title:&#x27;일반형을 표준형으로 바꾸기&#x27;, body:`&lt;p&gt;방정식 x²+y²+6x-4y-3=0이 나타내는 도형을 말하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 상수항을 오른쪽으로 옮긴다&#x27;, formula(&#x27;x²+6x+y²-4y=3&#x27;)),step(&#x27;2단계: x와 y에 필요한 수를 각각 더한다&#x27;, `${formula(&#x27;x²+6x+9+y²-4y+4=3+9+4&#x27;)}&lt;p&gt;양변에 같은 수를 더해야 등식이 유지된다.&lt;/p&gt;`),step(&#x27;3단계: 완전제곱식으로 묶는다&#x27;, formula(&#x27;(x+3)²+(y-2)²=16&#x27;)),step(&#x27;4단계: 중심과 반지름을 읽는다&#x27;, formula(&#x27;중심=(-3,2), r=4&#x27;)),answer(&#x27;중심이 (-3,2)이고 반지름이 4인 원&#x27;)] }),
          card({ id:&#x27;c33-p4&#x27;, page:33, label:&#x27;문제 4&#x27;, kind:&#x27;problem&#x27;, title:&#x27;방정식이 나타내는 도형을 말하시오&#x27;, body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;x²+y²+4x=0&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;x²+y²-10x-8y-8=0&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: x항끼리 모으고 완전제곱에 필요한 수를 찾는다&#x27;, `${formula(&#x27;x²+4x+y²=0&#x27;)}&lt;p&gt;x²+4x에서 4의 절반은 2이고, 그 제곱은 4이다.&lt;/p&gt;`),step(&#x27;⑴ 2단계: 양변에 4를 더해 완전제곱식으로 만든다&#x27;, `${formula(&#x27;x²+4x+4+y²=4&#x27;)}${formula(&#x27;(x+2)²+y²=4&#x27;)}`),step(&#x27;⑴ 3단계: 중심과 반지름을 읽는다&#x27;, &#x27;&lt;p&gt;(x+2)²=(x-(-2))²이므로 중심은 (-2,0), 반지름은 √4=2이다.&lt;/p&gt;&#x27;),step(&#x27;⑵ 1단계: 상수항을 옮기고 x항, y항을 나누어 본다&#x27;, `${formula(&#x27;x²-10x+y²-8y=8&#x27;)}&lt;p&gt;x²-10x에는 25를, y²-8y에는 16을 더하면 완전제곱식이 된다.&lt;/p&gt;`),step(&#x27;⑵ 2단계: 양변에 25와 16을 더한다&#x27;, `${formula(&#x27;x²-10x+25+y²-8y+16=8+25+16&#x27;)}${formula(&#x27;(x-5)²+(y-4)²=49&#x27;)}`),step(&#x27;⑵ 3단계: 중심과 반지름을 읽는다&#x27;, &#x27;&lt;p&gt;중심은 (5,4), 반지름은 √49=7이다.&lt;/p&gt;&#x27;),answer(&#x27;⑴ 중심 (-2,0), 반지름 2인 원&lt;br&gt;⑵ 중심 (5,4), 반지름 7인 원&#x27;)] }),
          card({ id:&#x27;c33-p5&#x27;, page:33, label:&#x27;문제 5&#x27;, kind:&#x27;problem&#x27;, title:&#x27;방정식이 원을 나타내도록 하는 k의 범위&#x27;, body:`&lt;p&gt;x²+y²-2x+6y+k=0이 나타내는 도형이 원이 되도록 하는 실수 k의 값의 범위를 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: x항과 y항을 모으고 상수항을 옮긴다&#x27;, formula(&#x27;x²-2x+y²+6y=-k&#x27;)),step(&#x27;2단계: 완전제곱에 필요한 수를 양변에 더한다&#x27;, `${formula(&#x27;x²-2x+1+y²+6y+9=-k+10&#x27;)}${formula(&#x27;(x-1)²+(y+3)²=10-k&#x27;)}`),step(&#x27;3단계: 오른쪽이 반지름의 제곱임을 확인한다&#x27;, &#x27;&lt;p&gt;이 식의 중심은 (1,-3)이고 반지름의 제곱은 10-k이다.&lt;/p&gt;&#x27;),step(&#x27;4단계: 원이 되려면 반지름의 제곱이 양수여야 한다&#x27;, `${formula(&#x27;10-k&gt;0&#x27;)}${formula(&#x27;k&lt;10&#x27;)}&lt;p&gt;10-k=0이면 원이 아니라 한 점이고, 10-k&amp;lt;0이면 식을 만족하는 점이 없다.&lt;/p&gt;`),answer(&#x27;k&amp;lt;10&#x27;)] }),
          card({ id:&#x27;c33-think&#x27;, page:33, label:&#x27;생각 넓히기&#x27;, kind:&#x27;thinking&#x27;, title:&#x27;점 C가 지름 AB인 원 위에 있는지 세 방법으로 확인하기&#x27;, body:`&lt;p&gt;두 점 A(2,2), B(6,-4)를 지름의 양 끝점으로 하는 원 위에 C(7,1)이 있는지를 민호, 보아, 진우의 세 방법으로 확인한다.&lt;/p&gt;&lt;p&gt;세 방법은 각각 원의 방정식, 두 직선의 기울기, 세 변의 길이를 이용하지만 모두 “지름을 보는 원주각은 90°”라는 같은 사실을 확인한다.&lt;/p&gt;`, steps:[step(&#x27;방법 1 · 1단계: 지름의 중점과 반지름의 제곱을 구한다&#x27;, `${formula(&#x27;M=((2+6)/2,(2+(-4))/2)=(4,-1)&#x27;)}${formula(&#x27;r²=MA²=(4-2)²+(-1-2)²=13&#x27;)}`),step(&#x27;방법 1 · 2단계: 원의 방정식에 C(7,1)을 대입한다&#x27;, `${formula(&#x27;(x-4)²+(y+1)²=13&#x27;)}${formula(&#x27;(7-4)²+(1+1)²=9+4=13&#x27;)}&lt;p&gt;왼쪽이 오른쪽과 같으므로 C는 원 위에 있다.&lt;/p&gt;`),step(&#x27;방법 2 · 1단계: AC와 BC의 기울기를 각각 구한다&#x27;, `${formula(&#x27;AC의 기울기=(1-2)/(7-2)=-1/5&#x27;)}${formula(&#x27;BC의 기울기={1-(-4)}/{7-6}=5&#x27;)}`),step(&#x27;방법 2 · 2단계: 두 기울기의 곱을 확인한다&#x27;, `${formula(&#x27;(-1/5)×5=-1&#x27;)}&lt;p&gt;두 기울기의 곱이 -1이므로 AC와 BC는 서로 수직이고, ∠ACB=90°이다.&lt;/p&gt;`),step(&#x27;방법 3 · 1단계: 세 선분의 길이의 제곱을 각각 구한다&#x27;, `${formula(&#x27;AC²=(7-2)²+(1-2)²=25+1=26&#x27;)}${formula(&#x27;BC²=(7-6)²+{1-(-4)}²=1+25=26&#x27;)}${formula(&#x27;AB²=(6-2)²+(-4-2)²=16+36=52&#x27;)}`),step(&#x27;방법 3 · 2단계: 피타고라스 정리의 역을 확인한다&#x27;, `${formula(&#x27;AC²+BC²=26+26=52=AB²&#x27;)}&lt;p&gt;따라서 ∠ACB=90°이고, C는 지름 AB인 원 위에 있다.&lt;/p&gt;`),step(&#x27;마지막 단계: 세 방법의 결론을 그림으로 확인한다&#x27;, `${answer(&#x27;세 방법 모두 점 C가 지름 AB인 원 위에 있음을 확인한다.&#x27;)}${diameterMembershipFigure()}`)] })
        ].join(&#x27;&#x27;);
      }

      function relationLessonCards() {
        return [

          card({ id:&#x27;r35-concept&#x27;, page:35, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;판별식으로 원과 직선의 위치 관계 판단하기&#x27;, body:`&lt;p&gt;원 x²+y²=r²과 직선 y=mx+n이 만나는 점은 두 식을 동시에 만족한다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 직선의 y를 원의 식에 대입한다&#x27;, formula(&#x27;x²+(mx+n)²=r²&#x27;)),step(&#x27;2단계: x에 대한 이차방정식으로 정리한다&#x27;, formula(&#x27;(m²+1)x²+2mnx+n²-r²=0&#x27;)),step(&#x27;3단계: 교점의 개수와 실근의 개수를 연결한다&#x27;, &#x27;&lt;p&gt;이 이차방정식의 실근 하나가 교점의 x좌표 하나에 대응한다.&lt;/p&gt;&#x27;),step(&#x27;4단계: 판별식 D로 정리한다&#x27;, &#x27;&lt;p&gt;D&amp;gt;0이면 서로 다른 두 점, D=0이면 한 점에서 접하고, D&amp;lt;0이면 만나지 않는다.&lt;/p&gt;&#x27;),step(&#x27;마지막 단계: 판별식과 위치 관계를 그림으로 정리한다&#x27;, `&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;①&#x27;,&#x27;D&amp;gt;0이면 서로 다른 두 점에서 만난다.&#x27;)}${problem(&#x27;②&#x27;,&#x27;D=0이면 한 점에서 만나며 원에 접한다.&#x27;)}${problem(&#x27;③&#x27;,&#x27;D&amp;lt;0이면 만나지 않는다.&#x27;)}&lt;/div&gt;${discriminantSummaryFigure()}${answer(&#x27;교점의 개수는 대입하여 얻은 이차방정식의 실근의 개수와 같다.&#x27;)}`)] }),

      function tangentLessonCards() {

          card({ id:&#x27;t37-concept&#x27;, page:37, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;기울기가 주어진 원의 접선의 방정식&#x27;, body:`&lt;p&gt;원 x²+y²=r²에 접하고 기울기가 m인 직선을 y=mx+n이라 둔다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 직선을 원에 대입한다&#x27;, formula(&#x27;(m²+1)x²+2mnx+n²-r²=0&#x27;)),step(&#x27;2단계: 접하므로 판별식이 0이다&#x27;, formula(&#x27;D=4{r²(m²+1)-n²}=0&#x27;)),step(&#x27;3단계: n을 구한다&#x27;, `${formula(&#x27;n²=r²(m²+1)&#x27;)}${formula(&#x27;n=±r√(m²+1)&#x27;)}`),step(&#x27;4단계: 접선 공식을 두 직선으로 나누어 쓴다&#x27;, `${formula(&#x27;y=mx+r√(m²+1)&#x27;)}${formula(&#x27;y=mx-r√(m²+1)&#x27;)}&lt;p&gt;부호가 +인 접선과 -인 접선, 모두 두 개이다.&lt;/p&gt;`),step(&#x27;5단계: 기울기를 움직여 같은 기울기의 접선 두 개를 확인한다&#x27;, tangentSlopeSimulation()),step(&#x27;보기: x²+y²=4에 접하고 기울기가 3인 직선&#x27;, `${formula(&#x27;y=3x+2√10&#x27;)}${formula(&#x27;y=3x-2√10&#x27;)}`),step(&#x27;마지막 단계: 공식을 한눈에 정리한다&#x27;, `${answer(&#x27;기울기가 m인 접선은 부호에 따라 두 개이다.&#x27;)}${formula(&#x27;y=mx+r√(m²+1)&#x27;)}${formula(&#x27;y=mx-r√(m²+1)&#x27;)}`)] }),
          card({ id:&#x27;t37-p3&#x27;, page:37, label:&#x27;문제 3&#x27;, kind:&#x27;problem&#x27;, title:&#x27;다음 직선의 방정식을 구하시오&#x27;, body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;원 x²+y²=2에 접하고 기울기가 -1인 직선&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;원 x²+y²=1에 접하고 직선 x-2y+1=0에 수직인 직선&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: 반지름과 접선의 기울기를 확인한다&#x27;, `${formula(&#x27;r=√2&#x27;)}${formula(&#x27;m=-1&#x27;)}`),step(&#x27;⑴ 2단계: 기울기가 주어진 접선 공식에 대입한다&#x27;, `${formula(&#x27;y=mx±r√(m²+1)&#x27;)}${formula(&#x27;y=-x±√2√{(-1)²+1}&#x27;)}`),step(&#x27;⑴ 3단계: 근호를 계산하여 두 직선을 나눈다&#x27;, `${formula(&#x27;y=-x±2&#x27;)}${formula(&#x27;y=-x+2 또는 y=-x-2&#x27;)}`),step(&#x27;⑵ 1단계: 주어진 직선의 기울기를 구한다&#x27;, `${formula(&#x27;x-2y+1=0 → y=(1/2)x+1/2&#x27;)}&lt;p&gt;주어진 직선의 기울기는 1/2이다.&lt;/p&gt;`),step(&#x27;⑵ 2단계: 서로 수직인 두 직선의 기울기 관계를 이용한다&#x27;, `${formula(&#x27;(1/2)×m=-1&#x27;)}${formula(&#x27;m=-2&#x27;)}&lt;p&gt;따라서 구하려는 접선의 기울기는 -2이다.&lt;/p&gt;`),step(&#x27;⑵ 3단계: r=1, m=-2를 접선 공식에 대입한다&#x27;, `${formula(&#x27;y=-2x±√{(-2)²+1}&#x27;)}${formula(&#x27;y=-2x±√5&#x27;)}`),step(&#x27;⑵ 4단계: 두 접선을 각각 쓴다&#x27;, formula(&#x27;y=-2x+√5 또는 y=-2x-√5&#x27;)),answer(&#x27;⑴ y=-x+2 또는 y=-x-2&lt;br&gt;⑵ y=-2x+√5 또는 y=-2x-√5&#x27;)] }),
          card({ id:&#x27;t38-concept&#x27;, page:38, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;원 위의 한 점에서의 접선&#x27;, body:`&lt;p&gt;원 x²+y²=r² 위의 점 P(x₁,y₁)에서의 접선은 접점 P를 지나고, 반지름 OP와 서로 수직이다.&lt;/p&gt;`, visual:tangentAtPointFigure(), steps:[step(&#x27;1단계: 반지름 OP의 기울기를 구한다&#x27;, `${formula(&#x27;OP의 기울기=y₁/x₁&#x27;)}&lt;p&gt;x₁과 y₁이 0이 아닌 경우부터 생각한다.&lt;/p&gt;`),step(&#x27;2단계: 수직인 두 직선의 기울기의 곱이 -1임을 이용한다&#x27;, `${formula(&#x27;(y₁/x₁)×(접선의 기울기)=-1&#x27;)}${formula(&#x27;접선의 기울기=-(x₁/y₁)&#x27;)}&lt;p&gt;음의 부호는 분수 전체의 앞에 둔다.&lt;/p&gt;`),step(&#x27;3단계: 접점 P(x₁,y₁)을 지나는 점-기울기 꼴을 쓴다&#x27;, formula(&#x27;y-y₁=-(x₁/y₁)(x-x₁)&#x27;)),step(&#x27;4단계: 분모를 없애고 항을 차례로 정리한다&#x27;, `${formula(&#x27;y₁(y-y₁)=-x₁(x-x₁)&#x27;)}${formula(&#x27;x₁x+y₁y=x₁²+y₁²&#x27;)}`),step(&#x27;5단계: P가 원 위의 점임을 이용한다&#x27;, `${formula(&#x27;x₁²+y₁²=r²&#x27;)}${formula(&#x27;x₁x+y₁y=r²&#x27;)}`),step(&#x27;6단계: 접점 P가 좌표축 위의 점인 경우&#x27;, `${formula(&#x27;P=(0,±r) → y=±r&#x27;)}${formula(&#x27;P=(±r,0) → x=±r&#x27;)}&lt;p&gt;이 네 접선도 x₁x+y₁y=r²에 그대로 대입하여 얻을 수 있다.&lt;/p&gt;${axisTangentsFigure()}`),step(&#x27;마지막 단계: 원 위의 점에서의 접선 공식을 정리한다&#x27;, `${answer(&#x27;접점의 두 좌표를 x와 y의 계수로 사용한다.&#x27;)}${formula(&#x27;x₁x+y₁y=r²&#x27;)}`)] }),
          card({ id:&#x27;t38-view&#x27;, page:38, label:&#x27;보기&#x27;, kind:&#x27;example&#x27;, title:&#x27;원 위의 점을 접선 공식에 넣기&#x27;, body:`&lt;p&gt;원 x²+y²=25 위의 점 (4,3)에서의 접선의 방정식을 구한다.&lt;/p&gt;`, steps:[step(&#x27;1단계: x₁=4, y₁=3, r²=25를 확인한다&#x27;, formula(&#x27;x₁x+y₁y=r²&#x27;)),step(&#x27;2단계: 그대로 대입한다&#x27;, formula(&#x27;4x+3y=25&#x27;)),answer(&#x27;4x+3y=25&#x27;)] }),
          card({ id:&#x27;t38-p4&#x27;, page:38, label:&#x27;문제 4&#x27;, kind:&#x27;problem&#x27;, title:&#x27;원 위의 다음 점에서의 접선&#x27;, body:`&lt;p&gt;원 x²+y²=9 위의 다음 점에서의 접선의 방정식을 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;(2,-√5)&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;(0,-3)&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: 접점의 좌표와 r²을 확인한다&#x27;, `${formula(&#x27;x₁=2, y₁=-√5&#x27;)}${formula(&#x27;r²=9&#x27;)}`),step(&#x27;⑴ 2단계: 접선 공식 x₁x+y₁y=r²에 대입한다&#x27;, formula(&#x27;2x+(-√5)y=9&#x27;)),step(&#x27;⑴ 3단계: 부호를 정리한다&#x27;, formula(&#x27;2x-√5y=9&#x27;)),step(&#x27;⑵ 1단계: 접점의 좌표와 r²을 확인한다&#x27;, `${formula(&#x27;x₁=0, y₁=-3&#x27;)}${formula(&#x27;r²=9&#x27;)}`),step(&#x27;⑵ 2단계: 접선 공식에 대입한다&#x27;, formula(&#x27;0x+(-3)y=9&#x27;)),step(&#x27;⑵ 3단계: 양변을 -3으로 나눈다&#x27;, formula(&#x27;y=-3&#x27;)),answer(&#x27;⑴ 2x-√5y=9　⑵ y=-3&#x27;)] }),
          card({ id:&#x27;t39-together&#x27;, page:39, label:&#x27;함께하기&#x27;, kind:&#x27;example&#x27;, title:&#x27;원 밖의 점 (4,0)에서 원에 그은 접선&#x27;, body:`&lt;p&gt;점 (4,0)에서 원 x²+y²=4에 그은 접선의 방정식을 구하는 과정의 빈칸을 채운다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 접점을 P(x₁,y₁)이라 둔다&#x27;, formula(&#x27;접선: x₁x+y₁y=4&#x27;)),step(&#x27;2단계: 접선이 (4,0)을 지나는 조건을 넣는다&#x27;, `${formula(&#x27;4x₁=4&#x27;)}${formula(&#x27;x₁=1&#x27;)}`),step(&#x27;3단계: P가 원 위의 점임을 이용한다&#x27;, `${formula(&#x27;x₁²+y₁²=4&#x27;)}${formula(&#x27;1+y₁²=4&#x27;)}${formula(&#x27;y₁=√3 또는 y₁=-√3&#x27;)}`),step(&#x27;4단계: 두 접점을 접선 공식에 넣는다&#x27;, `${formula(&#x27;P₁(1,√3) → x+√3y=4&#x27;)}${formula(&#x27;P₂(1,-√3) → x-√3y=4&#x27;)}`),step(&#x27;마지막 단계: 두 접점과 두 접선을 그림으로 확인한다&#x27;, `${answer(&#x27;빈칸: 1, 1, √3, √3, √3&#x27;)}${externalTangentsFigure()}`)] }),
          card({ id:&#x27;t39-p5&#x27;, page:39, label:&#x27;문제 5&#x27;, kind:&#x27;problem&#x27;, title:&#x27;원 밖의 점에서 그은 두 접선&#x27;, body:`&lt;p&gt;점 (3,-1)에서 원 x²+y²=5에 그은 접선의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 접점을 P(x₁,y₁)이라 둔다&#x27;, formula(&#x27;접선: x₁x+y₁y=5&#x27;)),step(&#x27;2단계: 접선이 (3,-1)을 지나므로&#x27;, formula(&#x27;3x₁-y₁=5 ··· ①&#x27;)),step(&#x27;3단계: P가 원 위에 있으므로&#x27;, formula(&#x27;x₁²+y₁²=5 ··· ②&#x27;)),step(&#x27;4단계: ①에서 y₁=3x₁-5를 ②에 대입한다&#x27;, formula(&#x27;x₁²+(3x₁-5)²=5&#x27;)),step(&#x27;5단계: 접점의 x좌표를 구한다&#x27;, `${formula(&#x27;x₁=1 또는 x₁=2&#x27;)}&lt;p&gt;x₁=1이면 y₁=-2이고, x₁=2이면 y₁=1이다.&lt;/p&gt;${formula(&#x27;P₁(1,-2), P₂(2,1)&#x27;)}`),step(&#x27;6단계: 두 접점으로 접선을 쓴다&#x27;, `${formula(&#x27;P₁(1,-2) → x-2y=5&#x27;)}${formula(&#x27;P₂(2,1) → 2x+y=5&#x27;)}`),answer(&#x27;x-2y=5 또는 2x+y=5&#x27;)] }),
          card({ id:&#x27;t39-think&#x27;, page:39, label:&#x27;생각 넓히기&#x27;, kind:&#x27;thinking&#x27;, title:&#x27;중심과 직선 사이의 거리로 원과 접선 확인하기&#x27;, body:`&lt;div class=&quot;thought-opening&quot;&gt;&lt;strong&gt;원의 중심과 직선 사이의 거리를 이용하여 다음 두 활동을 해결해 보자.&lt;/strong&gt;&lt;p&gt;원과 직선의 위치 관계를 알아보거나 원의 접선의 방정식을 구할 때 중심과 직선 사이의 거리를 이용하면 편리하다. 원 (x-1)²+(y-2)²=10의 중심은 C(1,2), 반지름은 √10이다.&lt;/p&gt;&lt;ol class=&quot;thought-questions&quot;&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;1&lt;/span&gt;&lt;span&gt;원의 중심과 직선 y=x-3 사이의 거리를 구하고, 이를 이용하여 원과 직선의 위치 관계를 말해 보자.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;2&lt;/span&gt;&lt;span&gt;점 (-3,0)에서 원에 그은 접선의 기울기가 m일 때, 중심과 접선 사이의 거리가 반지름과 같음을 이용하여 접선의 방정식을 구해 보자.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;`, steps:[step(&#x27;활동 1 · 1단계: 원의 중심과 반지름을 먼저 읽는다&#x27;, `${formula(&#x27;C(1,2)&#x27;)}${formula(&#x27;r=√10&#x27;)}&lt;p&gt;직선과 원의 위치 관계는 중심에서 직선까지의 거리 d와 반지름 r을 비교하여 판단한다.&lt;/p&gt;`),step(&#x27;활동 1 · 2단계: 직선 y=x-3을 일반형으로 바꾼다&#x27;, `${formula(&#x27;y=x-3 → x-y-3=0&#x27;)}&lt;p&gt;a=1, b=-1, c=-3이다.&lt;/p&gt;`),step(&#x27;활동 1 · 3단계: 중심 C(1,2)에서 직선까지의 거리를 구한다&#x27;, `${formula(&#x27;d=|1×1+(-1)×2-3|/√(1²+(-1)²)&#x27;)}${formula(&#x27;d=|-4|/√2=2√2&#x27;)}`),step(&#x27;활동 1 · 4단계: 거리와 반지름을 제곱하여 비교한다&#x27;, `${formula(&#x27;d²=8&lt;10=r²&#x27;)}&lt;p&gt;d&amp;lt;r이므로 직선은 원을 가로질러 서로 다른 두 점에서 만난다.&lt;/p&gt;`),step(&#x27;활동 2 · 1단계: (-3,0)을 지나고 기울기가 m인 직선을 둔다&#x27;, `${formula(&#x27;y-0=m{x-(-3)}&#x27;)}${formula(&#x27;y=m(x+3)&#x27;)}&lt;p&gt;이 직선이 원에 접하도록 하는 m을 찾는다.&lt;/p&gt;`),step(&#x27;활동 2 · 2단계: 중심과의 거리를 구할 수 있도록 일반형으로 바꾼다&#x27;, `${formula(&#x27;y=m(x+3) → mx-y+3m=0&#x27;)}&lt;p&gt;a=m, b=-1, c=3m이다.&lt;/p&gt;`),step(&#x27;활동 2 · 3단계: 접선 조건 d=r을 식으로 나타낸다&#x27;, `${formula(&#x27;|m×1+(-1)×2+3m|/√(m²+(-1)²)=√10&#x27;)}${formula(&#x27;|4m-2|/√(m²+1)=√10&#x27;)}`),step(&#x27;활동 2 · 4단계: 양변을 제곱하여 절댓값과 근호를 없앤다&#x27;, `${formula(&#x27;(4m-2)²=10(m²+1)&#x27;)}${formula(&#x27;16m²-16m+4=10m²+10&#x27;)}${formula(&#x27;3m²-8m-3=0&#x27;)}`),step(&#x27;활동 2 · 5단계: 인수분해하여 두 기울기를 구한다&#x27;, `${formula(&#x27;(3m+1)(m-3)=0&#x27;)}${formula(&#x27;m=3 또는 m=-(1/3)&#x27;)}`),step(&#x27;활동 2 · 6단계: 두 기울기를 y=m(x+3)에 각각 대입한다&#x27;, `${formula(&#x27;m=3 → y=3x+9&#x27;)}${formula(&#x27;m=-(1/3) → y=-(1/3)x-1&#x27;)}`),step(&#x27;마지막 단계: 두 활동의 결론을 정확한 그림과 함께 확인한다&#x27;, `${answer(&#x27;활동 1: 서로 다른 두 점에서 만난다.　활동 2: 접선은 두 개이다.&#x27;)}${formula(&#x27;y=3x+9&#x27;)}${formula(&#x27;y=-(1/3)x-1&#x27;)}${tangentThinkingFigure()}`)] })
        ].join(&#x27;&#x27;);
      }

      function wrapupLessonCards() {
        return [
          card({ id:&#x27;w40-summary&#x27;, page:40, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;중단원 핵심 정리&#x27;, body:`&lt;p&gt;교과서의 세 핵심 개념을 문제를 풀기 전에 차례로 다시 확인한다.&lt;/p&gt;`, visual:circleLinePositionFigure(), steps:[step(&#x27;1단계: 원의 방정식&#x27;, `${formula(&#x27;(x-a)²+(y-b)²=r²&#x27;)}&lt;p&gt;특히 중심이 원점이면 x²+y²=r²이다.&lt;/p&gt;`),step(&#x27;2단계: 원과 직선의 위치 관계&#x27;, &#x27;&lt;p&gt;대입하여 얻은 이차방정식의 판별식 D가 양수이면 두 점, 0이면 접함, 음수이면 만나지 않는다.&lt;/p&gt;&#x27;),step(&#x27;3단계: 기울기가 주어진 접선&#x27;, formula(&#x27;y=mx±r√(m²+1)&#x27;)),step(&#x27;4단계: 원 위의 점에서의 접선&#x27;, formula(&#x27;x₁x+y₁y=r²&#x27;))] }),
          card({ id:&#x27;w01&#x27;, page:40, label:&#x27;중단원 마무리 문제 01&#x27;, kind:&#x27;problem&#x27;, title:&#x27;다음 원의 방정식을 구하시오&#x27;, body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;중심 (1,2), 반지름 √7인 원&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;A(-1,3), B(5,1)을 지름의 양 끝점으로 하는 원&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: 중심과 반지름을 확인한다&#x27;, formula(&#x27;a=1, b=2, r=√7&#x27;)),step(&#x27;⑴ 2단계: 원의 방정식에 대입한다&#x27;, formula(&#x27;(x-1)²+(y-2)²=7&#x27;)),step(&#x27;⑵ 1단계: 원의 중심을 C(a,b)라 둔다&#x27;, &#x27;&lt;p&gt;지름의 양 끝점이 A와 B이므로 중심 C는 선분 AB의 중점이다.&lt;/p&gt;&#x27;),step(&#x27;⑵ 2단계: 중점 공식으로 a와 b를 구한다&#x27;, `${formula(&#x27;a={-1+5}/2=2&#x27;)}${formula(&#x27;b=(3+1)/2=2&#x27;)}${formula(&#x27;C(2,2)&#x27;)}`),step(&#x27;⑵ 3단계: 중심 C에서 A까지의 거리의 제곱을 구한다&#x27;, formula(&#x27;r²=CA²=(-1-2)²+(3-2)²=10&#x27;)),step(&#x27;⑵ 4단계: 원의 방정식을 쓴다&#x27;, formula(&#x27;(x-2)²+(y-2)²=10&#x27;)),answer(&#x27;⑴ (x-1)²+(y-2)²=7&lt;br&gt;⑵ (x-2)²+(y-2)²=10&#x27;)] }),
          card({ id:&#x27;w02&#x27;, page:40, label:&#x27;중단원 마무리 문제 02&#x27;, kind:&#x27;problem&#x27;, title:&#x27;중심과 반지름에서 a+b+r 구하기&#x27;, body:`&lt;p&gt;원 x²+y²+6x-8y+9=0의 중심은 (a,b), 반지름은 r이다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 완전제곱식으로 바꾼다&#x27;, `${formula(&#x27;x²+6x+9+y²-8y+16=16&#x27;)}${formula(&#x27;(x+3)²+(y-4)²=16&#x27;)}`),step(&#x27;2단계: a, b, r을 읽는다&#x27;, formula(&#x27;a=-3, b=4, r=4&#x27;)),step(&#x27;3단계: 값을 더한다&#x27;, formula(&#x27;a+b+r=-3+4+4=5&#x27;)),answer(&#x27;5&#x27;)] }),
          card({ id:&#x27;w03&#x27;, page:40, label:&#x27;중단원 마무리 문제 03&#x27;, kind:&#x27;problem&#x27;, title:&#x27;k에 따른 원과 직선의 위치 관계&#x27;, body:`&lt;p&gt;원 x²+y²=5와 직선 y=-3x+k의 위치 관계가 다음과 같도록 k의 값 또는 범위를 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;서로 다른 두 점에서 만날 때&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;한 점에서 접할 때&#x27;)}${problem(&#x27;⑶&#x27;,&#x27;만나지 않을 때&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;1단계: 직선을 일반형으로 바꾼다&#x27;, formula(&#x27;y=-3x+k → 3x+y-k=0&#x27;)),step(&#x27;2단계: 원의 중심에서 직선까지의 거리와 반지름을 구한다&#x27;, `${formula(&#x27;d=|k|/√(3²+1²)=|k|/√10&#x27;)}${formula(&#x27;r=√5&#x27;)}`),step(&#x27;⑴ 1단계: 서로 다른 두 점에서 만나는 조건 d&lt;r을 쓴다&#x27;, `${formula(&#x27;|k|/√10&lt;√5&#x27;)}${formula(&#x27;|k|&lt;5√2&#x27;)}`),step(&#x27;⑴ 2단계: 절댓값 부등식을 범위로 나타낸다&#x27;, formula(&#x27;-5√2&lt;k&lt;5√2&#x27;)),step(&#x27;⑵ 한 점에서 접하는 조건 d=r을 쓴다&#x27;, `${formula(&#x27;|k|/√10=√5&#x27;)}${formula(&#x27;k=±5√2&#x27;)}`),step(&#x27;⑶ 1단계: 만나지 않는 조건 d&gt;r을 쓴다&#x27;, `${formula(&#x27;|k|/√10&gt;√5&#x27;)}${formula(&#x27;|k|&gt;5√2&#x27;)}`),step(&#x27;⑶ 2단계: 절댓값 부등식을 두 범위로 나눈다&#x27;, formula(&#x27;k&lt;-5√2 또는 k&gt;5√2&#x27;)),answer(&#x27;⑴ -5√2&amp;lt;k&amp;lt;5√2&lt;br&gt;⑵ k=±5√2&lt;br&gt;⑶ k&amp;lt;-5√2 또는 k&amp;gt;5√2&#x27;)] }),
          card({ id:&#x27;w04&#x27;, page:40, label:&#x27;중단원 마무리 문제 04&#x27;, kind:&#x27;problem&#x27;, title:&#x27;두 종류의 접선 방정식&#x27;, body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;원 x²+y²=36에 접하고 기울기가 √3인 직선&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;원 x²+y²=17 위의 점 (-4,1)에서의 접선&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: 반지름과 기울기를 확인한다&#x27;, `${formula(&#x27;r=6&#x27;)}${formula(&#x27;m=√3&#x27;)}`),step(&#x27;⑴ 2단계: 기울기가 주어진 접선 공식에 대입한다&#x27;, `${formula(&#x27;y=mx±r√(m²+1)&#x27;)}${formula(&#x27;y=√3x±6√{(√3)²+1}&#x27;)}`),step(&#x27;⑴ 3단계: 근호를 계산하여 두 직선을 쓴다&#x27;, `${formula(&#x27;6√(3+1)=12&#x27;)}${formula(&#x27;y=√3x+12 또는 y=√3x-12&#x27;)}`),step(&#x27;⑵ 1단계: 접점의 좌표와 r²을 확인한다&#x27;, `${formula(&#x27;x₁=-4, y₁=1&#x27;)}${formula(&#x27;r²=17&#x27;)}`),step(&#x27;⑵ 2단계: 원 위의 점에서의 접선 공식에 대입한다&#x27;, `${formula(&#x27;x₁x+y₁y=r²&#x27;)}${formula(&#x27;(-4)x+1y=17&#x27;)}`),step(&#x27;⑵ 3단계: 식을 간단히 쓴다&#x27;, formula(&#x27;-4x+y=17&#x27;)),answer(&#x27;⑴ y=√3x+12 또는 y=√3x-12&lt;br&gt;⑵ -4x+y=17&#x27;)] }),
          card({ id:&#x27;w05&#x27;, page:41, label:&#x27;중단원 마무리 문제 05&#x27;, kind:&#x27;problem&#x27;, title:&#x27;반지름이 √2 이상인 원이 되게 하는 자연수 k&#x27;, body:`&lt;p&gt;방정식 x²+y²-4x+2y+k=0이 반지름의 길이가 √2 이상인 원을 나타내도록 하는 자연수 k의 개수를 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: x항과 y항을 모으고 상수항을 옮긴다&#x27;, formula(&#x27;x²-4x+y²+2y=-k&#x27;)),step(&#x27;2단계: 양변에 필요한 수를 더해 완전제곱식으로 만든다&#x27;, `${formula(&#x27;x²-4x+4+y²+2y+1=-k+5&#x27;)}${formula(&#x27;(x-2)²+(y+1)²=5-k&#x27;)}`),step(&#x27;3단계: 반지름의 제곱을 읽는다&#x27;, formula(&#x27;r²=5-k&#x27;)),step(&#x27;4단계: r≥√2 조건은 r²≥2와 같음을 이용한다&#x27;, `${formula(&#x27;5-k≥2&#x27;)}${formula(&#x27;k≤3&#x27;)}`),step(&#x27;5단계: k는 자연수이므로 가능한 값을 모두 쓴다&#x27;, formula(&#x27;k=1,2,3&#x27;)),step(&#x27;마지막 단계: 자연수의 개수를 센다&#x27;, `${formula(&#x27;가능한 k는 3개&#x27;)}${answer(&#x27;3개&#x27;)}`)] }),
          card({ id:&#x27;w06&#x27;, page:41, label:&#x27;중단원 마무리 문제 06 · 서술형&#x27;, kind:&#x27;problem&#x27;, title:&#x27;x축과 y축에 동시에 접하고 (2,1)을 지나는 원&#x27;, body:`&lt;p&gt;x축과 y축에 모두 접하고 점 (2,1)을 지나는 원의 방정식을 모두 구하시오.&lt;/p&gt;&lt;p&gt;두 축에 접하는 원은 중심에서 두 축까지의 거리가 모두 반지름과 같다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 반지름을 r이라 하고 중심의 가능한 꼴을 정한다&#x27;, `${formula(&#x27;r&gt;0&#x27;)}${formula(&#x27;중심=(±r,±r)&#x27;)}`),step(&#x27;2단계: 점 (2,1)을 지나므로 중심과 이 점 사이의 거리의 제곱이 r²이다&#x27;, &#x27;&lt;p&gt;네 가지 중심을 차례로 대입하되, 반지름 r은 반드시 양수여야 한다.&lt;/p&gt;&#x27;),step(&#x27;3단계: 중심 (r,r)을 대입한다&#x27;, `${formula(&#x27;(2-r)²+(1-r)²=r²&#x27;)}${formula(&#x27;r²-6r+5=0&#x27;)}${formula(&#x27;(r-1)(r-5)=0&#x27;)}${formula(&#x27;r=1 또는 r=5&#x27;)}`),step(&#x27;4단계: 나머지 세 중심에서는 양수인 r이 나오지 않음을 확인한다&#x27;, `${formula(&#x27;중심 (r,-r): r²-2r+5=0&#x27;)}${formula(&#x27;중심 (-r,r): r²+2r+5=0&#x27;)}${formula(&#x27;중심 (-r,-r): r²+6r+5=0&#x27;)}&lt;p&gt;앞의 두 식은 실수해가 없고, 마지막 식의 해는 음수이므로 반지름이 될 수 없다.&lt;/p&gt;`),step(&#x27;5단계: r=1일 때 원의 방정식을 쓴다&#x27;, formula(&#x27;(x-1)²+(y-1)²=1&#x27;)),step(&#x27;6단계: r=5일 때 원의 방정식을 쓴다&#x27;, formula(&#x27;(x-5)²+(y-5)²=25&#x27;)),answer(&#x27;(x-1)²+(y-1)²=1 또는 (x-5)²+(y-5)²=25&#x27;)] }),
          card({ id:&#x27;w07&#x27;, page:41, label:&#x27;중단원 마무리 문제 07&#x27;, kind:&#x27;problem&#x27;, title:&#x27;원 위의 점과 직선 사이 거리의 최댓값과 최솟값&#x27;, body:`&lt;p&gt;원 (x-2)²+(y-5)²=4 위의 점과 직선 3x-4y-6=0 사이의 거리를 생각한다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 원의 중심과 반지름을 확인한다&#x27;, formula(&#x27;C(2,5), r=2&#x27;)),step(&#x27;2단계: 중심에서 직선까지의 거리를 구한다&#x27;, formula(&#x27;d=|3×2-4×5-6|/5=4&#x27;)),step(&#x27;3단계: 가장 가까운 점과 가장 먼 점을 생각한다&#x27;, &#x27;&lt;p&gt;중심에서 직선에 수선을 내린 방향으로 반지름만큼 가까워지거나 멀어진다.&lt;/p&gt;&#x27;),step(&#x27;4단계: 최솟값과 최댓값을 계산한다&#x27;, `${formula(&#x27;최솟값=4-2=2&#x27;)}${formula(&#x27;최댓값=4+2=6&#x27;)}`),answer(&#x27;최댓값 6, 최솟값 2&#x27;)] }),
          card({ id:&#x27;w08&#x27;, page:41, label:&#x27;중단원 마무리 문제 08&#x27;, kind:&#x27;problem&#x27;, title:&#x27;한 접선이 다른 원에도 접할 때 k&#x27;, body:`&lt;p&gt;원 x²+y²=10 위의 점 (1,3)에서의 접선이 원 x²+y²-16x-8y+k=0과 접한다.&lt;/p&gt;`, steps:[step(&#x27;1단계: 첫 번째 원의 접선을 구한다&#x27;, formula(&#x27;x+3y=10&#x27;)),step(&#x27;2단계: 두 번째 원의 중심과 반지름을 나타낸다&#x27;, `${formula(&#x27;(x-8)²+(y-4)²=80-k&#x27;)}&lt;p&gt;중심은 (8,4), 반지름은 √(80-k)이다.&lt;/p&gt;`),step(&#x27;3단계: 중심에서 접선까지의 거리를 구한다&#x27;, formula(&#x27;d=|8+12-10|/√10=√10&#x27;)),step(&#x27;4단계: 접하므로 거리와 반지름을 같게 둔다&#x27;, formula(&#x27;√(80-k)=√10&#x27;)),step(&#x27;5단계: k를 구한다&#x27;, formula(&#x27;80-k=10&#x27;)),answer(&#x27;k=70&#x27;)] }),
          card({ id:&#x27;w09&#x27;, page:41, label:&#x27;중단원 마무리 문제 09 · 서술형&#x27;, kind:&#x27;problem&#x27;, title:&#x27;두 접선과 y축이 만드는 삼각형의 넓이&#x27;, body:`&lt;p&gt;점 P(-2,4)에서 원 x²+y²=2에 그은 두 접선이 y축과 만나는 점을 A, B라 한다.&lt;/p&gt;`, steps:[step(&#x27;1단계: y축 위의 교점을 (0,b)라 둔다&#x27;, &#x27;&lt;p&gt;P(-2,4)와 (0,b)를 지나는 직선이 원에 접하도록 b를 구한다.&lt;/p&gt;&#x27;),step(&#x27;2단계: 두 점을 지나는 직선의 일반형을 만든다&#x27;, formula(&#x27;(b-4)x-2y+2b=0&#x27;)),step(&#x27;3단계: 원점에서 직선까지의 거리를 반지름 √2와 같게 둔다&#x27;, formula(&#x27;|2b|/√{(b-4)²+4}=√2&#x27;)),step(&#x27;4단계: 양변을 제곱하여 b를 구한다&#x27;, `${formula(&#x27;b²+8b-20=0&#x27;)}${formula(&#x27;b=2 또는 b=-10&#x27;)}`),step(&#x27;5단계: 밑변 AB와 높이를 구한다&#x27;, `${formula(&#x27;AB=|2-(-10)|=12&#x27;)}&lt;p&gt;P에서 y축까지의 거리는 2이다.&lt;/p&gt;`),step(&#x27;6단계: 삼각형의 넓이를 구한다&#x27;, formula(&#x27;S=(1/2)×12×2=12&#x27;)),answer(&#x27;12&#x27;)] }),
          card({ id:&#x27;w10&#x27;, page:41, label:&#x27;중단원 마무리 문제 10 · 발전&#x27;, kind:&#x27;problem&#x27;, title:&#x27;x축과 만나는 두 점 사이의 거리로 k 구하기&#x27;, body:`&lt;p&gt;원 x²+y²-6x-4y+k=0이 x축과 만나는 두 점 사이의 거리가 8일 때, 상수 k의 값을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: x축과 만나는 두 점을 문자로 나타낸다&#x27;, `&lt;p&gt;x축 위의 점은 y좌표가 0이다. 두 교점을 왼쪽부터 A(x₁,0), B(x₂,0)이라 두자.&lt;/p&gt;${formula(&#x27;AB=8&#x27;)}`),step(&#x27;2단계: 원의 중심을 찾기 위해 완전제곱식으로 바꾼다&#x27;, `${formula(&#x27;x²-6x+y²-4y=-k&#x27;)}${formula(&#x27;(x-3)²+(y-2)²=13-k&#x27;)}&lt;p&gt;k의 값과 관계없이 원의 중심은 C(3,2)이다.&lt;/p&gt;`),step(&#x27;3단계: 중심 C에서 x축에 내린 수선의 발을 H라 둔다&#x27;, `${formula(&#x27;H(3,0)&#x27;)}&lt;p&gt;현 AB에 중심에서 내린 수선 CH는 현 AB를 정확히 이등분한다. 따라서 H는 선분 AB의 중점이다.&lt;/p&gt;`),step(&#x27;4단계: 길이 8인 현을 반으로 나눈다&#x27;, `${formula(&#x27;AH=HB=8/2=4&#x27;)}&lt;p&gt;H의 x좌표가 3이므로 A는 3에서 왼쪽으로 4, B는 3에서 오른쪽으로 4만큼 떨어져 있다.&lt;/p&gt;`),step(&#x27;5단계: 두 교점의 좌표를 구한다&#x27;, `${formula(&#x27;x₁=3-4=-1&#x27;)}${formula(&#x27;x₂=3+4=7&#x27;)}${formula(&#x27;A(-1,0), B(7,0)&#x27;)}`),step(&#x27;6단계: 계산이 쉬운 점 A(-1,0)을 원의 식에 대입한다&#x27;, `${formula(&#x27;(-1)²+0²-6(-1)-4×0+k=0&#x27;)}${formula(&#x27;1+6+k=0&#x27;)}${formula(&#x27;k=-7&#x27;)}`),step(&#x27;7단계: 다른 교점 B(7,0)도 같은 k를 주는지 확인한다&#x27;, `${formula(&#x27;7²+0²-6×7-4×0-7=0&#x27;)}${formula(&#x27;49-42-7=0&#x27;)}&lt;p&gt;두 점이 모두 원 위에 있으므로 계산이 맞다.&lt;/p&gt;`),step(&#x27;마지막 단계: 현의 이등분 관계를 정확한 그림으로 확인한다&#x27;, `${answer(&#x27;k=-7&#x27;)}${wrapupChordFigure()}`)] }),
          card({ id:&#x27;w11&#x27;, page:41, label:&#x27;중단원 마무리 문제 11 · 발전&#x27;, kind:&#x27;problem&#x27;, title:&#x27;정삼각형 넓이의 최댓값과 최솟값&#x27;, body:`&lt;p&gt;원 x²+y²=8 위의 점 A와 직선 y=x+6 위의 서로 다른 두 점 B, C를 꼭짓점으로 하는 정삼각형 ABC를 만들 때, 그 넓이의 최댓값과 최솟값을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 밑변 BC가 놓인 직선을 확인한다&#x27;, `&lt;p&gt;B와 C는 모두 직선 y=x+6 위에 있다. 따라서 선분 BC 전체가 이 직선 위에 놓인다.&lt;/p&gt;${formula(&#x27;BC가 놓인 직선: y=x+6&#x27;)}`),step(&#x27;2단계: A에서 BC에 내린 수선의 발을 H라 하고 높이를 h라 둔다&#x27;, `&lt;p&gt;AH는 정삼각형 ABC의 높이이다. 동시에 h는 원 위의 점 A와 직선 y=x+6 사이의 거리이다.&lt;/p&gt;${formula(&#x27;AH=h&#x27;)}`),step(&#x27;3단계: 정삼각형의 한 변을 높이 h로 나타낸다&#x27;, `&lt;p&gt;정삼각형의 한 변의 길이를 s라 하면 높이는 밑변을 반으로 나눈다.&lt;/p&gt;${formula(&#x27;BH=HC=s/2&#x27;)}${formula(&#x27;(s/2)²+h²=s²&#x27;)}${formula(&#x27;s=2h/√3&#x27;)}`),step(&#x27;4단계: 정삼각형의 넓이를 h만으로 나타낸다&#x27;, `${formula(&#x27;S=(1/2)×s×h&#x27;)}${formula(&#x27;S=(1/2)×(2h/√3)×h&#x27;)}${formula(&#x27;S=h²/√3&#x27;)}&lt;p&gt;h가 양수이므로 높이 h가 커질수록 넓이 S도 커진다.&lt;/p&gt;`),step(&#x27;5단계: 원의 중심에서 직선까지의 거리를 구한다&#x27;, `${formula(&#x27;y=x+6 → x-y+6=0&#x27;)}${formula(&#x27;d₀=|1×0+(-1)×0+6|/√(1²+(-1)²)&#x27;)}${formula(&#x27;d₀=6/√2=3√2&#x27;)}&lt;p&gt;원의 중심 O는 원점 O(0,0)이다.&lt;/p&gt;`),step(&#x27;6단계: 원의 반지름을 확인한다&#x27;, `${formula(&#x27;x²+y²=8&#x27;)}${formula(&#x27;r=√8=2√2&#x27;)}`),step(&#x27;7단계: 원 위의 점 A에서 직선까지 거리 h의 범위를 찾는다&#x27;, `&lt;p&gt;원 전체가 직선의 한쪽에 있으므로 가장 가까운 점에서는 중심 거리에서 반지름을 빼고, 가장 먼 점에서는 반지름을 더한다.&lt;/p&gt;${formula(&#x27;h의 최솟값=d₀-r=3√2-2√2=√2&#x27;)}${formula(&#x27;h의 최댓값=d₀+r=3√2+2√2=5√2&#x27;)}`),step(&#x27;8단계: 가장 작은 높이를 넓이 식에 대입한다&#x27;, `${formula(&#x27;S의 최솟값=(√2)²/√3&#x27;)}${formula(&#x27;S의 최솟값=2/√3=2√3/3&#x27;)}`),step(&#x27;9단계: 가장 큰 높이를 넓이 식에 대입한다&#x27;, `${formula(&#x27;S의 최댓값=(5√2)²/√3&#x27;)}${formula(&#x27;S의 최댓값=50/√3=50√3/3&#x27;)}`),step(&#x27;마지막 단계: 두 정삼각형을 정확한 비율의 그림으로 비교한다&#x27;, `${answer(&#x27;최댓값은 50√3/3, 최솟값은 2√3/3이다.&#x27;)}${equilateralRangeFigure()}`)] })
        ].join(&#x27;&#x27;);
      }

          &lt;text x=&quot;707&quot; y=&quot;230&quot; class=&quot;diagram-label&quot;&gt;x&lt;/text&gt;&lt;text x=&quot;392&quot; y=&quot;43&quot; class=&quot;diagram-label&quot;&gt;y&lt;/text&gt;&lt;text x=&quot;355&quot; y=&quot;242&quot; class=&quot;diagram-note&quot;&gt;O&lt;/text&gt;
        &lt;/svg&gt;`;
      }
