          ]}),
          card({id:&#x27;p82-negation&#x27;,page:82,label:&#x27;개념&#x27;,title:&#x27;명제의 부정&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;명제는 보통 알파벳 소문자 p, q, r, …로 나타낸다.&lt;/p&gt;&lt;p&gt;명제 p에 대하여 ‘p가 아니다.’를 명제 p의 &lt;strong&gt;부정&lt;/strong&gt;이라 하며, 이것을 기호로 &lt;strong&gt;~p&lt;/strong&gt;와 같이 나타낸다. 명제 p가 참이면 ~p는 거짓이고, p가 거짓이면 ~p는 참이다.&lt;/p&gt;&lt;p&gt;명제 p에 대하여 ~(~p)는 p이다.&lt;/p&gt;&lt;div class=&quot;example-strip&quot;&gt;&lt;p&gt;&lt;strong&gt;보기 ①&lt;/strong&gt; 명제 ‘5는 홀수이다.’는 참이고, 그 부정 ‘5는 홀수가 아니다.’는 거짓이다.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;보기 ②&lt;/strong&gt; 명제 ‘6&amp;gt;2×3’은 거짓이고, 그 부정 ‘6≤2×3’은 참이다.&lt;/p&gt;&lt;/div&gt;&#x27;),visual:`&lt;div class=&quot;formula-pair&quot;&gt;${formula(&#x27;p가 참 → ~p는 거짓&#x27;)}${formula(&#x27;p가 거짓 → ~p는 참&#x27;)}&lt;/div&gt;`}),
          card({id:&#x27;p82-p2&#x27;,page:82,label:&#x27;문제 2&#x27;,kind:&#x27;problem&#x27;,title:&#x27;명제의 부정과 참, 거짓&#x27;,body:setPrompt(&#x27;다음 명제의 부정을 말하고, 그 참, 거짓을 판별하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) 15의 약수의 개수는 3이다.&lt;/p&gt;&lt;p&gt;(2) 2≤1+√2&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1)의 원래 명제를 확인한다&#x27;,&#x27;&lt;p&gt;15의 약수는 1, 3, 5, 15이므로 약수의 개수는 4이다. 따라서 원래 명제 “15의 약수의 개수는 3이다.”는 거짓이다.&lt;/p&gt;&#x27;),
            step(&#x27;(1)의 부정을 말한다&#x27;,&#x27;&lt;p&gt;“15의 약수의 개수는 3이다.”의 부정은 “15의 약수의 개수는 3이 아니다.”이다. 실제 약수의 개수는 4이므로 이 부정은 참이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2)의 부정을 정확히 쓴다&#x27;,&#x27;&lt;p&gt;부등식 A≤B의 부정은 A&amp;gt;B이다. 따라서 “2≤1+√2”의 부정은 “2&amp;gt;1+√2”이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2)의 부정의 참, 거짓을 판단한다&#x27;,`&lt;p&gt;√2&amp;gt;1이므로 1+√2&amp;gt;2이다. 따라서 2&amp;gt;1+√2는 거짓이다.&lt;/p&gt;${answer(&#x27;(1) 15의 약수의 개수는 3이 아니다: 참　(2) 2&gt;1+√2: 거짓&#x27;)}`)
          ]}),
          card({id:&#x27;p83-def&#x27;,page:83,label:&#x27;개념&#x27;,title:&#x27;정의와 정리&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;우리가 사용하는 용어의 뜻은 여러 가지로 나타낼 수 있으나, 뜻이 명확하지 않으면 의사소통이 제대로 이루어지지 않는다. 따라서 용어의 뜻을 분명하게 정하여 사용해야 한다.&lt;/p&gt;&lt;p&gt;예를 들어 이등변삼각형의 뜻은 ‘두 변의 길이가 같은 삼각형’이다. 이와 같이 용어의 뜻을 명확하게 정한 것을 그 용어의 &lt;strong&gt;정의&lt;/strong&gt;라고 한다.&lt;/p&gt;&lt;p&gt;또, 참임이 증명된 명제 중에서 ‘이등변삼각형은 두 밑각의 크기가 같다.’처럼 기본이 되거나 다른 명제를 증명할 때 이용할 수 있는 것을 &lt;strong&gt;정리&lt;/strong&gt;라고 한다.&lt;/p&gt;&lt;p&gt;어떤 명제가 참임을 논리적으로 밝히는 과정을 &lt;strong&gt;증명&lt;/strong&gt;이라고 한다.&lt;/p&gt;&#x27;),visual:`&lt;div class=&quot;formula-pair&quot;&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;정의&lt;/strong&gt;&lt;br&gt;용어의 뜻을 명확하게 정한 것&lt;/div&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;정리&lt;/strong&gt;&lt;br&gt;참임이 증명된 명제 중에서 기본이 되거나 다른 명제를 증명할 때 이용하는 것&lt;/div&gt;&lt;/div&gt;`}),
          card({id:&#x27;p83-p3&#x27;,page:83,label:&#x27;문제 3&#x27;,kind:&#x27;problem&#x27;,title:&#x27;용어의 정의 말하기&#x27;,body:setPrompt(&#x27;다음 용어의 정의를 말하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) 직사각형&lt;/p&gt;&lt;p&gt;(2) 공집합&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) 직사각형의 정의를 말한다&#x27;,&#x27;&lt;p&gt;직사각형은 네 각의 크기가 모두 같은 사각형이다. 사각형의 네 각의 크기의 합은 360°이므로 네 각은 모두 90°이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2) 공집합의 정의를 말한다&#x27;,`&lt;p&gt;공집합은 원소가 하나도 없는 집합이다.&lt;/p&gt;${answer(&#x27;(1) 네 각의 크기가 모두 같은 사각형　(2) 원소가 하나도 없는 집합&#x27;)}`)
          ]}),
          card({id:&#x27;p83-condition&#x27;,page:83,label:&#x27;개념&#x27;,title:&#x27;조건과 진리집합&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;변수 x를 포함하는 문장 ‘x는 3의 배수이다.’는 그 자체로는 참, 거짓을 판별할 수 없지만, x의 값이 정해지면 판별할 수 있다. 예를 들어 ‘x는 3의 배수이다.’는 x=6이면 참이고 x=5이면 거짓이다.&lt;/p&gt;&lt;p&gt;이와 같이 변수를 포함하는 문장이나 식 중에서 변수의 값에 따라 참, 거짓을 판별할 수 있는 것을 &lt;strong&gt;조건&lt;/strong&gt;이라고 한다.&lt;/p&gt;&lt;p&gt;또, 전체집합 U의 원소 중에서 조건 p가 참이 되게 하는 모든 원소의 집합을 조건 p의 &lt;strong&gt;진리집합&lt;/strong&gt;이라고 한다.&lt;/p&gt;&lt;p&gt;변수 x를 포함하는 조건을 p(x), q(x), r(x), …로 나타내는데, 이를 간단히 p, q, r, …로 나타내기도 한다.&lt;/p&gt;&lt;p&gt;명제의 부정과 마찬가지로, 조건 p에 대하여 ‘p가 아니다.’를 조건 p의 부정이라 하며, 이것을 기호로 ~p와 같이 나타낸다. 조건 p에 대하여도 ~(~p)는 p이다.&lt;/p&gt;&lt;p&gt;전체집합 U에서 조건 p의 진리집합을 P라 할 때, ~p의 진리집합은 Pᶜ이다.&lt;/p&gt;&lt;div class=&quot;example-strip&quot;&gt;&lt;p&gt;&lt;strong&gt;보기&lt;/strong&gt; 전체집합 U={x|x는 10 이하의 짝수}에 대하여&lt;/p&gt;&lt;p&gt;조건 p: x≥6,　~p: x&amp;lt;6&lt;/p&gt;&lt;p&gt;진리집합 P={6,8,10},　Pᶜ={2,4}&lt;/p&gt;&lt;/div&gt;&#x27;),visual:conditionTruthSetFigure()}),
          card({id:&#x27;p84-p4&#x27;,page:84,label:&#x27;문제 4&#x27;,kind:&#x27;problem&#x27;,title:&#x27;부정한 조건의 진리집합 구하기&#x27;,body:setPrompt(&#x27;전체집합 U가 자연수 전체의 집합일 때, 조건 ‘p: x²&gt;10’에 대하여 ~p와 그 진리집합을 구하시오.&#x27;),steps:[
            step(&#x27;조건 p의 부정을 쓴다&#x27;,`${formula(&#x27;~p: x²≤10&#x27;)}`),
            step(&#x27;부등식의 해를 구한다&#x27;,`${formula(&#x27;x²≤10 ⇔ -√10≤x≤√10&#x27;)}`),
            step(&#x27;해에 해당하는 자연수만 고른다&#x27;,`&lt;p&gt;전체집합은 자연수 전체이므로 이 구간에 있는 자연수만 찾는다.&lt;/p&gt;${formula(&#x27;3&lt;√10&lt;4&#x27;)}${formula(&#x27;x=1,2,3&#x27;)}`),
            step(&#x27;진리집합을 원소나열법으로 쓴다&#x27;,`${formula(&#x27;{1,2,3}&#x27;)}${answer(&#x27;~p: x²≤10, 진리집합은 {1,2,3}&#x27;)}`)
          ]}),
          card({id:&#x27;p84-quant-think&#x27;,page:84,label:&#x27;생각 열기&#x27;,kind:&#x27;thinking&#x27;,title:&#x27;“모든”이나 “어떤”을 포함한 문장&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;다음은 ‘모든’이나 ‘어떤’을 포함한 문장이다.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;① 모든 유리수는 양수이다.&lt;/p&gt;&lt;p&gt;② 어떤 유리수는 양수이다.&lt;/p&gt;&lt;p&gt;③ 모든 식물은 꽃이 핀다.&lt;/p&gt;&lt;p&gt;④ 어떤 식물은 꽃이 핀다.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;위의 문장의 참, 거짓을 판별해 보자.&lt;/p&gt;&#x27;),visual:quantifierOpeningFigure(),visualFirst:true,steps:[
            step(&#x27;①과 ②를 판단한다&#x27;,&#x27;&lt;p&gt;①은 유리수 -1처럼 양수가 아닌 유리수가 있으므로 거짓이다. ②는 유리수 1처럼 양수인 유리수가 있으므로 참이다.&lt;/p&gt;&#x27;),
            step(&#x27;③과 ④를 판단한다&#x27;,`&lt;p&gt;③은 고사리처럼 꽃이 피지 않는 식물이 있으므로 거짓이다. ④는 장미처럼 꽃이 피는 식물이 있으므로 참이다.&lt;/p&gt;${answer(&#x27;① 거짓　② 참　③ 거짓　④ 참&#x27;)}`)
          ]}),
          card({id:&#x27;p84-quant&#x27;,page:84,label:&#x27;개념&#x27;,title:&#x27;“모든”이나 “어떤”을 포함한 명제의 참, 거짓&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;일반적으로 조건 p는 참, 거짓을 판별할 수 없지만, 조건 p 앞에 ‘모든’이나 ‘어떤’이 있으면 참, 거짓을 판별할 수 있으므로 명제가 된다.&lt;/p&gt;&lt;p&gt;전체집합 U에 대하여 조건 p의 진리집합을 P라 할 때, 명제 ‘모든 x에 대하여 p이다.’는 P=U이면 참이고, P≠U이면 거짓이다.&lt;/p&gt;&lt;p&gt;또, 명제 ‘어떤 x에 대하여 p이다.’는 P≠∅이면 참이고, P=∅이면 거짓이다. ‘어떤 x에 대하여 p이다.’는 ‘p인 x가 있다.’와 같은 뜻이다.&lt;/p&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;“모든”이나 “어떤”을 포함한 명제의 참, 거짓&lt;/strong&gt;&lt;br&gt;① ‘모든 x에 대하여 p이다.’는 P=U이면 참이고, P≠U이면 거짓이다.&lt;br&gt;② ‘어떤 x에 대하여 p이다.’는 P≠∅이면 참이고, P=∅이면 거짓이다.&lt;/div&gt;&lt;div class=&quot;example-strip&quot;&gt;&lt;p&gt;&lt;strong&gt;보기&lt;/strong&gt; 전체집합 U가 실수 전체의 집합일 때, 조건 ‘p: x²-1=0’의 진리집합을 P라 하면 P={-1,1}이다.&lt;/p&gt;&lt;p&gt;① 명제 ‘모든 x에 대하여 x²-1=0이다.’는 P≠U이므로 거짓이다.&lt;/p&gt;&lt;p&gt;② 명제 ‘어떤 x에 대하여 x²-1=0이다.’는 P≠∅이므로 참이다.&lt;/p&gt;&lt;/div&gt;&#x27;)}),
          card({id:&#x27;p85-p5&#x27;,page:85,label:&#x27;문제 5&#x27;,kind:&#x27;problem&#x27;,title:&#x27;“모든”과 “어떤”이 있는 명제 판별하기&#x27;,body:setPrompt(&#x27;다음 명제의 참, 거짓을 판별하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) 모든 실수 x에 대하여 |x|≥0이다.&lt;/p&gt;&lt;p&gt;(2) 어떤 실수 x에 대하여 x²-4x+5=0이다.&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1)의 “모든”을 확인한다&#x27;,`&lt;p&gt;절댓값 |x|는 수직선에서 x와 0 사이의 거리이므로 어떤 실수 x에 대해서도 음수가 될 수 없다.&lt;/p&gt;${formula(&#x27;|x|≥0&#x27;)}`),
            step(&#x27;(1)의 참, 거짓을 판단한다&#x27;,&#x27;&lt;p&gt;모든 실수 x가 |x|≥0을 만족하므로 (1)은 참이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2)의 식을 완전제곱식으로 고친다&#x27;,`${formula(&#x27;x²-4x+5=(x-2)²+1&#x27;)}&lt;p&gt;(x-2)²은 항상 0 이상이므로 (x-2)²+1은 항상 1 이상이다.&lt;/p&gt;`),
            step(&#x27;(2)의 “어떤”을 확인한다&#x27;,`&lt;p&gt;x²-4x+5=0을 만족하는 실수 x가 하나라도 있어야 참이지만, 왼쪽 식은 항상 1 이상이므로 그런 실수는 없다. 따라서 (2)는 거짓이다.&lt;/p&gt;${answer(&#x27;(1) 참　(2) 거짓&#x27;)}`)
          ]}),
          card({id:&#x27;p85-negation&#x27;,page:85,label:&#x27;개념&#x27;,title:&#x27;“모든”이나 “어떤”을 포함한 명제의 부정&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;명제 ‘모든 x에 대하여 p이다.’의 부정은 ‘p가 아닌 x가 있다.’, 즉 ‘어떤 x에 대하여 ~p이다.’이다.&lt;/p&gt;&lt;p&gt;또, ‘어떤 x에 대하여 p이다.’의 부정은 ‘p인 x가 없다.’, 즉 ‘모든 x에 대하여 ~p이다.’이다.&lt;/p&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;“모든”이나 “어떤”을 포함한 명제의 부정&lt;/strong&gt;&lt;br&gt;① ‘모든 x에 대하여 p이다.’의 부정은 ‘어떤 x에 대하여 ~p이다.’이다.&lt;br&gt;② ‘어떤 x에 대하여 p이다.’의 부정은 ‘모든 x에 대하여 ~p이다.’이다.&lt;/div&gt;&lt;div class=&quot;example-strip&quot;&gt;&lt;p&gt;&lt;strong&gt;보기&lt;/strong&gt; 명제 ‘모든 실수 x에 대하여 x²&amp;lt;0이다.’의 부정은 ‘어떤 실수 x에 대하여 x²≥0이다.’이다.&lt;/p&gt;&lt;/div&gt;&#x27;),visual:`&lt;div class=&quot;formula-pair&quot;&gt;${formula(&#x27;모든 x: p → 어떤 x: ~p&#x27;)}${formula(&#x27;어떤 x: p → 모든 x: ~p&#x27;)}&lt;/div&gt;`}),
          card({id:&#x27;p85-p6&#x27;,page:85,label:&#x27;문제 6&#x27;,kind:&#x27;problem&#x27;,title:&#x27;명제의 부정을 말하고 판별하기&#x27;,body:setPrompt(&#x27;다음 명제의 부정을 말하고, 그 참, 거짓을 판별하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) 모든 마름모는 정사각형이다.&lt;/p&gt;&lt;p&gt;(2) 어떤 실수 x에 대하여 |x|=1이다.&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1)의 “모든”을 “어떤”으로 바꾼다&#x27;,&#x27;&lt;p&gt;“모든 마름모는 정사각형이다.”의 부정은 “어떤 마름모는 정사각형이 아니다.”이다.&lt;/p&gt;&#x27;),
            step(&#x27;(1)의 부정을 판단한다&#x27;,&#x27;&lt;p&gt;네 변의 길이는 모두 같지만 네 각이 직각이 아닌 마름모가 있다. 이런 마름모는 정사각형이 아니므로 부정은 참이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2)의 “어떤”을 “모든”으로 바꾼다&#x27;,&#x27;&lt;p&gt;“어떤 실수 x에 대하여 |x|=1이다.”의 부정은 “모든 실수 x에 대하여 |x|≠1이다.”이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2)의 부정을 판단한다&#x27;,`&lt;p&gt;x=1 또는 x=-1이면 |x|=1이다. 따라서 “모든 실수 x에 대하여 |x|≠1이다.”는 거짓이다.&lt;/p&gt;${answer(&#x27;(1) 어떤 마름모는 정사각형이 아니다: 참　(2) 모든 실수 x에 대하여 |x|≠1이다: 거짓&#x27;)}`)
          ]})
        ].join(&#x27;&#x27;);
      }

      function propositionRelationCards() {
        return [
          card({id:&#x27;p86-think&#x27;,page:86,label:&#x27;생각 열기&#x27;,kind:&#x27;thinking&#x27;,title:&#x27;‘이면 …이다’로 표현되는 문장&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;일상생활에서 ‘비가 오면 땅이 젖는다.’와 같이&lt;/p&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;‘　　　　이면　　　　이다.’&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;로 표현되는 문장들이 있다.&lt;/p&gt;&lt;p&gt;위와 같이 나타낼 수 있는 문장의 예를 들어 보자.&lt;/p&gt;&#x27;),visual:ifThenOpeningFigure(),visualFirst:true,steps:[
            step(&#x27;참·거짓이 분명한 예를 확인한다&#x27;,`&lt;p&gt;예를 들어 &lt;strong&gt;“어떤 자연수가 6의 배수이면 그 자연수는 3의 배수이다.”&lt;/strong&gt;와 같이 나타낼 수 있다.&lt;/p&gt;&lt;p&gt;6의 배수는 모두 3으로 나누어떨어지므로 이 문장은 참·거짓이 분명한 명제이다.&lt;/p&gt;${answer(&#x27;예: 어떤 자연수가 6의 배수이면 그 자연수는 3의 배수이다.&#x27;)}`)
          ]}),
          card({id:&#x27;p86-concept&#x27;,page:86,label:&#x27;개념&#x27;,title:&#x27;명제 p→q의 가정과 결론&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;두 조건 p와 q로 이루어진 명제 ‘p이면 q이다.’를 기호 &lt;strong&gt;p→q&lt;/strong&gt;와 같이 나타낸다. 이때 p를 &lt;strong&gt;가정&lt;/strong&gt;, q를 &lt;strong&gt;결론&lt;/strong&gt;이라고 한다.&lt;/p&gt;&lt;div class=&quot;logic-symbol-panel&quot;&gt;&lt;div class=&quot;logic-symbol&quot;&gt;p → q&lt;/div&gt;&lt;p class=&quot;logic-symbol-copy&quot;&gt;&lt;strong&gt;p: 가정&lt;/strong&gt;&lt;br&gt;&lt;strong&gt;q: 결론&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;예를 들어 명제 ‘x=2이면 x²=4이다.’에서 가정과 결론은 다음과 같다.&lt;/p&gt;&lt;div class=&quot;example-strip&quot;&gt;&lt;p&gt;&lt;strong&gt;가정:&lt;/strong&gt; x=2&lt;/p&gt;&lt;p&gt;&lt;strong&gt;결론:&lt;/strong&gt; x²=4&lt;/p&gt;&lt;/div&gt;&lt;p&gt;명제 p→q에 대하여 두 조건 p와 q의 진리집합 사이의 포함 관계를 알아보자.&lt;/p&gt;&#x27;)}),
          card({id:&#x27;p86-together&#x27;,page:86,label:&#x27;함께하기&#x27;,kind:&#x27;example&#x27;,title:&#x27;참인 명제를 진리집합으로 확인하기&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;참인 명제 ‘3의 약수는 9의 약수이다.’를 p→q의 꼴로 나타내면 ‘x가 3의 약수이면 x는 9의 약수이다.’이다.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;&lt;strong&gt;1&lt;/strong&gt; 두 조건 p와 q에 대하여 □ 안에 알맞은 말을 써넣어 보자.&lt;br&gt;‘p: x는 3의 약수이다.’,　‘q: x는 □이다.’&lt;/p&gt;&lt;p&gt;&lt;strong&gt;2&lt;/strong&gt; 두 조건 p와 q의 진리집합을 각각 P와 Q라 할 때, 두 집합 P와 Q를 원소나열법으로 나타내 보자.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;3&lt;/strong&gt; 2에서 P⊂Q임을 확인해 보자.&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;1 · 조건 q의 빈칸을 채운다&#x27;,`&lt;p&gt;원래 명제의 결론은 “x는 9의 약수이다.”이다. 따라서 q의 빈칸에는 “9의 약수”가 들어간다.&lt;/p&gt;${formula(&#x27;q: x는 9의 약수이다.&#x27;)}`),
            step(&#x27;2 · 조건 p의 진리집합 P를 구한다&#x27;,`&lt;p&gt;3의 약수는 1, 3이다. 따라서 조건 p를 참이 되게 하는 모든 x를 모으면 P={1,3}이다.&lt;/p&gt;${formula(&#x27;P={1,3}&#x27;)}`),
            step(&#x27;2 · 조건 q의 진리집합 Q를 구한다&#x27;,`&lt;p&gt;9의 약수는 1, 3, 9이다. 따라서 조건 q를 참이 되게 하는 모든 x를 모으면 Q={1,3,9}이다.&lt;/p&gt;${formula(&#x27;Q={1,3,9}&#x27;)}`),
            step(&#x27;3 · 두 진리집합의 포함 관계를 확인한다&#x27;,`&lt;p&gt;P의 원소 1과 3은 모두 Q에도 들어 있다. 그러므로 P는 Q의 부분집합이다.&lt;/p&gt;${divisorTruthSetFigure()}${formula(&#x27;P⊂Q&#x27;)}${answer(&#x27;1 9의 약수　2 P={1,3}, Q={1,3,9}　3 P⊂Q&#x27;)}`)
          ]}),
          card({id:&#x27;p87-truth&#x27;,page:87,label:&#x27;개념&#x27;,title:&#x27;명제 p→q의 참, 거짓&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;일반적으로 두 조건 p와 q의 진리집합을 각각 P와 Q라 할 때,&lt;/p&gt;&lt;p&gt;&lt;strong&gt;①&lt;/strong&gt; 조건 p가 참이 되게 하는 모든 원소에 대하여 조건 q가 참이 되면, 명제 p→q는 참이다.&lt;/p&gt;&lt;p&gt;즉, P⊂Q이면 명제 p→q는 참이고, 명제 p→q가 참이면 P⊂Q이다.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;②&lt;/strong&gt; 조건 p가 참이 되게 하는 원소에 대하여 조건 q는 거짓이 되게 하는 원소가 있을 때, 명제 p→q는 거짓이다.&lt;/p&gt;&lt;p&gt;즉, P⊄Q이면 명제 p→q는 거짓이고, 명제 p→q가 거짓이면 P⊄Q이다.&lt;/p&gt;&lt;div class=&quot;relation-answer-grid&quot; aria-label=&quot;명제 p에서 q의 참과 거짓&quot;&gt;&lt;section class=&quot;relation-answer-card reverse&quot;&gt;&lt;span class=&quot;relation-answer-label&quot;&gt;참&lt;/span&gt;&lt;p class=&quot;relation-answer-statement&quot;&gt;P⊂Q ⇔ 명제 p→q는 참&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;relation-answer-card contrapositive&quot;&gt;&lt;span class=&quot;relation-answer-label&quot;&gt;거짓&lt;/span&gt;&lt;p class=&quot;relation-answer-statement&quot;&gt;P⊄Q ⇔ 명제 p→q는 거짓&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&#x27;),visual:propositionSetFigure(&#x27;truth&#x27;)}),
          card({id:&#x27;p87-example1&#x27;,page:87,label:&#x27;예제 1&#x27;,kind:&#x27;example&#x27;,title:&#x27;다음 명제의 참, 거짓을 판별하시오&#x27;,body:textbookOriginal(&#x27;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) x-1=0이면 x²=x이다.&lt;/p&gt;&lt;p&gt;(2) 소수는 홀수이다.&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) · 가정과 결론을 조건 p, q로 나타낸다&#x27;,`&lt;p&gt;가정은 x-1=0이고 결론은 x²=x이다.&lt;/p&gt;${formula(&#x27;p: x-1=0&#x27;)}${formula(&#x27;q: x²=x&#x27;)}`),
            step(&#x27;(1) · 두 조건의 진리집합을 각각 구한다&#x27;,`&lt;p&gt;x-1=0의 해는 x=1이므로 P={1}이다. x²=x를 한쪽으로 모아 인수분해하면 x(x-1)=0이므로 x=0 또는 x=1이다.&lt;/p&gt;${formula(&#x27;P={1}&#x27;)}${formula(&#x27;Q={0,1}&#x27;)}`),
            step(&#x27;(1) · 포함 관계로 참, 거짓을 판단한다&#x27;,&#x27;&lt;p&gt;P의 유일한 원소 1은 Q에 속하므로 P⊂Q이다. 따라서 (1)의 명제는 참이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2) · 가정과 결론의 진리집합을 비교한다&#x27;,`&lt;p&gt;소수의 집합을 P, 홀수의 집합을 Q라 하면 다음과 같다.&lt;/p&gt;${formula(&#x27;P={2,3,5,…}&#x27;)}${formula(&#x27;Q={1,3,5,…}&#x27;)}&lt;p&gt;P의 원소 2는 Q에 속하지 않으므로 P⊄Q이다.&lt;/p&gt;`),
            step(&#x27;(2) · 반례를 확인하고 결론을 쓴다&#x27;,`&lt;p&gt;2는 소수이지만 홀수가 아니다. 이처럼 명제가 거짓임을 보여 주는 예를 &lt;strong&gt;반례&lt;/strong&gt;라고 한다. 따라서 (2)의 명제는 거짓이다.&lt;/p&gt;${answer(&#x27;(1) 참　(2) 거짓&#x27;)}`)
          ]}),
          card({id:&#x27;p87-p1&#x27;,page:87,label:&#x27;문제 1&#x27;,kind:&#x27;problem&#x27;,title:&#x27;다음 명제의 참, 거짓을 판별하시오&#x27;,body:setPrompt(&#x27;다음 명제의 참, 거짓을 판별하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) x≤6이면 x²≤36이다.&lt;/p&gt;&lt;p&gt;(2) 4의 약수는 8의 약수이다.&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) · 반례 하나면 거짓이다&#x27;,`${formula(&#x27;x=-7:　-7≤6,　(-7)²=49&gt;36&#x27;)}&lt;p&gt;가정은 참, 결론은 거짓이므로 (1)은 거짓이다.&lt;/p&gt;`),
            step(&#x27;(2) · 약수 집합을 비교한다&#x27;,`${divisorEightTruthSetFigure()}${formula(&#x27;P={1,2,4},　Q={1,2,4,8}&#x27;)}${formula(&#x27;P⊂Q&#x27;)}`),
            step(&#x27;포함 관계에서 답을 정한다&#x27;,`${answer(&#x27;(1) 거짓　(2) 참&#x27;)}`)
          ]}),
          card({id:&#x27;p88-think&#x27;,page:88,label:&#x27;생각 열기&#x27;,kind:&#x27;thinking&#x27;,title:&#x27;호의 길이와 원주각의 크기&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;다음은 한 원에서 호의 길이와 원주각의 크기 사이의 관계에 대한 명제이다.&lt;/p&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;‘호의 길이가 같으면 원주각의 크기가 같다.’&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;&lt;strong&gt;1&lt;/strong&gt; 위의 명제에서 가정과 결론을 찾아보자.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;2&lt;/strong&gt; 가정과 결론을 서로 바꾼 명제를 문장으로 나타내 보자.&lt;/p&gt;&lt;/div&gt;&#x27;),visual:arcAndInscribedAngleFigure(),visualFirst:true,steps:[
            step(&#x27;1 · 가정과 결론을 찾는다&#x27;,&#x27;&lt;p&gt;‘이면’ 앞의 “호의 길이가 같다.”가 가정이고, 뒤의 “원주각의 크기가 같다.”가 결론이다.&lt;/p&gt;&#x27;),
            step(&#x27;2 · 가정과 결론을 서로 바꾼다&#x27;,`&lt;p&gt;가정과 결론의 위치를 바꾸면 “원주각의 크기가 같으면 호의 길이가 같다.”가 된다.&lt;/p&gt;${answer(&#x27;가정: 호의 길이가 같다.　결론: 원주각의 크기가 같다.&lt;br&gt;바꾼 명제: 원주각의 크기가 같으면 호의 길이가 같다.&#x27;)}`)
          ]}),
          card({id:&#x27;p88-rel&#x27;,page:88,label:&#x27;개념&#x27;,title:&#x27;명제의 역과 대우&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;명제 p→q에서 가정과 결론을 서로 바꾼 명제&lt;/p&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;q→p&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;를 명제 p→q의 &lt;strong&gt;역&lt;/strong&gt;이라고 한다.&lt;/p&gt;&lt;p&gt;또, 명제 p→q에서 가정과 결론을 각각 부정하여 서로 바꾼 명제&lt;/p&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;~q→~p&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;를 명제 p→q의 &lt;strong&gt;대우&lt;/strong&gt;라고 한다.&lt;/p&gt;&lt;div class=&quot;example-strip&quot;&gt;&lt;p&gt;&lt;strong&gt;보기&lt;/strong&gt; 명제 ‘x=1이면 x²=1이다.’의 역과 대우는 다음과 같다.&lt;/p&gt;&lt;p&gt;① 역: x²=1이면 x=1이다.　② 대우: x²≠1이면 x≠1이다.&lt;/p&gt;&lt;/div&gt;&#x27;),visual:propositionRelationFigure()}),
          card({id:&#x27;p88-p2&#x27;,page:88,label:&#x27;문제 2&#x27;,kind:&#x27;problem&#x27;,title:&#x27;다음 명제의 역과 대우를 말하시오&#x27;,body:setPrompt(&#x27;다음 명제의 역과 대우를 말하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) a=b이면 a²=b²이다.&lt;/p&gt;&lt;p&gt;(2) x²&gt;4이면 x&gt;2이다.&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) · 가정과 결론을 구분한다&#x27;,`&lt;p&gt;가정 p는 a=b이고, 결론 q는 a²=b²이다.&lt;/p&gt;${formula(&#x27;p: a=b　　q: a²=b²&#x27;)}`),
            step(&#x27;(1) · 역과 대우를 색이 다른 칸에서 확인한다&#x27;,`${relationAnswerPanel(&#x27;a²=b²이면 a=b이다.&#x27;,&#x27;a²≠b²이면 a≠b이다.&#x27;)}&lt;p&gt;역은 p와 q의 자리를 바꾸고, 대우는 q와 p를 각각 부정한 뒤 자리를 바꾼다.&lt;/p&gt;`),
            step(&#x27;(2) · 가정과 결론 및 각각의 부정을 확인한다&#x27;,`&lt;p&gt;가정은 x²&amp;gt;4이고 결론은 x&amp;gt;2이다.&lt;/p&gt;${formula(&#x27;p: x²&gt;4　　q: x&gt;2&#x27;)}${formula(&#x27;~p: x²≤4　　~q: x≤2&#x27;)}`),
            step(&#x27;(2) · 역과 대우를 색이 다른 칸에서 확인한다&#x27;,`${relationAnswerPanel(&#x27;x&amp;gt;2이면 x²&amp;gt;4이다.&#x27;,&#x27;x≤2이면 x²≤4이다.&#x27;)}${answer(&#x27;(1) 역: a²=b²이면 a=b이다.　대우: a²≠b²이면 a≠b이다.&lt;br&gt;(2) 역: x&gt;2이면 x²&gt;4이다.　대우: x≤2이면 x²≤4이다.&#x27;)}`)
          ]}),
          card({id:&#x27;p88-contrapositive&#x27;,page:88,label:&#x27;개념&#x27;,title:&#x27;명제와 그 대우의 참, 거짓&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;명제와 그 대우의 참, 거짓 관계를 알아보자.&lt;/p&gt;&lt;p&gt;전체집합 U에 대하여 두 조건 p와 q의 진리집합을 각각 P와 Q라 할 때,&lt;/p&gt;&lt;p&gt;&lt;strong&gt;①&lt;/strong&gt; 명제 p→q가 참이면 P⊂Q이므로 Qᶜ⊂Pᶜ이다. 따라서 명제 p→q의 대우인 ~q→~p도 참이다.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;②&lt;/strong&gt; 명제 p→q가 거짓이면 P⊄Q이므로 Qᶜ⊄Pᶜ이다. 따라서 명제 p→q의 대우인 ~q→~p도 거짓이다.&lt;/p&gt;&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;명제와 그 대우의 참, 거짓&lt;/strong&gt;&lt;br&gt;① 명제 p→q가 참이면 그 대우 ~q→~p도 참이다.&lt;br&gt;② 명제 p→q가 거짓이면 그 대우 ~q→~p도 거짓이다.&lt;/div&gt;&#x27;),visual:contrapositiveTruthFigure()}),
          card({id:&#x27;p89-p3&#x27;,page:89,label:&#x27;문제 3&#x27;,kind:&#x27;problem&#x27;,title:&#x27;대우를 말하고 참, 거짓 판별하기&#x27;,body:setPrompt(&#x27;자연수 a에 대한 명제 ‘3a+7이 홀수이면 a는 짝수이다.’의 대우를 말하고, 그 참, 거짓을 판별하시오.&#x27;),steps:[
            step(&#x27;가정 p와 결론 q를 구분한다&#x27;,&#x27;&lt;p&gt;가정 p는 “3a+7이 홀수이다.”이고, 결론 q는 “a는 짝수이다.”이다.&lt;/p&gt;&#x27;),
            step(&#x27;가정과 결론을 각각 부정한다&#x27;,&#x27;&lt;p&gt;정수는 홀수 또는 짝수이므로 “3a+7이 홀수이다.”의 부정은 “3a+7이 짝수이다.”이다. “a는 짝수이다.”의 부정은 “a는 홀수이다.”이다.&lt;/p&gt;&#x27;),
            step(&#x27;부정한 결론을 앞에 놓아 대우를 쓴다&#x27;,&#x27;&lt;div class=&quot;relation-answer-grid single&quot;&gt;&lt;section class=&quot;relation-answer-card contrapositive&quot;&gt;&lt;span class=&quot;relation-answer-label&quot;&gt;대우&lt;/span&gt;&lt;p class=&quot;relation-answer-statement&quot;&gt;a가 홀수이면 3a+7은 짝수이다.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;p&gt;대우는 ~q→~p이므로 부정한 결론 ~q를 앞에, 부정한 가정 ~p를 뒤에 놓는다.&lt;/p&gt;&#x27;),
            step(&#x27;a가 홀수인 경우를 식으로 나타낸다&#x27;,`&lt;p&gt;a가 홀수이면 어떤 정수 k에 대하여 a=2k+1로 나타낼 수 있다.&lt;/p&gt;${formula(&#x27;a=2k+1&#x27;)}`),
            step(&#x27;3a+7을 계산하여 짝수인지 확인한다&#x27;,`&lt;p&gt;a=2k+1을 대입하면 3a+7=3(2k+1)+7=6k+10=2(3k+5)이다. 따라서 3a+7은 짝수이고 대우는 참이다.&lt;/p&gt;${formula(&#x27;3a+7=2(3k+5)&#x27;)}${answer(&#x27;대우: a가 홀수이면 3a+7은 짝수이다.　참&#x27;)}`)
          ]}),
          card({id:&#x27;p89-necessary&#x27;,page:89,label:&#x27;개념&#x27;,title:&#x27;충분조건과 필요조건&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;명제 p→q가 참일 때, 이것을 기호로 다음과 같이 나타낸다.&lt;/p&gt;&lt;div class=&quot;logic-symbol-panel&quot;&gt;&lt;div class=&quot;logic-symbol&quot;&gt;p ⇒ q&lt;/div&gt;&lt;p class=&quot;logic-symbol-copy&quot;&gt;이때 &lt;strong&gt;p는 q이기 위한 충분조건&lt;/strong&gt;,&lt;br&gt;&lt;strong&gt;q는 p이기 위한 필요조건&lt;/strong&gt;이라고 한다.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;또, 명제 p→q에 대하여 p⇒q이고 q⇒p일 때, 이것을 기호로 다음과 같이 나타낸다.&lt;/p&gt;&lt;div class=&quot;logic-symbol-panel&quot;&gt;&lt;div class=&quot;logic-symbol&quot;&gt;p ⇔ q&lt;/div&gt;&lt;p class=&quot;logic-symbol-copy&quot;&gt;이때 &lt;strong&gt;p는 q이기 위한 필요충분조건&lt;/strong&gt;이라고 한다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;necessary-example-grid&quot;&gt;&lt;div&gt;&lt;strong&gt;충분조건과 필요조건&lt;/strong&gt;&lt;div class=&quot;condition-flow&quot;&gt;&lt;span&gt;a는 4의 배수이다.&lt;/span&gt;&lt;b&gt;⇒&lt;/b&gt;&lt;span&gt;a는 2의 배수이다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;condition-role-map&quot;&gt;&lt;span&gt;&lt;strong&gt;충분조건&lt;/strong&gt;‘a는 4의 배수이다.’&lt;/span&gt;&lt;span&gt;&lt;strong&gt;필요조건&lt;/strong&gt;‘a는 2의 배수이다.’&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;necessary-example-source&quot;&gt;예를 들어 ‘a는 4의 배수이다.’ ⇒ ‘a는 2의 배수이다.’에서 ‘a는 4의 배수이다.’는 ‘a는 2의 배수이다.’이기 위한 충분조건, ‘a는 2의 배수이다.’는 ‘a는 4의 배수이다.’이기 위한 필요조건이다.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;필요충분조건&lt;/strong&gt;&lt;div class=&quot;condition-flow&quot;&gt;&lt;span&gt;a는 짝수이다.&lt;/span&gt;&lt;b&gt;⇔&lt;/b&gt;&lt;span&gt;a는 2의 배수이다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;condition-role-map&quot;&gt;&lt;span&gt;&lt;strong&gt;양쪽 모두&lt;/strong&gt;필요조건&lt;/span&gt;&lt;span&gt;&lt;strong&gt;양쪽 모두&lt;/strong&gt;충분조건&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;necessary-example-source&quot;&gt;또, ‘a는 짝수이다.’ ⇔ ‘a는 2의 배수이다.’에서 ‘a는 짝수이다.’는 ‘a는 2의 배수이다.’이기 위한 필요충분조건이다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p&gt;두 조건 p와 q의 진리집합을 각각 P와 Q라 할 때, P⊂Q이면 p⇒q이므로 p는 q이기 위한 충분조건이고, q는 p이기 위한 필요조건이다.&lt;/p&gt;&lt;p&gt;특히, P=Q이면 p⇔q이므로 p는 q이기 위한 필요충분조건이다.&lt;/p&gt;&#x27;),visual:propositionSetFigure(&#x27;necessary&#x27;)}),
          card({id:&#x27;p90-example2&#x27;,page:90,label:&#x27;예제 2&#x27;,kind:&#x27;example&#x27;,title:&#x27;두 조건 p와 q가 다음과 같을 때, p는 q이기 위한 어떤 조건인지 말하시오&#x27;,body:textbookOriginal(&#x27;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) p: x는 3의 배수이다.　　q: x는 9의 배수이다.&lt;/p&gt;&lt;p&gt;(2) p: x²≤25　　　　　　q: |x|≤5&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) · 9의 배수는 3의 배수에 포함된다&#x27;,`${formula(&#x27;Q={9,18,27,…}⊂P={3,6,9,…}&#x27;)}&lt;p&gt;q→p만 참이므로 p는 q의 필요조건이다.&lt;/p&gt;`),
            step(&#x27;(2) · 두 조건은 같은 구간이다&#x27;,`${formula(&#x27;x²≤25 ⇔ -5≤x≤5 ⇔ |x|≤5&#x27;)}&lt;p&gt;P=Q이므로 필요충분조건이다.&lt;/p&gt;`),
            step(&#x27;결과를 비교한다&#x27;,`${answer(&#x27;(1) 필요조건　(2) 필요충분조건&#x27;)}`)
          ]}),
          card({id:&#x27;p90-p4&#x27;,page:90,label:&#x27;문제 4&#x27;,kind:&#x27;problem&#x27;,title:&#x27;필요조건, 충분조건 판별하기&#x27;,body:setPrompt(&#x27;두 조건 p와 q가 다음과 같을 때, p는 q이기 위한 어떤 조건인지 말하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) p: a=0이고 b=0　　q: ab=0&lt;/p&gt;&lt;p&gt;(2) p: 2x-1&amp;lt;5　　　　 q: -1&amp;lt;2-x&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) · p이면 q이지만 역은 거짓이다&#x27;,`&lt;p&gt;a=b=0이면 ab=0이다. 반례 a=0, b=1에서는 ab=0이지만 p는 거짓이다.&lt;/p&gt;${formula(&#x27;p→q,　q⇏p&#x27;)}`),
            step(&#x27;(2) · 두 부등식을 각각 정리한다&#x27;,`${formula(&#x27;2x-1&lt;5 ⇔ x&lt;3&#x27;)}${formula(&#x27;-1&lt;2-x ⇔ x&lt;3&#x27;)}`),
            step(&#x27;충분·필요 관계를 확정한다&#x27;,`${answer(&#x27;(1) 충분조건　(2) 필요충분조건&#x27;)}`)
          ]}),
          card({id:&#x27;p90-think&#x27;,page:90,label:&#x27;생각 넓히기&#x27;,kind:&#x27;thinking&#x27;,title:&#x27;세 조건의 포함 관계로 참인 명제 찾기&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;전체집합 U에 대하여 세 조건 p, q, r은 다음을 만족시킨다.&lt;/p&gt;&lt;div class=&quot;formula-pair&quot;&gt;&lt;div class=&quot;concept-highlight&quot;&gt;p는 q이기 위한 필요조건&lt;/div&gt;&lt;div class=&quot;concept-highlight&quot;&gt;r은 q이기 위한 충분조건&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;&lt;strong&gt;활동 1&lt;/strong&gt; 세 조건 p, q, r의 진리집합 사이의 포함 관계를 벤 다이어그램으로 나타내 보자.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;활동 2&lt;/strong&gt; 활동 1의 결과를 이용하여 다음에서 참인 명제를 모두 찾아보자.&lt;/p&gt;&lt;p&gt;(1) r→p　　(2) q→~p　　(3) ~q→~r　　(4) ~p→r&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;활동 1 · p가 q의 필요조건이라는 뜻을 포함 관계로 바꾼다&#x27;,`&lt;p&gt;p가 q이기 위한 필요조건이면 q→p가 참이다. 따라서 q의 진리집합 Q는 p의 진리집합 P에 포함된다.&lt;/p&gt;${formula(&#x27;Q⊂P&#x27;)}`),
            step(&#x27;활동 1 · r이 q의 충분조건이라는 뜻을 포함 관계로 바꾼다&#x27;,`&lt;p&gt;r이 q이기 위한 충분조건이면 r→q가 참이다. 따라서 r의 진리집합 R은 q의 진리집합 Q에 포함된다.&lt;/p&gt;${formula(&#x27;R⊂Q&#x27;)}`),
            step(&#x27;활동 1 · 두 포함 관계를 한 그림에 나타낸다&#x27;,`${nestedConditionFigure()}${formula(&#x27;R⊂Q⊂P&#x27;)}`),
            step(&#x27;활동 2의 (1)을 활동 1의 벤 다이어그램으로 판단한다&#x27;,`${nestedConditionReasonFigure(&#x27;rToP&#x27;)}&lt;p&gt;가장 안쪽의 R은 Q 안에 있고, Q는 P 안에 있다. 따라서 R의 모든 원소는 P에도 들어 있으므로 r→p는 참이다.&lt;/p&gt;`),
            step(&#x27;활동 2의 (2)를 활동 1의 벤 다이어그램으로 판단한다&#x27;,`${nestedConditionReasonFigure(&#x27;qToNotP&#x27;)}&lt;p&gt;Q 전체가 P 안에 있으므로 q가 참인 원소는 반드시 p도 참이다. 따라서 q가 참이면서 ~p가 참인 원소는 없고, q→~p는 거짓이다.&lt;/p&gt;`),
            step(&#x27;활동 2의 (3)을 활동 1의 벤 다이어그램으로 판단한다&#x27;,`${nestedConditionReasonFigure(&#x27;notQToNotR&#x27;)}&lt;p&gt;R이 Q 안에 있으므로 Q 바깥의 원소는 반드시 R 바깥에도 있다. 즉, Qᶜ⊂Rᶜ이므로 ~q→~r은 참이다.&lt;/p&gt;`),
            step(&#x27;활동 2의 (4)를 활동 1의 벤 다이어그램으로 판단한다&#x27;,`${nestedConditionReasonFigure(&#x27;notPToR&#x27;)}&lt;p&gt;~p의 진리집합 Pᶜ은 P의 바깥이고, R은 P의 가장 안쪽에 있다. Pᶜ의 원소가 R에 들어갈 수 없으므로 ~p→r은 거짓이다.&lt;/p&gt;${answer(&#x27;활동 1: R⊂Q⊂P　활동 2: (1), (3)&#x27;)}`)
          ]})
        ].join(&#x27;&#x27;);
      }

      function propositionProofCards() {
        return [

            step(&#x27;계산 결과를 해석한다&#x27;,&#x27;&lt;p&gt;2(2k²-2k+1)-1은 2×자연수-1의 꼴이므로 홀수이다. 따라서 n이 홀수이면 n²도 홀수이다.&lt;/p&gt;&#x27;),

          card({id:&#x27;p92-p2&#x27;,page:92,label:&#x27;문제 2&#x27;,kind:&#x27;problem&#x27;,title:&#x27;귀류법을 이용하여 다음 명제가 참임을 증명하시오&#x27;,body:setPrompt(&#x27;귀류법을 이용하여 다음 명제가 참임을 증명하시오.&lt;div class=&quot;concept-highlight&quot;&gt;&lt;strong&gt;‘1+√2는 유리수가 아니다.’&lt;/strong&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;결론을 부정해 가정한다&#x27;,`${proofStatement(&#x27;1+√2&#x27;,&#x27;는 유리수이다.&#x27;)}`),
            step(&#x27;양변에서 유리수 1을 뺀다&#x27;,`${formula(&#x27;√2=(1+√2)-1&#x27;)}&lt;p&gt;유리수에서 유리수 1을 빼면 유리수여야 한다.&lt;/p&gt;`),
            step(&#x27;앞의 예제와 모순임을 확인한다&#x27;,`&lt;p&gt;그러면 √2가 유리수가 되지만, 예제 2에서 √2는 무리수임을 증명했다.&lt;/p&gt;&lt;div class=&quot;independent-proof-cue&quot;&gt;&lt;strong&gt;다른 풀이 시작&lt;/strong&gt; · 다음 단계를 누르면 앞의 예제를 이용하지 않고 이 문제만으로 증명합니다.&lt;/div&gt;`),
            step(&#x27;독립 풀이 1 · 기약분수로 가정한다&#x27;,`&lt;p&gt;1+√2가 유리수라고 가정하자. 서로소인 자연수 m, n을 사용하여 기약분수로 나타낼 수 있다. 1+√2는 1보다 크므로 n&amp;gt;m이다.&lt;/p&gt;${formula(&#x27;1+√2=n/m&#x27;)}`),
            step(&#x27;독립 풀이 2 · 양변에서 1을 뺀다&#x27;,`&lt;p&gt;1을 빼고 양변에 m을 곱하면 n-m=m√2이다. n&amp;gt;m이므로 t=n-m은 자연수이다.&lt;/p&gt;${formula(&#x27;√2=(n-m)/m&#x27;)}${formula(&#x27;t=n-m&#x27;)}`),
            step(&#x27;독립 풀이 3 · 두 변을 제곱한다&#x27;,`&lt;p&gt;t=m√2에서 양변을 제곱하면 t²=2m²이다. 따라서 t²은 짝수이다.&lt;/p&gt;${formula(&#x27;t²=2m²&#x27;)}`),
            step(&#x27;독립 풀이 4 · t가 짝수임을 확인한다&#x27;,`&lt;p&gt;t가 홀수라면 어떤 0 이상의 정수 k에 대하여 t=2k+1이다. 그러면 t²=4k(k+1)+1은 홀수여서 앞 단계와 모순이다. 따라서 t는 짝수이고 t=2k로 쓸 수 있다.&lt;/p&gt;${formula(&#x27;t=2k&#x27;)}`),
            step(&#x27;독립 풀이 5 · m도 짝수임을 확인한다&#x27;,`&lt;p&gt;t=2k를 t²=2m²에 대입하면 4k²=2m², 즉 m²=2k²이다. m²도 짝수이므로 같은 홀짝성 판단에 따라 m은 짝수이다.&lt;/p&gt;${formula(&#x27;m²=2k²&#x27;)}`),
            step(&#x27;독립 풀이 6 · 서로소 조건과 모순을 얻는다&#x27;,`&lt;p&gt;t=n-m과 m이 모두 짝수이므로 n=t+m도 짝수이다. 따라서 m과 n은 공약수 2를 가지며, 서로소라는 처음 가정에 모순된다.&lt;/p&gt;${answer(&#x27;따라서 1+√2는 유리수가 아니다.&#x27;)}`)
          ]}),
          card({id:&#x27;p92-absolute-think&#x27;,page:92,label:&#x27;생각 열기&#x27;,kind:&#x27;thinking&#x27;,title:&#x27;항상 성립하는 부등식 찾기&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;다음과 같은 세 부등식이 있다.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;① x²+1&amp;gt;0　　② x²-1&amp;gt;0　　③ |x-1|≥0&lt;/p&gt;&lt;/div&gt;&lt;p&gt;모든 실수 x에 대하여 항상 성립하는 부등식을 말해 보자.&lt;/p&gt;&#x27;),visual:absoluteInequalityOpeningFigure(),visualFirst:true,steps:[
            step(&#x27;① x²+1&gt;0을 판단한다&#x27;,&#x27;&lt;p&gt;모든 실수 x에 대하여 x²≥0이므로 x²+1≥1&amp;gt;0이다. 따라서 ①은 항상 성립한다.&lt;/p&gt;&#x27;),
            step(&#x27;② x²-1&gt;0을 판단한다&#x27;,&#x27;&lt;p&gt;x=0을 대입하면 x²-1=-1이고 -1&amp;gt;0은 거짓이다. 반례가 있으므로 ②는 항상 성립하지 않는다.&lt;/p&gt;&#x27;),
            step(&#x27;③ |x-1|≥0을 판단한다&#x27;,`&lt;p&gt;절댓값은 수직선에서 두 점 사이의 거리이므로 항상 0 이상이다. 따라서 ③은 항상 성립한다.&lt;/p&gt;${answer(&#x27;모든 실수 x에 대하여 항상 성립하는 부등식은 ①, ③이다.&#x27;)}`)
          ]}),
          card({id:&#x27;p93-absolute&#x27;,page:93,label:&#x27;개념&#x27;,title:&#x27;절대부등식&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;앞의 생각 열기에서 두 부등식 x²+1&amp;gt;0과 |x-1|≥0은 모든 실수 x에 대하여 항상 성립한다. 이와 같이 &lt;strong&gt;주어진 집합의 모든 원소에 대하여 항상 성립하는 부등식&lt;/strong&gt;을 &lt;strong&gt;절대부등식&lt;/strong&gt;이라고 한다.&lt;/p&gt;&lt;p&gt;절대부등식을 증명할 때 다음과 같은 성질이 자주 이용된다.&lt;/p&gt;&#x27;),visual:absolutePropertiesFigure()}),
          card({id:&#x27;p93-example3&#x27;,page:93,label:&#x27;예제 3&#x27;,kind:&#x27;example&#x27;,title:&#x27;a와 b가 실수일 때, 부등식 a²+b²≥ab가 성립함을 증명하시오&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;a와 b가 실수일 때, 부등식 a²+b²≥ab가 성립함을 증명하시오.&lt;/p&gt;&#x27;),visual:inequalityProofRouteFigure(),visualFirst:true,steps:[
            step(&#x27;좌변에서 우변을 빼서 0 이상인지 확인한다&#x27;,`&lt;p&gt;a²+b²≥ab를 증명하려면 a²-ab+b²≥0임을 보이면 된다.&lt;/p&gt;${formula(&#x27;a²-ab+b²&#x27;)}`),
            step(&#x27;a에 관한 완전제곱식으로 만든다&#x27;,`&lt;p&gt;a²-ab에서 a의 계수 -b의 절반은 -b/2이다.&lt;/p&gt;${formula(&#x27;a²-ab+b²=(a-b/2)²+3b²/4&#x27;)}`),
            step(&#x27;각 항이 0 이상임을 확인한다&#x27;,&#x27;&lt;p&gt;제곱은 항상 0 이상이므로 (a-b/2)²≥0이고, 3b²/4≥0이다. 따라서 두 항의 합도 0 이상이다.&lt;/p&gt;&#x27;),
            step(&#x27;원래 부등식과 등호 조건을 정리한다&#x27;,`&lt;p&gt;두 제곱항이 모두 0일 때 등호가 성립한다. b=0이고 a-b/2=0이므로 a=0이다.&lt;/p&gt;${answer(&#x27;a²+b²≥ab이고, 등호는 a=b=0일 때 성립한다.&#x27;)}`)
          ]}),
          card({id:&#x27;p93-p3&#x27;,page:93,label:&#x27;문제 3&#x27;,kind:&#x27;problem&#x27;,title:&#x27;a와 b가 실수일 때, 다음 부등식이 성립함을 증명하시오&#x27;,body:setPrompt(&#x27;a와 b가 실수일 때, 다음 부등식이 성립함을 증명하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) (a+b)²≥4ab&lt;/p&gt;&lt;p&gt;(2) a²-4ab+5b²≥0&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) · 좌변에서 우변을 빼 완전제곱한다&#x27;,`${formula(&#x27;(a+b)²-4ab=(a-b)²≥0&#x27;)}`),
            step(&#x27;(1) · 등호는 a=b일 때이다&#x27;,&#x27;&lt;p&gt;(a-b)²=0일 때, 즉 a=b일 때 등호이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2) · 두 제곱의 합으로 바꾼다&#x27;,`${formula(&#x27;a²-4ab+5b²=(a-2b)²+b²≥0&#x27;)}`),
            step(&#x27;(2) · 두 제곱이 모두 0일 때만 등호이다&#x27;,`&lt;p&gt;b=0, a-2b=0이므로 a=b=0이다.&lt;/p&gt;${answer(&#x27;(1) 등호 a=b　(2) 등호 a=b=0&#x27;)}`)
          ]}),
          card({id:&#x27;p93-amgm&#x27;,page:93,label:&#x27;개념&#x27;,title:&#x27;산술평균과 기하평균&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;a&amp;gt;0이고 b&amp;gt;0일 때, (a+b)/2와 √(ab)를 각각 a와 b의 &lt;strong&gt;산술평균&lt;/strong&gt;과 &lt;strong&gt;기하평균&lt;/strong&gt;이라고 한다.&lt;/p&gt;&#x27;),visual:amgmConceptFigure()}),
          card({id:&#x27;p93-example4&#x27;,page:93,label:&#x27;예제 4&#x27;,kind:&#x27;example&#x27;,title:&#x27;산술평균과 기하평균의 관계 증명하기&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;a&amp;gt;0이고 b&amp;gt;0일 때, 부등식 (a+b)/2≥√(ab)가 성립함을 증명하시오.&lt;/p&gt;&#x27;),steps:[
            step(&#x27;좌변에서 우변을 뺀다&#x27;,`&lt;p&gt;두 수의 크기를 비교하기 위해 산술평균에서 기하평균을 뺀다.&lt;/p&gt;${formula(&#x27;(a+b)/2-√(ab)&#x27;)}`),
            step(&#x27;a와 b를 제곱근의 제곱으로 나타낸다&#x27;,`&lt;p&gt;a=(√a)², b=(√b)²이고 √(ab)=√a√b이다.&lt;/p&gt;${formula(&#x27;{(√a)²-2√a√b+(√b)²}/2&#x27;)}`),
            step(&#x27;완전제곱식으로 정리한다&#x27;,`${formula(&#x27;{(√a-√b)²}/2≥0&#x27;)}&lt;p&gt;제곱은 항상 0 이상이므로 산술평균에서 기하평균을 뺀 값도 0 이상이다.&lt;/p&gt;`),
            step(&#x27;부등식과 등호 조건을 정리한다&#x27;,`&lt;p&gt;등호는 √a=√b, 즉 a=b일 때 성립한다.&lt;/p&gt;${answer(&#x27;(a+b)/2≥√(ab), 등호는 a=b일 때 성립한다.&#x27;)}`)
          ]}),
          card({id:&#x27;p94-p4&#x27;,page:94,label:&#x27;문제 4&#x27;,kind:&#x27;problem&#x27;,title:&#x27;a&gt;0이고 b&gt;0일 때, 다음 부등식이 성립함을 증명하시오&#x27;,body:setPrompt(&#x27;a&amp;gt;0이고 b&amp;gt;0일 때, 다음 부등식이 성립함을 증명하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) a+1/a≥2&lt;/p&gt;&lt;p&gt;(2) √(ab)≥2ab/(a+b)&lt;/p&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;(1) · 양수 a와 1/a에 산술·기하평균을 적용한다&#x27;,`${formula(&#x27;{a+1/a}/2≥√(a·1/a)=1&#x27;)}${formula(&#x27;a+1/a≥2&#x27;)}`),
            step(&#x27;(1) · 등호 조건을 확인한다&#x27;,&#x27;&lt;p&gt;a=1/a이고 a&amp;gt;0이므로 a=1이다.&lt;/p&gt;&#x27;),
            step(&#x27;(2) · 먼저 a+b≥2√(ab)를 얻는다&#x27;,`${formula(&#x27;{a+b}/2≥√(ab)&#x27;)}${formula(&#x27;a+b≥2√(ab)&gt;0&#x27;)}`),
            step(&#x27;(2) · 역수를 취하고 2ab를 곱한다&#x27;,`&lt;p&gt;두 변이 양수이므로 역수를 취하면 부등호가 뒤집힌다.&lt;/p&gt;${formula(&#x27;{1}/{a+b}≤{1}/{2√(ab)}&#x27;)}${formula(&#x27;{2ab}/{a+b}≤√(ab)&#x27;)}${answer(&#x27;(1) a+1/a≥2, 등호 a=1　(2) √(ab)≥2ab/(a+b), 등호 a=b&#x27;)}`)
          ]}),
          card({id:&#x27;p94-example5&#x27;,page:94,label:&#x27;예제 5&#x27;,kind:&#x27;example&#x27;,title:&#x27;절댓값의 부등식 증명하기&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;a와 b가 실수일 때, 부등식 |a+b|≤|a|+|b|가 성립함을 증명하시오.&lt;/p&gt;&#x27;),visual:triangleInequalityFigure(),visualFirst:true,steps:[
            step(&#x27;양변이 0 이상임을 확인한다&#x27;,`&lt;p&gt;두 식이 모두 0 이상이므로 제곱해 비교해도 된다.&lt;/p&gt;${formula(&#x27;|a+b|≥0,　|a|+|b|≥0&#x27;)}`),
            step(&#x27;제곱의 차를 계산한다&#x27;,`${formula(&#x27;(|a|+|b|)²-|a+b|²&#x27;)}${formula(&#x27;=2(|ab|-ab)&#x27;)}`),
            step(&#x27;남은 식이 0 이상임을 보인다&#x27;,`${formula(&#x27;|ab|≥ab → 2(|ab|-ab)≥0&#x27;)}&lt;p&gt;따라서 (|a|+|b|)²≥|a+b|²이다.&lt;/p&gt;`),
            step(&#x27;부등식과 등호 조건을 정리한다&#x27;,`&lt;p&gt;양변이 0 이상이므로 제곱 전의 식으로 돌아간다. 등호는 |ab|=ab, 즉 ab≥0일 때이다.&lt;/p&gt;${answer(&#x27;|a+b|≤|a|+|b|, 등호는 ab≥0일 때&#x27;)}`)
          ]}),
          card({id:&#x27;p94-p5&#x27;,page:94,label:&#x27;문제 5&#x27;,kind:&#x27;problem&#x27;,title:&#x27;a와 b가 실수일 때, 다음 부등식이 성립함을 증명하시오.&#x27;,body:setPrompt(&#x27;a와 b가 실수일 때, 다음 부등식이 성립함을 증명하시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(1) |a-b|≤|a|+|b|&lt;/p&gt;&lt;p&gt;(2) |a|-|b|≤|a-b|&lt;/p&gt;&lt;/div&gt;&#x27;),visual:absoluteProblemFiveRouteFigure(),visualFirst:true,steps:[
            step(&#x27;앞에서 증명한 기본 부등식을 사용한다&#x27;,`${formula(&#x27;|x+y|≤|x|+|y|&#x27;)}`),
            step(&#x27;(1) · y=-b를 대입한다&#x27;,`${formula(&#x27;|a-b|=|a+(-b)|≤|a|+|-b|&#x27;)}${formula(&#x27;|a-b|≤|a|+|b|&#x27;)}`),
            step(&#x27;(2) · a=(a-b)+b로 바꾼다&#x27;,`${formula(&#x27;|a|=|(a-b)+b|≤|a-b|+|b|&#x27;)}`),
            step(&#x27;(2) · 양변에서 |b|를 뺀다&#x27;,`${formula(&#x27;|a|-|b|≤|a-b|&#x27;)}${answer(&#x27;(1) |a-b|≤|a|+|b|　(2) |a|-|b|≤|a-b|&#x27;)}`)
          ]}),
          card({id:&#x27;p94-story&#x27;,page:94,label:&#x27;수학 이야기&#x27;,kind:&#x27;review&#x27;,title:&#x27;소수가 무수히 많다고?&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;고대 그리스의 수학자 유클리드(Euclid, B.C. 325?~B.C. 265?)는 그가 쓴 『원론』에서 소수가 무수히 많음을 최초로 증명하였다.&lt;/p&gt;&lt;p&gt;다음은 귀류법을 이용하여 소수가 무수히 많음을 증명한 것이다.&lt;/p&gt;&lt;div class=&quot;story-proof&quot;&gt;&lt;h4 class=&quot;story-proof-title&quot;&gt;&lt;i class=&quot;fa-solid fa-list-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;교과서 증명을 네 장면으로 읽기&lt;/h4&gt;&lt;div class=&quot;story-proof-step&quot;&gt;&lt;span class=&quot;story-proof-number&quot;&gt;1&lt;/span&gt;&lt;p&gt;명제를 부정하여 소수가 유한개만 있다고 하고, 그 유한개의 소수를 p₁, p₂, …, pₙ이라 하자.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-proof-step&quot;&gt;&lt;span class=&quot;story-proof-number&quot;&gt;2&lt;/span&gt;&lt;p&gt;새로운 수 N=p₁p₂⋯pₙ+1을 만들면, N은 1보다 크고 모든 소수 p₁, p₂, …, pₙ 중의 어느 것과도 같지 않으므로 합성수이다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-proof-step&quot;&gt;&lt;span class=&quot;story-proof-number&quot;&gt;3&lt;/span&gt;&lt;p&gt;그러므로 N은 어느 하나의 소수 pₘ(1≤m≤n)으로 나누어떨어져야 한다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;story-proof-step&quot;&gt;&lt;span class=&quot;story-proof-number&quot;&gt;4&lt;/span&gt;&lt;p&gt;그런데 N=p₁p₂⋯pₙ+1을 pₘ으로 나누면 1이 남으므로 모순이다. 따라서 소수는 무수히 많다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&#x27;),steps:[
            step(&#x27;명제를 부정하여 소수가 유한개뿐이라고 가정한다&#x27;,`&lt;p&gt;소수가 무수히 많다는 결론을 부정하여, 소수가 유한개만 있다고 가정한다. 그 소수를 모두 나열하여 p₁, p₂, …, pₙ이라 하자.&lt;/p&gt;${formula(&#x27;모든 소수: p₁, p₂, …, pₙ&#x27;)}`),
            step(&#x27;나열한 모든 소수를 이용해 새로운 수 N을 만든다&#x27;,`${primeInfinityFigure()}&lt;p&gt;모든 소수를 곱한 뒤 1을 더한 새로운 수 N을 만든다. N은 1보다 크고, 나열한 어느 소수와도 같지 않다.&lt;/p&gt;${formula(&#x27;N=p₁·p₂·…·pₙ+1&#x27;)}`),
            step(&#x27;N이 합성수라면 소인수를 가져야 함을 이용한다&#x27;,`&lt;p&gt;N이 나열한 소수 중 어느 것과도 같지 않으므로, 가정 아래에서는 N이 합성수여야 한다.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;따라서 N은 목록 안의 어떤 소수 pₘ(1≤m≤n)으로 나누어떨어져야 한다.&lt;/strong&gt;&lt;/p&gt;`),
            step(&#x27;N을 pₘ으로 나눈 나머지를 계산한다&#x27;,`&lt;p&gt;p₁·p₂·…·pₙ은 pₘ을 인수로 가지므로 pₘ으로 나누어떨어진다. 여기에 1을 더한 N을 pₘ으로 나누면 나머지는 1이다.&lt;/p&gt;${formula(&#x27;N=p₁·p₂·…·pₙ+1&#x27;)}${formula(&#x27;N을 pₘ으로 나눈 나머지=1&#x27;)}`),
            step(&#x27;서로 모순되는 두 결론을 확인한다&#x27;,&#x27;&lt;p&gt;앞에서는 pₘ이 N을 나눈다고 했지만, 실제 계산에서는 나머지가 1이므로 pₘ이 N을 나누지 못한다. 두 결론이 서로 모순이다.&lt;/p&gt;&#x27;),
            step(&#x27;처음 가정을 부정하여 결론을 쓴다&#x27;,`${answer(&#x27;소수가 유한개라는 가정은 거짓이므로 소수는 무수히 많다.&#x27;)}`)
          ]}),
          false ? card({id:&#x27;p95-explore&#x27;,page:95,label:&#x27;탐구 &amp; 융합&#x27;,kind:&#x27;review&#x27;,title:&#x27;절대부등식을 도형으로 증명할 수도 있지!&#x27;,body:textbookOriginal(&#x27;&lt;p&gt;몇 가지 절대부등식은 도형의 길이나 넓이 등에 관한 것으로부터 유래하였다. 이들을 도형을 이용하여 증명함으로써 절대부등식의 기하적 의미를 알 수 있다. 예를 들어 94쪽의 문제 4 (1)의 부등식이 성립함을 도형을 이용하여 증명해 보자.&lt;/p&gt;&lt;p&gt;오른쪽 그림에서 □ABCD는 두 변의 길이가 a와 1/a인 직사각형 네 개를 붙여서 만든 정사각형이다. 이것을 이용하여 부등식 a+1/a≥2가 성립함을 다음과 같이 증명할 수 있다.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;&lt;strong&gt;탐구 1&lt;/strong&gt; 오른쪽 그림에서 □ABCD는 직각을 낀 두 변의 길이가 √a와 √b인 직각삼각형 네 개를 붙여서 만든 정사각형이다. 이것을 이용하여 부등식 (a+b)/2≥√(ab)가 성립함을 증명해 보자.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;탐구 2&lt;/strong&gt; 오른쪽 그림에서 □ABCD와 □EFGH는 넓이가 a²인 정사각형이고, □BIFJ와 □DKHL은 넓이가 b²인 정사각형이다. 이것을 이용하여 부등식 (a+b)²≤2(a²+b²)이 성립함을 증명해 보자.&lt;/p&gt;&lt;/div&gt;&#x27;),visual:reciprocalAreaFigure(),visualFirst:true,steps:[
            step(&#x27;먼저 직사각형 네 개의 넓이를 확인한다&#x27;,`&lt;p&gt;각 직사각형의 두 변의 길이는 a와 1/a이므로 넓이는 a×1/a=1이다. 네 직사각형의 넓이의 합은 4이다.&lt;/p&gt;${formula(&#x27;4×a×1/a=4&#x27;)}`),
            step(&#x27;바깥 정사각형과 직사각형 네 개의 넓이를 비교한다&#x27;,`&lt;p&gt;바깥 정사각형의 한 변의 길이는 a+1/a이므로 넓이는 (a+1/a)²이다. 바깥 정사각형의 넓이는 안의 직사각형 네 개의 합보다 크거나 같다.&lt;/p&gt;${formula(&#x27;(a+1/a)²≥4&#x27;)}`),
            step(&#x27;a&gt;0을 이용하여 제곱을 풀고 등호 조건을 확인한다&#x27;,`&lt;p&gt;a&amp;gt;0이므로 a+1/a&amp;gt;0이다. 따라서 양변의 양의 제곱근을 취하면 a+1/a≥2이다. 가운데 빈 정사각형이 사라질 때, 즉 a=1/a에서 등호가 성립하므로 a=1이다.&lt;/p&gt;${formula(&#x27;a+1/a≥2&#x27;)}`),
            step(&#x27;탐구 1 · 네 직각삼각형과 가운데 정사각형을 확인한다&#x27;,`${amgmAreaFigure()}&lt;p&gt;직각삼각형 네 개를 배치하면 가운데에 한 변의 길이가 |√a-√b|인 정사각형이 남는다. 이 정사각형의 넓이는 0 이상이다.&lt;/p&gt;${formula(&#x27;(√a-√b)²≥0&#x27;)}`),
            step(&#x27;탐구 1 · 가운데 넓이에서 산술평균과 기하평균의 관계를 얻는다&#x27;,`${formula(&#x27;a-2√(ab)+b≥0&#x27;)}${formula(&#x27;a+b≥2√(ab)&#x27;)}${formula(&#x27;{a+b}/2≥√(ab)&#x27;)}&lt;p&gt;가운데 정사각형의 넓이가 0일 때, 즉 a=b일 때 등호가 성립한다.&lt;/p&gt;`),
            step(&#x27;탐구 2 · 넓이의 차를 하나의 정사각형 넓이로 나타낸다&#x27;,`${squareSumAreaFigure()}&lt;p&gt;넓이가 a²인 정사각형 두 개와 넓이가 b²인 정사각형 두 개의 넓이의 합에서, 바깥 정사각형의 넓이 (a+b)²을 빼면 가운데에서 두 번 겹쳐 센 작은 정사각형의 넓이가 남는다.&lt;/p&gt;${formula(&#x27;2(a²+b²)-(a+b)²&#x27;)}${formula(&#x27;=a²-2ab+b²&#x27;)}${formula(&#x27;=(a-b)²≥0&#x27;)}`),
            step(&#x27;탐구 2 · 원래 부등식과 등호 조건을 정리한다&#x27;,`&lt;p&gt;두 넓이의 차가 0 이상이므로 (a+b)²≤2(a²+b²)이다. 등호는 a-b=0, 즉 a=b일 때 성립한다.&lt;/p&gt;${answer(&#x27;도형의 남는 넓이가 0 이상이라는 사실로 세 절대부등식을 증명할 수 있다.&#x27;)}`)
          ]}) : &#x27;&#x27;
        ].join(&#x27;&#x27;);
      }


      function propositionReviewCard(row) {
        const [id,page,label,title,prompt,work,solution] = row;
        const steps = work.map(([heading,copy]) =&gt; step(heading, &#x27;&lt;p&gt;&#x27; + escapeMath(copy) + &#x27;&lt;/p&gt;&#x27;));
        if (solution) steps.push(step(&#x27;마지막 단계: 정답 확인&#x27;, answer(escapeMath(solution))));
        const promptText = escapeMath(prompt);
        const markers = [...promptText.matchAll(/①|②|③|④|⑤|⑴|⑵|⑶|⑷|ㄱ\.|ㄴ\.|ㄷ\.|ㄹ\./g)];
        const formattedPrompt = markers.length &lt; 2 ? promptText :
          promptText.slice(0, markers[0].index).trim() +
          markers.map((marker,index) =&gt; &#x27;&lt;span class=&quot;review-choice&quot;&gt;&#x27; +
            promptText.slice(marker.index, index + 1 &lt; markers.length ? markers[index + 1].index : promptText.length).trim() +
            &#x27;&lt;/span&gt;&#x27;).join(&#x27;&#x27;);
        const body = id === &#x27;middle-summary&#x27;
          ? textbookOriginal(&#x27;&lt;p class=&quot;concept-headline&quot;&gt;참·거짓 → 진리집합 → 함의 → 증명&lt;/p&gt;&lt;p&gt;&#x27; + promptText + &#x27;&lt;/p&gt;&#x27;)
          : setPrompt(formattedPrompt);
        return card({id,page,label,kind:id===&#x27;middle-summary&#x27;?&#x27;concept&#x27;:&#x27;problem&#x27;,title,body,steps,visual:id===&#x27;grand12&#x27;?propositionGrand12Figure():&#x27;&#x27;,visualFirst:id===&#x27;grand12&#x27;});
      }
      function propositionMiddlePrefixCards() {

          card({id:&#x27;middle10&#x27;,page:97,label:&#x27;중단원 마무리 10 · 서술형&#x27;,kind:&#x27;problem&#x27;,title:&#x27;두 명제가 모두 거짓이 되는 매개변수&#x27;,body:setPrompt(&#x27;실수 x에 대하여 두 조건 p와 q가 p: ax²+2x-4≥0, q: x²+2bx+25&gt;0이다. 다음 두 명제가 모두 거짓이 되도록 하는 정수 a의 최댓값을 M, 자연수 b의 최솟값을 m이라 할 때, M+m의 값을 구하는 풀이 과정과 답을 쓰시오.&lt;div class=&quot;problem-list&quot;&gt;&lt;p&gt;(가) 어떤 실수 x에 대하여 p이다.&lt;/p&gt;&lt;p&gt;(나) ~p는 q이기 위한 충분조건이다.&lt;/p&gt;&lt;/div&gt;&#x27;),visual:parabolaReviewFigure(),visualFirst:true,steps:[
            step(&#x27;① “어떤”이 거짓인 뜻을 읽는다&#x27;,`&lt;p&gt;(가)는 p를 만족하는 실수가 하나라도 있다는 말입니다. 이것이 거짓이므로 &lt;strong&gt;그런 실수가 하나도 없습니다.&lt;/strong&gt; 따라서 모든 실수 x에서 p의 식은 0보다 작아야 합니다.&lt;/p&gt;${formula(&#x27;ax²+2x-4&lt;0　(모든 실수 x)&#x27;)}`),
            step(&#x27;② 첫 번째 포물선이 x축 아래에 있을 조건&#x27;,`&lt;p&gt;이차식이 모든 x에서 음수이려면 포물선은 아래로 열리고, x축에 닿지도 않아야 합니다. 아래로 열리려면 a&amp;lt;0이고, x축과 만나지 않으려면 판별식 D가 음수입니다.&lt;/p&gt;${formula(&#x27;D=2²-4·a·(-4)=4+16a&lt;0&#x27;)}`),
            step(&#x27;③ 가능한 정수 a 중 가장 큰 수&#x27;,`&lt;p&gt;4+16a&amp;lt;0을 풀면 a&amp;lt;−1/4입니다. 이 범위에 들어가는 정수는 −1, −2, −3, …이므로 가장 큰 것은 −1입니다.&lt;/p&gt;${formula(&#x27;a&lt;-1/4,　M=-1&#x27;)}`),
            step(&#x27;④ 충분조건을 문장으로 바꾼다&#x27;,`&lt;p&gt;“~p는 q이기 위한 충분조건”은 &lt;strong&gt;~p이면 q이다&lt;/strong&gt;라는 명제입니다. (가)에서 p는 모든 x에서 거짓이므로 ~p는 모든 x에서 참입니다. 이 명제가 거짓이 되려면 q가 거짓인 x가 적어도 하나 있어야 합니다.&lt;/p&gt;${formula(&#x27;x²+2bx+25≤0　(어떤 실수 x)&#x27;)}`),
            step(&#x27;⑤ 두 번째 포물선의 가장 낮은 곳을 찾는다&#x27;,`&lt;p&gt;제곱식 (x+b)²은 언제나 0 이상이고 x=−b일 때 0입니다. 따라서 아래 식의 최솟값은 25−b²입니다.&lt;/p&gt;${formula(&#x27;x²+2bx+25=(x+b)²+25-b²&#x27;)}`),
            step(&#x27;⑥ q가 거짓이 될 수 있는 가장 작은 자연수&#x27;,`&lt;p&gt;최솟값이 0 이하여야 q가 거짓인 x가 있습니다. b는 자연수이므로 b≥5이고, 가장 작은 값은 5입니다. 실제로 b=5이면 x=−5에서 q의 식이 0이어서 “0&amp;gt;0”은 거짓입니다.&lt;/p&gt;${formula(&#x27;25-b²≤0 → b≥5 → m=5&#x27;)}`),
            step(&#x27;⑦ 두 값을 더해 답을 확인한다&#x27;,`${formula(&#x27;M+m=-1+5=4&#x27;)}${answer(&#x27;M+m=4&#x27;)}`)
          ]}),
          card({id:&#x27;middle11&#x27;,page:97,label:&#x27;중단원 마무리 11&#x27;,kind:&#x27;problem&#x27;,title:&#x27;식의 최솟값 구하기&#x27;,body:textbookOriginal(`&lt;div class=&quot;minimum-problem-prompt&quot;&gt;&lt;div class=&quot;wrapup-problem-heading&quot;&gt;&lt;i class=&quot;fa-solid fa-pen-ruler&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;문제&lt;/strong&gt;&lt;/div&gt;&lt;p class=&quot;minimum-problem-intro&quot;&gt;실수 x와 y에 대하여&lt;/p&gt;${formula(&#x27;2x²+y²-4x+25/(x²+y²+1)&#x27;)}&lt;p class=&quot;minimum-problem-goal&quot;&gt;&lt;span&gt;의 최솟값을 구하시오.&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;`),visual:&#x27;&#x27;,visualFirst:false,steps:[
            step(&#x27;① 분모를 한 글자로 묶는다&#x27;,`&lt;p&gt;분모 x²+y²+1은 항상 양수입니다. 같은 묶음이 분자 쪽에도 나타나도록 t라고 놓습니다.&lt;/p&gt;${formula(&#x27;t=x²+y²+1&gt;0&#x27;)}`),
            step(&#x27;② 제곱식이 생기도록 식을 바꾼다&#x27;,`&lt;p&gt;2x²+y²−4x에서 x²+y²+1=t를 먼저 떼어 내면 x²−4x−1이 남습니다. x²−4x=(x−2)²−4를 이용합니다.&lt;/p&gt;${formula(&#x27;2x²+y²-4x+25/t=t+25/t+(x-2)²-5&#x27;)}`),
            step(&#x27;③ 두 양수의 합에 산술·기하평균을 쓴다&#x27;,`&lt;p&gt;t와 25/t는 모두 양수입니다. 두 수의 곱은 25이므로 합은 10 이상입니다. 두 수가 같은 t=5일 때 10이 됩니다.&lt;/p&gt;${formula(&#x27;t+25/t≥2√(t·25/t)=10&#x27;)}`),
            step(&#x27;④ 제곱식의 가장 작은 값도 확인한다&#x27;,`&lt;p&gt;(x−2)²은 0 이상이며, x=2일 때 0입니다. 그러므로 원래 식은 10+0−5보다 작을 수 없습니다.&lt;/p&gt;${formula(&#x27;(x-2)²≥0&#x27;)}${minimumReviewFigure()}`),
            step(&#x27;⑤ 두 조건을 동시에 만족하는지 확인한다&#x27;,`&lt;p&gt;t=5와 x=2가 동시에 가능해야 진짜 최솟값입니다. t=x²+y²+1에 x=2를 넣으면 5=4+y²+1이므로 y=0입니다.&lt;/p&gt;${formula(&#x27;(x,y)=(2,0)&#x27;)}`),
            step(&#x27;⑥ 원래 식에 넣어 계산하고 결론짓는다&#x27;,`&lt;p&gt;x=2, y=0을 원래 식에 넣으면 2×4+0−8+25/5=5입니다. 앞 단계에서 5보다 작을 수 없음을 보였고 실제로 5가 나옵니다.&lt;/p&gt;${formula(&#x27;10+0-5=5&#x27;)}${answer(&#x27;최솟값 5&#x27;)}`)
          ]}),
          card({id:&#x27;grand14&#x27;,page:100,label:&#x27;대단원 마무리 14&#x27;,kind:&#x27;problem&#x27;,title:&#x27;양수 조건에서 식의 최솟값&#x27;,body:grandProblemPrompt(`&lt;ul class=&quot;grand-condition-strip&quot; aria-label=&quot;주어진 조건&quot;&gt;&lt;li&gt;&lt;i class=&quot;fa-solid fa-circle-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;x&amp;gt;0&lt;/li&gt;&lt;li&gt;&lt;i class=&quot;fa-solid fa-circle-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;y&amp;gt;0&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;grand-problem-lead&quot;&gt;x&amp;gt;0이고 y&amp;gt;0일 때,&lt;/p&gt;${formula(&#x27;(4x+1/y)(1/x+16y)&#x27;).replace(&#x27;class=&quot;formula&quot;&#x27;,&#x27;class=&quot;formula grand-problem-formula&quot;&#x27;)}&lt;p class=&quot;grand-problem-goal&quot;&gt;&lt;span&gt;의 최솟값을 구하시오.&lt;/span&gt;&lt;/p&gt;`),visual:&#x27;&#x27;,visualFirst:false,steps:[
            step(&#x27;① 네 개의 곱을 하나씩 전개한다&#x27;,`&lt;p&gt;첫 괄호의 두 항을 둘째 괄호의 두 항과 각각 곱합니다. 두 항 사이의 ×를 확인해 보세요. 네 결과가 4, 64xy, 1/(xy), 16입니다.&lt;/p&gt;${formula(&#x27;(4x)×(1/x)=4&#x27;)}${formula(&#x27;(4x)×(16y)=64xy&#x27;)}${formula(&#x27;(1/y)×(1/x)=1/(xy)&#x27;)}${formula(&#x27;(1/y)×(16y)=16&#x27;)}`),
            step(&#x27;② 같은 종류를 모으고 xy를 묶는다&#x27;,`&lt;p&gt;숫자 4와 16을 더하면 20입니다. 나머지 두 항에는 xy가 공통으로 들어 있습니다. x와 y가 양수이므로 t=xy도 양수입니다.&lt;/p&gt;${formula(&#x27;(4x+1/y)(1/x+16y)=20+64xy+1/(xy)&#x27;)}${formula(&#x27;t=xy&gt;0 → 20+64t+1/t&#x27;)}`),
            step(&#x27;③ 양수 두 항의 합을 줄인다&#x27;,`&lt;p&gt;64t와 1/t는 모두 양수이고, 두 수의 곱은 언제나 64입니다. 산술·기하평균에 따라 이 둘의 합은 16 이상입니다.&lt;/p&gt;${formula(&#x27;64t+1/t≥2√(64t·1/t)=16&#x27;)}`),
            step(&#x27;④ 등호가 성립하는 t를 구한다&#x27;,`&lt;p&gt;산술·기하평균에서 두 양수가 같으면 등호가 성립합니다. t&amp;gt;0이므로 64t=1/t에서 64t²=1, 따라서 t=1/8입니다.&lt;/p&gt;${formula(&#x27;64t=1/t → t=1/8&#x27;)}`),
            step(&#x27;⑤ 실제 x, y를 골라 최솟값을 확인한다&#x27;,`&lt;p&gt;x=1, y=1/8은 둘 다 양수이고 xy=1/8입니다. 이때 20+64×(1/8)+1/(1/8)=20+8+8입니다. 따라서 36에 실제로 도달합니다.&lt;/p&gt;${formula(&#x27;20+16=36&#x27;)}${answer(&#x27;최솟값 36&#x27;)}`)
          ]}),
          card({id:&#x27;grand17&#x27;,page:101,label:&#x27;대단원 마무리 17 · 서술형&#x27;,kind:&#x27;problem&#x27;,title:&#x27;두 가지 방법으로 절대부등식 증명하기&#x27;,body:grandProblemPrompt(`&lt;ul class=&quot;grand-condition-strip&quot; aria-label=&quot;주어진 조건&quot;&gt;&lt;li&gt;&lt;i class=&quot;fa-solid fa-circle-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;a&amp;gt;0&lt;/li&gt;&lt;li&gt;&lt;i class=&quot;fa-solid fa-circle-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;b&amp;gt;0&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;grand-problem-lead&quot;&gt;a&amp;gt;0이고 b&amp;gt;0일 때, 다음 부등식이 성립함을 증명하시오.&lt;/p&gt;${formula(&#x27;a³+b³≥ab(a+b)&#x27;).replace(&#x27;class=&quot;formula&quot;&#x27;,&#x27;class=&quot;formula grand-problem-formula&quot;&#x27;)}`),visual:&#x27;&#x27;,visualFirst:false,steps:[
            step(&#x27;① 증명할 식의 왼쪽에서 오른쪽을 뺀다&#x27;,`&lt;p&gt;큰 쪽에서 작은 쪽을 뺀 결과가 0 이상임을 보이면 부등식을 증명한 것입니다.&lt;/p&gt;${formula(&#x27;a³+b³-ab(a+b)&#x27;)}`),
            step(&#x27;② 같은 인수 a+b를 만든다&#x27;,`&lt;p&gt;a³+b³=(a+b)(a²−ab+b²)이고, ab(a+b)에도 a+b가 들어 있습니다. 공통인수로 묶어 봅니다.&lt;/p&gt;${formula(&#x27;a³+b³-ab(a+b)=(a+b)(a²-2ab+b²)&#x27;)}`),
            step(&#x27;③ 제곱은 언제나 0 이상임을 이용한다&#x27;,`&lt;p&gt;a²−2ab+b²=(a−b)²입니다. a+b는 양수이고 제곱은 0 이상이므로 두 수의 곱도 0 이상입니다.&lt;/p&gt;${formula(&#x27;(a+b)(a-b)²≥0&#x27;)}`),
            step(&#x27;④ 첫 번째 방법의 등호를 살펴본다&#x27;,`&lt;p&gt;a+b&amp;gt;0이므로 곱이 0이 되려면 (a−b)²=0이어야 합니다. 즉 a=b일 때 양변이 같아집니다.&lt;/p&gt;${formula(&#x27;a-b=0 → a=b&#x27;)}`),
            step(&#x27;⑤ 다른 방법: 두 제곱수에 산술·기하평균&#x27;,`&lt;p&gt;a²와 b²는 양수입니다. 두 수의 산술평균은 기하평균 이상이고, a,b가 양수이므로 √(a²b²)=ab입니다.&lt;/p&gt;${formula(&#x27;(a²+b²)/2≥√(a²b²)=ab&#x27;)}${formula(&#x27;a²+b²≥2ab&#x27;)}`),
            step(&#x27;⑥ 양수 a+b를 곱하여 목표식으로 바꾼다&#x27;,`&lt;p&gt;a+b&amp;gt;0이므로 곱해도 부등호 방향은 그대로입니다. 왼쪽은 a³+b³+ab(a+b)로 전개됩니다. 양변에서 ab(a+b)를 빼면 목표식이 됩니다.&lt;/p&gt;${formula(&#x27;(a+b)(a²+b²)≥2ab(a+b)&#x27;)}${formula(&#x27;a³+b³≥ab(a+b)&#x27;)}${answer(&#x27;증명 완료. 등호는 a=b일 때 성립&#x27;)}`)
          ]})
        ].join(&#x27;&#x27;);
      }

      function cardsFor(topic) {

        return propositionWrapupCards();
      }
