      function movementTranslationCards() {
        return [
          card({ id:&#x27;m44-open&#x27;, page:44, label:&#x27;생각 열기&#x27;, kind:&#x27;thinking&#x27;, title:&#x27;장기 차를 A에서 B까지 두 수 만에 옮기기&#x27;, body:`&lt;div class=&quot;thought-opening&quot;&gt;&lt;strong&gt;장기에서 차(車)는 한 수를 둘 때, 선을 따라 한 방향으로 원하는 만큼 움직일 수 있다.&lt;/strong&gt;&lt;p&gt;오른쪽 그림에서 차를 A에서 B로 두 수 만에 옮기려면 어떻게 움직여야 하는지 말해 보자.&lt;/p&gt;&lt;/div&gt;`, visual:chessMoveFigure(), steps:[step(&#x27;1단계: 가로 방향의 칸 수를 센다&#x27;, &#x27;&lt;p&gt;A와 B의 세로선을 비교하면 B는 A보다 오른쪽으로 3칸 떨어져 있다.&lt;/p&gt;&#x27;),step(&#x27;2단계: 세로 방향의 칸 수를 센다&#x27;, &#x27;&lt;p&gt;A와 B의 가로선을 비교하면 B는 A보다 위로 2칸 떨어져 있다.&lt;/p&gt;&#x27;),step(&#x27;마지막 단계: 두 수의 이동을 그림으로 확인한다&#x27;, `${chessSolutionFigure()}${answer(&#x27;오른쪽으로 3칸 움직인 뒤 위로 2칸 움직인다. 또는 위로 2칸 움직인 뒤 오른쪽으로 3칸 움직인다.&#x27;)}`)] }),
          card({ id:&#x27;m44-point&#x27;, page:44, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;점의 평행이동&#x27;, subtitle:&#x27;x축 방향의 이동량과 y축 방향의 이동량을 각각 좌표에 더한다.&#x27;, body:`&lt;p&gt;&lt;strong&gt;한 도형을 일정한 방향으로 일정한 거리만큼 이동하는 것을 평행이동이라고 한다.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;좌표평면 위의 점 P(x,y)를 x축의 방향으로 a만큼, y축의 방향으로 b만큼 평행이동한 점을 P′(x′,y′)이라 하자.&lt;/p&gt;`, visual:`${pointMoveFigure()}&lt;div class=&quot;simulation-box&quot;&gt;&lt;strong&gt;시뮬레이션: 이동량을 바꾸며 P′의 좌표 확인하기&lt;/strong&gt;&lt;div class=&quot;sim-controls&quot;&gt;&lt;label&gt;a=&lt;output id=&quot;move-a-out&quot;&gt;2&lt;/output&gt;&lt;input id=&quot;move-a&quot; type=&quot;range&quot; min=&quot;-4&quot; max=&quot;4&quot; value=&quot;2&quot;&gt;&lt;/label&gt;&lt;label&gt;b=&lt;output id=&quot;move-b-out&quot;&gt;1&lt;/output&gt;&lt;input id=&quot;move-b&quot; type=&quot;range&quot; min=&quot;-4&quot; max=&quot;4&quot; value=&quot;1&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;svg id=&quot;move-sim-svg&quot; class=&quot;concept-diagram&quot; viewBox=&quot;0 0 760 280&quot; role=&quot;img&quot; aria-label=&quot;점 P(1,2)의 평행이동 시뮬레이션&quot;&gt;&lt;/svg&gt;&lt;p id=&quot;move-sim-status&quot; class=&quot;diagram-note&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;`, steps:[step(&#x27;1단계: x좌표의 변화를 확인한다&#x27;, `${formula(&#x27;x′=x+a&#x27;)}&lt;p&gt;x축의 양의 방향은 오른쪽, 음의 방향은 왼쪽이므로 x좌표에 a를 더한다.&lt;/p&gt;`),step(&#x27;2단계: y좌표의 변화를 확인한다&#x27;, `${formula(&#x27;y′=y+b&#x27;)}&lt;p&gt;y축의 양의 방향은 위쪽, 음의 방향은 아래쪽이므로 y좌표에 b를 더한다.&lt;/p&gt;`),step(&#x27;마지막 단계: 두 좌표를 순서쌍으로 정리한다&#x27;, `${formula(&#x27;P(x,y) → P′(x+a,y+b)&#x27;)}${answer(&#x27;평행이동한 점의 좌표는 (x+a, y+b)이다.&#x27;)}`)] }),
          card({ id:&#x27;m44-view&#x27;, page:44, label:&#x27;보기&#x27;, kind:&#x27;example&#x27;, title:&#x27;점 (2,1)을 오른쪽으로 1, 아래로 2만큼 옮기기&#x27;, body:`&lt;p&gt;점 (2,1)을 x축의 방향으로 1만큼, y축의 방향으로 -2만큼 평행이동한 점의 좌표를 구해 보자.&lt;/p&gt;`, steps:[step(&#x27;1단계: x좌표에 x축 방향 이동량 1을 더한다&#x27;, formula(&#x27;2+1=3&#x27;)),step(&#x27;2단계: y좌표에 y축 방향 이동량 -2를 더한다&#x27;, formula(&#x27;1+(-2)=-1&#x27;)),step(&#x27;마지막 단계: 두 결과를 순서쌍으로 쓴다&#x27;, `${formula(&#x27;(2+1,1+(-2))=(3,-1)&#x27;)}${answer(&#x27;(3,-1)&#x27;)}`)] }),
          card({ id:&#x27;m45-p1&#x27;, page:45, label:&#x27;문제 1&#x27;, kind:&#x27;problem&#x27;, title:&#x27;점을 주어진 방향만큼 평행이동하시오&#x27;, body:`&lt;p&gt;다음 점을 x축의 방향으로 -3만큼, y축의 방향으로 2만큼 평행이동한 점의 좌표를 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;(-4,3)&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;(5,-1)&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: x좌표에 -3을 더한다&#x27;, formula(&#x27;-4+(-3)=-7&#x27;)),step(&#x27;⑴ 2단계: y좌표에 2를 더한다&#x27;, formula(&#x27;3+2=5&#x27;)),step(&#x27;⑴ 3단계: 이동한 점을 쓴다&#x27;, formula(&#x27;(-7,5)&#x27;)),step(&#x27;⑵ 1단계: x좌표에 -3을 더한다&#x27;, formula(&#x27;5+(-3)=2&#x27;)),step(&#x27;⑵ 2단계: y좌표에 2를 더한다&#x27;, formula(&#x27;-1+2=1&#x27;)),step(&#x27;마지막 단계: 두 답을 확인한다&#x27;, answer(&#x27;⑴ (-7,5)　⑵ (2,1)&#x27;))] }),
          card({ id:&#x27;m45-shape&#x27;, page:45, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;도형의 평행이동&#x27;, subtitle:&#x27;도형 위의 모든 점을 같은 방향과 거리만큼 옮긴다.&#x27;, body:`&lt;p&gt;직선의 방정식 y=4x-3과 원의 방정식 x²+y²=9는 각각 4x-y-3=0과 x²+y²-9=0으로 나타낼 수 있다. 이와 같이 좌표평면 위에서 도형의 방정식은 &lt;strong&gt;f(x,y)=0&lt;/strong&gt;의 꼴로 나타낼 수 있다.&lt;/p&gt;&lt;p&gt;방정식 f(x,y)=0이 나타내는 도형 F를 x축의 방향으로 a만큼, y축의 방향으로 b만큼 평행이동한 도형을 F′이라 하자.&lt;/p&gt;`, visual:`${shapeMoveFigure()}&lt;div class=&quot;simulation-box&quot;&gt;&lt;strong&gt;원의 중심으로 확인하는 도형의 평행이동&lt;/strong&gt;&lt;p&gt;원 x²+y²=4의 중심 C(0,0)을 (a,b)만큼 옮기면 중심은 C′(a,b)가 된다. 슬라이더를 움직이며 점의 이동과 식의 대입이 왜 반대 부호로 보이는지 확인해 보자.&lt;/p&gt;&lt;div class=&quot;sim-controls&quot;&gt;&lt;label&gt;a=&lt;output id=&quot;shape-move-a-out&quot;&gt;3&lt;/output&gt;&lt;input id=&quot;shape-move-a&quot; type=&quot;range&quot; min=&quot;-4&quot; max=&quot;4&quot; value=&quot;3&quot;&gt;&lt;/label&gt;&lt;label&gt;b=&lt;output id=&quot;shape-move-b-out&quot;&gt;-1&lt;/output&gt;&lt;input id=&quot;shape-move-b&quot; type=&quot;range&quot; min=&quot;-4&quot; max=&quot;4&quot; value=&quot;-1&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;svg id=&quot;shape-move-svg&quot; class=&quot;concept-diagram&quot; viewBox=&quot;0 0 760 420&quot; role=&quot;img&quot; aria-label=&quot;원 x제곱 더하기 y제곱은 4를 a, b만큼 평행이동하는 시뮬레이션&quot;&gt;&lt;/svg&gt;&lt;div class=&quot;problem-list&quot;&gt;&lt;div class=&quot;problem-line&quot;&gt;&lt;strong&gt;중심의 이동&lt;/strong&gt; &lt;span id=&quot;shape-move-center&quot;&gt;C(0,0) → C′(3,-1)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;problem-line&quot;&gt;&lt;strong&gt;식의 변화&lt;/strong&gt; &lt;span id=&quot;shape-move-equation&quot;&gt;(x-3)²+(y+1)²=4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`, steps:[step(&#x27;1단계: F 위의 점 P와 옮긴 점 P′을 둔다&#x27;, formula(&#x27;P(x,y) → P′(x′,y′)&#x27;)),step(&#x27;2단계: 좌표의 관계를 쓴다&#x27;, formula(&#x27;x′=x+a, y′=y+b&#x27;)),step(&#x27;3단계: 원래 좌표를 옮긴 좌표로 나타낸다&#x27;, formula(&#x27;x=x′-a, y=y′-b&#x27;)),step(&#x27;4단계: 원래 도형의 식에 대입한다&#x27;, formula(&#x27;f(x′-a,y′-b)=0&#x27;)),step(&#x27;마지막 단계: x′, y′을 다시 x, y로 쓴다&#x27;, `${formula(&#x27;f(x-a,y-b)=0&#x27;)}${answer(&#x27;&lt;span class=&quot;answer-emphasis answer-source&quot;&gt;&#x27;+mathML(&#x27;f(x,y)=0&#x27;)+&#x27;&lt;/span&gt;이 나타내는 도형을 &lt;span class=&quot;answer-emphasis answer-xmove&quot;&gt;x축 방향으로 a&lt;/span&gt;, &lt;span class=&quot;answer-emphasis answer-ymove&quot;&gt;y축 방향으로 b&lt;/span&gt;만큼 평행이동한 도형의 방정식은 &lt;span class=&quot;answer-emphasis answer-result&quot;&gt;&#x27;+mathML(&#x27;f(x-a,y-b)=0&#x27;)+&#x27;&lt;/span&gt;이다.&#x27;)}&lt;p&gt;점의 좌표에는 이동량을 더하지만, 도형의 식에는 이동량을 반대로 뺀다는 점을 구분한다.&lt;/p&gt;`)] }),
          card({ id:&#x27;m46-ex1&#x27;, page:46, label:&#x27;예제 1&#x27;, kind:&#x27;example&#x27;, title:&#x27;원의 방정식을 평행이동하기&#x27;, body:`&lt;p&gt;원 x²+y²=1을 x축의 방향으로 3만큼, y축의 방향으로 -1만큼 평행이동한 원의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 이동량을 확인한다&#x27;, formula(&#x27;a=3, b=-1&#x27;)),step(&#x27;2단계: x 대신 x-a를 대입한다&#x27;, formula(&#x27;x → x-3&#x27;)),step(&#x27;3단계: y 대신 y-b를 대입한다&#x27;, formula(&#x27;y → y-(-1)=y+1&#x27;)),step(&#x27;4단계: 원래 식에 대입한다&#x27;, formula(&#x27;(x-3)²+(y+1)²=1&#x27;)),step(&#x27;마지막 단계: 식과 그림을 함께 확인한다&#x27;, `${answer(&#x27;(x-3)²+(y+1)²=1&#x27;)}&lt;p&gt;중심 (0,0)이 (3,-1)로 이동하고 반지름 1은 변하지 않는다.&lt;/p&gt;${translationCircleExampleFigure()}`)] }),
          card({ id:&#x27;m46-p2&#x27;, page:46, label:&#x27;문제 2&#x27;, kind:&#x27;problem&#x27;, title:&#x27;도형을 x축 방향 -2, y축 방향 4만큼 평행이동하시오&#x27;, body:`&lt;p&gt;다음 방정식이 나타내는 도형을 x축의 방향으로 -2만큼, y축의 방향으로 4만큼 평행이동한 도형의 방정식을 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;x-4y-1=0&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;(x+1)²+(y-5)²=9&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: 식에 넣을 값을 정한다&#x27;, `${formula(&#x27;x → x-(-2)=x+2&#x27;)}${formula(&#x27;y → y-4&#x27;)}`),step(&#x27;⑴ 2단계: 직선의 식에 대입한다&#x27;, formula(&#x27;(x+2)-4(y-4)-1=0&#x27;)),step(&#x27;⑴ 3단계: 괄호를 풀고 동류항을 정리한다&#x27;, `${formula(&#x27;x+2-4y+16-1=0&#x27;)}${formula(&#x27;x-4y+17=0&#x27;)}`),step(&#x27;⑵ 1단계: 같은 값을 원의 식에 대입한다&#x27;, formula(&#x27;{(x+2)+1}²+{(y-4)-5}²=9&#x27;)),step(&#x27;⑵ 2단계: 각 괄호 안을 정리한다&#x27;, formula(&#x27;(x+3)²+(y-9)²=9&#x27;)),step(&#x27;마지막 단계: 두 답을 확인한다&#x27;, answer(&#x27;⑴ x-4y+17=0　⑵ (x+3)²+(y-9)²=9&#x27;))] }),
          card({ id:&#x27;m46-p3&#x27;, page:46, label:&#x27;문제 3&#x27;, kind:&#x27;problem&#x27;, title:&#x27;이동식 수영장의 평행이동량 구하기&#x27;, body:`&lt;p class=&quot;camping-problem-copy&quot;&gt;오른쪽 그림은 어느 캠핑장을 좌표평면 위에 나타낸 것이다. 이동식 수영장을 원 &lt;span class=&quot;inline-equation&quot;&gt;${mathML(&#x27;(x-6)²+(y-4)²=2&#x27;)}&lt;/span&gt;로 나타낼 때, 이 수영장을 x축의 방향으로 a만큼, y축의 방향으로 b만큼 평행이동하였더니 원 &lt;span class=&quot;inline-equation after&quot;&gt;${mathML(&#x27;x²+y²-2x-4y+3=0&#x27;)}&lt;/span&gt;으로 나타내어졌다. 이때 상수 a와 b의 값을 구하시오.&lt;/p&gt;`, visual:campingFigure(), steps:[step(&#x27;1단계: 이동하기 전 원의 중심과 반지름을 읽는다&#x27;, `${formula(&#x27;(x-6)²+(y-4)²=2&#x27;)}&lt;p&gt;(x-6)²에서 중심의 x좌표는 6, (y-4)²에서 중심의 y좌표는 4이다. 따라서 중심은 (6,4), 반지름은 √2이다.&lt;/p&gt;`),step(&#x27;2단계: 이동한 원을 표준형으로 고친다&#x27;, `${formula(&#x27;x²-2x+y²-4y+3=0&#x27;)}${formula(&#x27;(x²-2x+1)+(y²-4y+4)=2&#x27;)}${formula(&#x27;(x-1)²+(y-2)²=2&#x27;)}&lt;p&gt;이동한 뒤의 중심은 (1,2)이고 반지름은 여전히 √2이다.&lt;/p&gt;`),step(&#x27;3단계: 중심의 이동으로 a를 구한다&#x27;, `${formula(&#x27;6+a=1&#x27;)}${formula(&#x27;a=-5&#x27;)}&lt;p&gt;x좌표가 6에서 1로 바뀌었으므로 왼쪽으로 5만큼 이동했다.&lt;/p&gt;`),step(&#x27;4단계: 중심의 이동으로 b를 구한다&#x27;, `${formula(&#x27;4+b=2&#x27;)}${formula(&#x27;b=-2&#x27;)}&lt;p&gt;y좌표가 4에서 2로 바뀌었으므로 아래쪽으로 2만큼 이동했다.&lt;/p&gt;`),step(&#x27;마지막 단계: 중심과 반지름으로 검산한다&#x27;, `${formula(&#x27;(6,4) → (1,2)&#x27;)}${formula(&#x27;(x-1)²+(y-2)²=2&#x27;)}${answer(&#x27;a=-5, b=-2&#x27;)}`)] }),
          card({ id:&#x27;m46-think&#x27;, page:46, label:&#x27;생각 넓히기&#x27;, kind:&#x27;thinking&#x27;, title:&#x27;평행이동을 이용하여 원의 접선 구하기&#x27;, body:`&lt;div class=&quot;thought-opening&quot;&gt;&lt;strong&gt;원 C: (x+6)²+(y+1)²=5 위의 점 A(-5,1)에서의 접선 l의 방정식을 구하려고 한다.&lt;/strong&gt;&lt;ol class=&quot;thought-questions&quot;&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;1&lt;/span&gt;&lt;span&gt;원 C를 원 C′: x²+y²=5로 옮기는 평행이동에 의하여 점 A를 평행이동한 점 A′의 좌표를 구해 보자.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;2&lt;/span&gt;&lt;span&gt;원 C′ 위의 점 A′에서의 접선 m의 방정식을 구해 보자.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;3&lt;/span&gt;&lt;span&gt;접선 m을 평행이동하여 접선 l의 방정식을 구해 보자.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;`, visual:translationTangentFigure(), steps:[step(&#x27;활동 1 · 원 C를 원 C′으로 옮기는 이동량을 찾는다&#x27;, `${formula(&#x27;중심 (-6,-1) → (0,0)&#x27;)}&lt;p&gt;중심을 원점으로 옮기려면 x축 방향으로 6, y축 방향으로 1만큼 평행이동해야 한다.&lt;/p&gt;${formula(&#x27;C′: x²+y²=5&#x27;)}`),step(&#x27;활동 1 · 점 A도 똑같이 옮긴다&#x27;, `${formula(&#x27;A(-5,1) → A′(-5+6,1+1)&#x27;)}${formula(&#x27;A′(1,2)&#x27;)}&lt;p&gt;원과 원 위의 점은 같은 평행이동을 해야 서로의 위치 관계가 그대로 유지된다.&lt;/p&gt;`),step(&#x27;활동 2 · A′에서 원 C′에 그은 접선 m을 구한다&#x27;, `&lt;p&gt;원 x²+y²=r² 위의 점 (x₁,y₁)에서의 접선은 x₁x+y₁y=r²이다. 여기서는 (x₁,y₁)=(1,2), r²=5이다.&lt;/p&gt;${formula(&#x27;1·x+2·y=5&#x27;)}${formula(&#x27;m: x+2y=5&#x27;)}`),step(&#x27;활동 3 · m 위의 점과 l 위의 점의 좌표 관계를 정한다&#x27;, `&lt;p&gt;접선 m을 x축 방향으로 -6, y축 방향으로 -1만큼 평행이동하면 접선 l이 된다. m 위의 점을 (x,y), 옮긴 l 위의 점을 (x′,y′)이라 두자.&lt;/p&gt;&lt;div class=&quot;coordinate-transform-grid&quot;&gt;&lt;div class=&quot;coordinate-transform x&quot;&gt;&lt;span&gt;x좌표&lt;/span&gt;${mathML(&#x27;x′=x-6&#x27;)}&lt;/div&gt;&lt;div class=&quot;coordinate-transform y&quot;&gt;&lt;span&gt;y좌표&lt;/span&gt;${mathML(&#x27;y′=y-1&#x27;)}&lt;/div&gt;&lt;/div&gt;`),step(&#x27;활동 3 · 원래 좌표 x, y를 x′, y′으로 나타낸다&#x27;, `&lt;p&gt;m의 식에는 이동하기 전 좌표 x, y가 들어 있다. 따라서 위 두 식을 x와 y에 관하여 각각 풀어야 한다.&lt;/p&gt;&lt;div class=&quot;coordinate-transform-grid&quot;&gt;&lt;div class=&quot;coordinate-transform x&quot;&gt;&lt;span&gt;x좌표&lt;/span&gt;${mathML(&#x27;x=x′+6&#x27;)}&lt;/div&gt;&lt;div class=&quot;coordinate-transform y&quot;&gt;&lt;span&gt;y좌표&lt;/span&gt;${mathML(&#x27;y=y′+1&#x27;)}&lt;/div&gt;&lt;/div&gt;`),step(&#x27;활동 3 · 접선 m의 식에 대입한다&#x27;, `${formula(&#x27;m: x+2y=5&#x27;)}${formula(&#x27;(x′+6)+2(y′+1)=5&#x27;)}&lt;p&gt;x 대신 x′+6, y 대신 y′+1을 정확히 넣는다.&lt;/p&gt;`),step(&#x27;활동 3 · 괄호를 풀고 동류항을 정리한다&#x27;, `${formula(&#x27;x′+6+2y′+2=5&#x27;)}${formula(&#x27;x′+2y′+3=0&#x27;)}&lt;p&gt;여기까지 얻은 식은 l 위의 점 (x′,y′)이 만족하는 식이다.&lt;/p&gt;`),step(&#x27;마지막 단계 · x′, y′을 익숙한 x, y로 바꿔 쓴다&#x27;, `${formula(&#x27;x′+2y′+3=0 → x+2y+3=0&#x27;)}&lt;div class=&quot;friendly-check&quot;&gt;좌표의 글자만 x′, y′에서 x, y로 바꾸는 것이며, 직선의 위치나 방정식의 내용은 달라지지 않는다.&lt;/div&gt;${answer(&#x27;l: x+2y+3=0&#x27;)}`)] }),
        ].join(&#x27;&#x27;);
      }

      function movementSymmetryCards() {
        return [
          card({ id:&#x27;m48-open&#x27;, page:48, label:&#x27;생각 열기&#x27;, kind:&#x27;thinking&#x27;, title:&#x27;만자창 무늬에서 대칭인 점 찾기&#x27;, body:`&lt;div class=&quot;thought-opening&quot;&gt;&lt;strong&gt;오른쪽 그림은 ‘만자창’을 대칭축이 각각 x축과 y축이 되도록 좌표평면 위에 그린 것이다.&lt;/strong&gt;&lt;ol class=&quot;thought-questions&quot;&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;1&lt;/span&gt;&lt;span&gt;점 A와 x축에 대하여 대칭인 점을 B, y축에 대하여 대칭인 점을 C, 원점에 대하여 대칭인 점을 D라 할 때, 세 점 B, C, D를 오른쪽 그림에 나타내어 보자.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;2&lt;/span&gt;&lt;span&gt;점 A의 좌표가 (1,2)일 때, 세 점 B, C, D의 좌표를 말해 보자.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;`, visual:manjaFigure(), steps:[step(&#x27;준비 · 점 A(1,2)의 위치를 확인한다&#x27;, `&lt;p&gt;점 A는 원점 O에서 오른쪽으로 1, 위쪽으로 2만큼 떨어져 있다. 대칭이동에서는 기준이 되는 축 또는 점에서 떨어진 거리가 같아야 한다.&lt;/p&gt;${formula(&#x27;A(1,2)&#x27;)}`),step(&#x27;1단계 · x축에 대하여 대칭인 점 B를 찾는다&#x27;, `&lt;p&gt;x축 대칭에서는 좌우 위치는 바뀌지 않는다. 따라서 x좌표 1은 그대로 둔다.&lt;/p&gt;&lt;p&gt;x축에서 위로 2만큼 떨어진 A의 대칭점은 x축에서 아래로 2만큼 떨어져야 하므로 y좌표 2의 부호만 바꾼다.&lt;/p&gt;${formula(&#x27;A(1,2) → B(1,-2)&#x27;)}`),step(&#x27;2단계 · y축에 대하여 대칭인 점 C를 찾는다&#x27;, `&lt;p&gt;y축 대칭에서는 위아래 위치는 바뀌지 않는다. 따라서 y좌표 2는 그대로 둔다.&lt;/p&gt;&lt;p&gt;y축에서 오른쪽으로 1만큼 떨어진 A의 대칭점은 왼쪽으로 1만큼 떨어져야 하므로 x좌표 1의 부호만 바꾼다.&lt;/p&gt;${formula(&#x27;A(1,2) → C(-1,2)&#x27;)}`),step(&#x27;3단계 · 원점에 대하여 대칭인 점 D를 찾는다&#x27;, `&lt;p&gt;원점 대칭에서는 원점 O가 선분 AD의 정확한 중점이 된다. 그러려면 오른쪽 1은 왼쪽 1로, 위쪽 2는 아래쪽 2로 바뀌어야 한다.&lt;/p&gt;${formula(&#x27;A(1,2) → D(-1,-2)&#x27;)}`),step(&#x27;4단계 · 중점으로 D를 검산한다&#x27;, `${formula(&#x27;{1+(-1)}/2=0&#x27;)}${formula(&#x27;{2+(-2)}/2=0&#x27;)}&lt;p&gt;선분 AD의 중점이 O(0,0)이므로 D의 위치가 맞다.&lt;/p&gt;`),step(&#x27;마지막 단계 · 만자창 무늬 위에서 네 점을 확인한다&#x27;, `${manjaAnswerFigure()}${answer(&#x27;B(1,-2), C(-1,2), D(-1,-2)&#x27;)}`)] }),
          card({ id:&#x27;m48-point&#x27;, page:48, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;점의 대칭이동&#x27;, body:`&lt;p&gt;어떤 도형을 주어진 직선 또는 점에 대하여 대칭인 도형으로 옮기는 것을 대칭이동이라고 한다. 점 P(x,y)를 x축, y축, 원점에 대하여 대칭이동한 점의 좌표를 차례로 알아보자.&lt;/p&gt;`, visual:axisSymmetryPointFigure(), steps:[step(&#x27;1단계: x축에 대한 대칭이동&#x27;, &#x27;&lt;p&gt;x축을 사이에 두고 위아래로 같은 거리만큼 떨어져 있으므로 x좌표는 그대로이고 y좌표의 부호만 바뀐다.&lt;/p&gt;&#x27;+formula(&#x27;P(x,y) → P₁(x,-y)&#x27;)),step(&#x27;2단계: y축에 대한 대칭이동&#x27;, &#x27;&lt;p&gt;y축을 사이에 두고 좌우로 같은 거리만큼 떨어져 있으므로 y좌표는 그대로이고 x좌표의 부호만 바뀐다.&lt;/p&gt;&#x27;+formula(&#x27;P(x,y) → P₂(-x,y)&#x27;)),step(&#x27;3단계: 원점에 대한 대칭이동&#x27;, &#x27;&lt;p&gt;원점이 선분 PP₃의 중점이므로 x좌표와 y좌표의 부호가 모두 바뀐다.&lt;/p&gt;&#x27;+formula(&#x27;P(x,y) → P₃(-x,-y)&#x27;)),step(&#x27;마지막 단계: 세 규칙을 한눈에 정리한다&#x27;, `${symmetryRuleFigure()}${answer(&#x27;x축: (x,-y)　y축: (-x,y)　원점: (-x,-y)&#x27;)}`)] }),
          card({ id:&#x27;m49-diagonal&#x27;, page:49, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;직선 y=x에 대한 점의 대칭이동&#x27;, body:`&lt;p&gt;점 P(x,y)를 직선 y=x에 대하여 대칭이동한 점을 P′(x′,y′)이라 하자.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;핵심 관찰:&lt;/strong&gt; 대칭축 y=x는 선분 PP′의 수직이등분선이다. 따라서 ① 선분 PP′의 중점은 y=x 위에 있고, ② PP′은 y=x에 수직이다.&lt;/p&gt;&lt;p&gt;점 P가 처음부터 y=x 위에 있으면 x=y이고 대칭이동해도 같은 점이다. 아래 계산은 P가 y=x 위에 있지 않은 경우이며, 마지막 공식은 두 경우에 모두 성립한다.&lt;/p&gt;`, visual:diagonalSymmetryFigure(), steps:[step(&#x27;1단계 · 중점이 y=x 위에 있다는 조건을 식으로 나타낸다&#x27;, `&lt;p&gt;선분 PP′의 중점은 &lt;span class=&quot;inline-math-coordinate&quot;&gt;${mathML(&#x27;((x+x′)/2,(y+y′)/2)&#x27;)}&lt;/span&gt;이다. y=x 위의 점은 x좌표와 y좌표가 같으므로 다음 식이 성립한다.&lt;/p&gt;${formula(&#x27;{x+x′}/2={y+y′}/2&#x27;)}${formula(&#x27;x′-y′=-x+y　… ①&#x27;)}`),step(&#x27;2단계 · PP′이 y=x에 수직이라는 조건을 식으로 나타낸다&#x27;, `&lt;p&gt;직선 y=x의 기울기는 1이다. 서로 수직인 두 직선의 기울기의 곱은 -1이므로 PP′의 기울기는 -1이다.&lt;/p&gt;${formula(&#x27;{y′-y}/{x′-x}=-1&#x27;)}${formula(&#x27;y′-y=-x′+x&#x27;)}${formula(&#x27;x′+y′=x+y　… ②&#x27;)}`),step(&#x27;3단계 · ①과 ②를 더하여 x′을 구한다&#x27;, `&lt;p&gt;왼쪽끼리, 오른쪽끼리 더하면 y′항과 x항이 각각 없어져 x′만 남는다.&lt;/p&gt;${formula(&#x27;(x′-y′)+(x′+y′)=(-x+y)+(x+y)&#x27;)}${formula(&#x27;2x′=2y&#x27;)}${formula(&#x27;x′=y&#x27;)}`),step(&#x27;4단계 · ②에서 ①을 빼서 y′을 구한다&#x27;, `&lt;p&gt;②의 양변에서 ①의 양변을 빼면 x′항과 y항이 각각 없어져 y′만 남는다.&lt;/p&gt;${formula(&#x27;(x′+y′)-(x′-y′)=(x+y)-(-x+y)&#x27;)}${formula(&#x27;2y′=2x&#x27;)}${formula(&#x27;y′=x&#x27;)}`),step(&#x27;5단계 · 좌표가 서로 바뀌는 까닭을 그림과 연결한다&#x27;, `&lt;p&gt;P의 x좌표가 나타내는 가로 방향의 위치는 대칭이동한 뒤 P′의 y좌표가 되고, P의 y좌표가 나타내는 세로 방향의 위치는 P′의 x좌표가 된다. 그래서 두 좌표의 자리가 서로 바뀐다.&lt;/p&gt;${formula(&#x27;P(x,y) → P′(y,x)&#x27;)}`),step(&#x27;6단계 · y=x 위의 점도 확인한다&#x27;, `&lt;p&gt;예를 들어 P(3,3)은 두 좌표를 바꾸어도 (3,3)이다. 즉, 대칭축 위의 점이 움직이지 않는 사실과 공식이 서로 모순되지 않는다.&lt;/p&gt;${formula(&#x27;(3,3) → (3,3)&#x27;)}`),step(&#x27;마지막 단계 · 규칙을 한 문장으로 정리한다&#x27;, `${answer(&#x27;직선 y=x에 대한 대칭이동에서는 x좌표와 y좌표를 서로 바꾼다: P(x,y) → P′(y,x).&#x27;)}`)] }),
          card({ id:&#x27;m49-view&#x27;, page:49, label:&#x27;보기&#x27;, kind:&#x27;example&#x27;, title:&#x27;점 (4,1)을 네 가지 기준으로 대칭이동하기&#x27;, body:`&lt;p&gt;점 (4,1)을 x축, y축, 원점, 직선 y=x에 대하여 각각 대칭이동한 점의 좌표를 구해 보자.&lt;/p&gt;`, steps:[step(&#x27;1단계: x축에 대하여 대칭이동한다&#x27;, `${formula(&#x27;(4,1) → (4,-1)&#x27;)}&lt;p&gt;y좌표의 부호만 바꾼다.&lt;/p&gt;`),step(&#x27;2단계: y축에 대하여 대칭이동한다&#x27;, `${formula(&#x27;(4,1) → (-4,1)&#x27;)}&lt;p&gt;x좌표의 부호만 바꾼다.&lt;/p&gt;`),step(&#x27;3단계: 원점에 대하여 대칭이동한다&#x27;, `${formula(&#x27;(4,1) → (-4,-1)&#x27;)}&lt;p&gt;두 좌표의 부호를 모두 바꾼다.&lt;/p&gt;`),step(&#x27;마지막 단계: 직선 y=x에 대하여 대칭이동한다&#x27;, `${formula(&#x27;(4,1) → (1,4)&#x27;)}${answer(&#x27;x축: (4,-1), y축: (-4,1), 원점: (-4,-1), 직선 y=x: (1,4)&#x27;)}`)] }),
          card({ id:&#x27;m49-p1&#x27;, page:49, label:&#x27;문제 1&#x27;, kind:&#x27;problem&#x27;, title:&#x27;점 (3,-5)를 대칭이동한 점의 좌표를 구하시오&#x27;, body:`&lt;p&gt;점 (3,-5)를 다음에 대하여 대칭이동한 점의 좌표를 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;x축&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;y축&#x27;)}${problem(&#x27;⑶&#x27;,&#x27;원점&#x27;)}${problem(&#x27;⑷&#x27;,&#x27;직선 y=x&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ x축 대칭: y좌표의 부호를 바꾼다&#x27;, formula(&#x27;(3,-5) → (3,5)&#x27;)),step(&#x27;⑵ y축 대칭: x좌표의 부호를 바꾼다&#x27;, formula(&#x27;(3,-5) → (-3,-5)&#x27;)),step(&#x27;⑶ 원점 대칭: 두 좌표의 부호를 바꾼다&#x27;, formula(&#x27;(3,-5) → (-3,5)&#x27;)),step(&#x27;⑷ 직선 y=x 대칭: 두 좌표를 서로 바꾼다&#x27;, formula(&#x27;(3,-5) → (-5,3)&#x27;)),step(&#x27;마지막 단계: 네 점을 확인한다&#x27;, answer(&#x27;⑴ (3,5)　⑵ (-3,-5)　⑶ (-3,5)　⑷ (-5,3)&#x27;))] }),
          card({ id:&#x27;m49-together&#x27;, page:50, label:&#x27;함께하기&#x27;, kind:&#x27;concept&#x27;, title:&#x27;도형을 x축에 대하여 대칭이동한 식 유도하기&#x27;, body:`&lt;div class=&quot;thought-opening&quot;&gt;&lt;strong&gt;오른쪽 그림과 같이 방정식 f(x,y)=0이 나타내는 도형 F 위의 점 P(x,y)를 x축에 대하여 대칭이동한 점을 P′(x′,y′)이라 하자.&lt;/strong&gt;&lt;ol class=&quot;thought-questions&quot;&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;1&lt;/span&gt;&lt;span&gt;점 P′의 좌표를 x와 y를 이용하여 나타내 보자.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;thought-number&quot;&gt;2&lt;/span&gt;&lt;span&gt;다음은 도형 F′의 방정식을 구하는 과정이다. □ 안에 알맞은 것을 써넣어 보자.&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;div class=&quot;together-fillbox&quot;&gt;&lt;p&gt;①의 결과로부터　x=&lt;span class=&quot;blank-chip&quot;&gt;□&lt;/span&gt;, y=&lt;span class=&quot;blank-chip&quot;&gt;□&lt;/span&gt;&lt;/p&gt;&lt;p&gt;이것을 f(x,y)=0에 대입하면　f(x′,&lt;span class=&quot;blank-chip&quot;&gt;□&lt;/span&gt;)=0&lt;/p&gt;&lt;p&gt;즉, 점 P′(x′,y′)은 방정식 f(x,-y)=0이 나타내는 도형 위의 점이 된다.&lt;/p&gt;&lt;p&gt;따라서 구하는 도형 F′의 방정식은　f(x,-y)=0&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`, visual:xAxisShapeSymmetryFigure(), steps:[step(&#x27;1단계 · x축 대칭인 점 P′의 좌표를 구한다&#x27;, `&lt;p&gt;x축 대칭에서는 x좌표는 그대로이고 y좌표의 부호만 바뀐다.&lt;/p&gt;${formula(&#x27;P(x,y) → P′(x,-y)&#x27;)}${formula(&#x27;x′=x, y′=-y&#x27;)}`),step(&#x27;2단계 · x와 y를 x′, y′으로 나타낸다&#x27;, `&lt;p&gt;원래 도형의 식 f(x,y)=0에 대입하려면 이동하기 전 좌표 x와 y가 필요하다. x′=x에서 x=x′이고, y′=-y의 양변에 -1을 곱하면 y=-y′이다.&lt;/p&gt;${formula(&#x27;x=x′, y=-y′&#x27;)}`),step(&#x27;3단계 · 첫 번째와 두 번째 빈칸을 채운다&#x27;, `${formula(&#x27;x=x′&#x27;)}${formula(&#x27;y=-y′&#x27;)}&lt;p&gt;따라서 첫 번째 빈칸은 x′, 두 번째 빈칸은 -y′이다.&lt;/p&gt;`),step(&#x27;4단계 · f(x,y)=0에 대입하여 세 번째 빈칸을 채운다&#x27;, `&lt;p&gt;f(x,y)=0에서 x 대신 x′, y 대신 -y′을 넣는다.&lt;/p&gt;${formula(&#x27;f(x′,-y′)=0&#x27;)}&lt;p&gt;세 번째 빈칸은 -y′이다.&lt;/p&gt;`),step(&#x27;5단계 · 이 식이 나타내는 점을 해석한다&#x27;, `&lt;p&gt;f(x′,-y′)=0은 x축 대칭이동한 점 P′(x′,y′)이 만족하는 식이다. 따라서 이 식이 바로 도형 F′을 나타낸다.&lt;/p&gt;`),step(&#x27;마지막 단계 · 좌표 문자를 x, y로 바꾸어 방정식을 쓴다&#x27;, `${formula(&#x27;f(x′,-y′)=0 → f(x,-y)=0&#x27;)}&lt;p&gt;x′, y′은 좌표를 나타내는 문자이므로 마지막에는 보통 사용하는 x, y로 바꾸어 쓴다.&lt;/p&gt;${answer(&#x27;도형 F′의 방정식은 f(x,-y)=0이다.&#x27;)}`)] }),
          card({ id:&#x27;m50-shape&#x27;, page:50, label:&#x27;개념&#x27;, kind:&#x27;concept&#x27;, title:&#x27;도형의 대칭이동 공식&#x27;, body:`&lt;p&gt;방정식 f(x,y)=0이 나타내는 도형을 대칭이동할 때에는 점의 좌표가 어떻게 바뀌는지 먼저 확인하고, 그 관계를 식에 대입한다.&lt;/p&gt;`, steps:[step(&#x27;1단계: x축에 대한 대칭&#x27;, `${formula(&#x27;f(x,-y)=0&#x27;)}&lt;p&gt;y의 부호만 바꾼다.&lt;/p&gt;`),step(&#x27;2단계: y축에 대한 대칭&#x27;, `${formula(&#x27;f(-x,y)=0&#x27;)}&lt;p&gt;x의 부호만 바꾼다.&lt;/p&gt;`),step(&#x27;3단계: 원점에 대한 대칭&#x27;, `${formula(&#x27;f(-x,-y)=0&#x27;)}&lt;p&gt;x와 y의 부호를 모두 바꾼다.&lt;/p&gt;`),step(&#x27;4단계: 직선 y=x에 대한 대칭&#x27;, `${formula(&#x27;f(y,x)=0&#x27;)}&lt;p&gt;x와 y의 자리를 서로 바꾼다.&lt;/p&gt;`),step(&#x27;마지막 단계: 세 가지 도형 대칭을 그림으로 확인한다&#x27;, `${shapeSymmetryDiagrams()}${answer(&#x27;점의 좌표 변화와 도형의 식에 대입하는 변화가 서로 연결된다.&#x27;)}`)] }),
          card({ id:&#x27;m50-ex1&#x27;, page:51, label:&#x27;예제 1&#x27;, kind:&#x27;example&#x27;, title:&#x27;원을 x축, y축, 원점에 대하여 대칭이동하기&#x27;, body:`&lt;p&gt;원 (x-4)²+(y+3)²=4를 다음에 대하여 대칭이동한 원의 방정식을 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;x축&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;y축&#x27;)}${problem(&#x27;⑶&#x27;,&#x27;원점&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;1단계: 원래 식과 중심을 확인한다&#x27;, `${formula(&#x27;(x-4)²+(y+3)²=4&#x27;)}&lt;p&gt;중심은 (4,-3), 반지름은 2이다. 각 대칭이동에서 바뀌는 좌표를 식에 직접 대입한다.&lt;/p&gt;`),step(&#x27;⑴ 1단계: x축 대칭이므로 y 대신 -y를 대입한다&#x27;, formula(&#x27;(x-4)²+(-y+3)²=4&#x27;)),step(&#x27;⑴ 2단계: 제곱 안의 부호를 정리한다&#x27;, formula(&#x27;(x-4)²+(y-3)²=4&#x27;)),step(&#x27;⑵ 1단계: y축 대칭이므로 x 대신 -x를 대입한다&#x27;, formula(&#x27;(-x-4)²+(y+3)²=4&#x27;)),step(&#x27;⑵ 2단계: 제곱 안의 부호를 정리한다&#x27;, formula(&#x27;(x+4)²+(y+3)²=4&#x27;)),step(&#x27;⑶ 1단계: 원점 대칭이므로 x, y 대신 -x, -y를 대입한다&#x27;, formula(&#x27;(-x-4)²+(-y+3)²=4&#x27;)),step(&#x27;⑶ 2단계: 두 제곱 안을 정리한다&#x27;, formula(&#x27;(x+4)²+(y-3)²=4&#x27;)),step(&#x27;마지막 단계: 중심의 이동과 세 답을 그림으로 확인한다&#x27;, `${fourCircleSymmetryFigure()}${answer(&#x27;⑴ (x-4)²+(y-3)²=4&lt;br&gt;⑵ (x+4)²+(y+3)²=4&lt;br&gt;⑶ (x+4)²+(y-3)²=4&#x27;)}`)] }),
          card({ id:&#x27;m50-p2&#x27;, page:51, label:&#x27;문제 2&#x27;, kind:&#x27;problem&#x27;, title:&#x27;도형을 x축, y축, 원점에 대하여 대칭이동하시오&#x27;, body:`&lt;p&gt;다음 방정식이 나타내는 도형을 x축, y축, 원점에 대하여 대칭이동한 도형의 방정식을 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;2x-3y-1=0&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;x²+y²-4x+10y-7=0&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;준비 · 세 가지 대입 규칙을 확인한다&#x27;, `${formula(&#x27;x축: y 대신 -y&#x27;)}${formula(&#x27;y축: x 대신 -x&#x27;)}${formula(&#x27;원점: x 대신 -x, y 대신 -y&#x27;)}&lt;p&gt;대입한 뒤에는 괄호를 풀고, 필요하면 식 전체에 -1을 곱하여 보기 좋은 형태로 정리한다.&lt;/p&gt;`),step(&#x27;⑴ x축 대칭 · y 대신 -y를 넣는다&#x27;, `${formula(&#x27;2x-3(-y)-1=0&#x27;)}${formula(&#x27;2x+3y-1=0&#x27;)}&lt;p&gt;-3과 -y를 곱하면 +3y가 된다.&lt;/p&gt;`),step(&#x27;⑴ y축 대칭 · x 대신 -x를 넣는다&#x27;, `${formula(&#x27;2(-x)-3y-1=0&#x27;)}${formula(&#x27;-2x-3y-1=0&#x27;)}${formula(&#x27;2x+3y+1=0&#x27;)}&lt;p&gt;마지막 식은 바로 앞 식의 양변에 -1을 곱한 것이다.&lt;/p&gt;`),step(&#x27;⑴ 원점 대칭 · x와 y 대신 -x와 -y를 넣는다&#x27;, `${formula(&#x27;2(-x)-3(-y)-1=0&#x27;)}${formula(&#x27;-2x+3y-1=0&#x27;)}${formula(&#x27;2x-3y+1=0&#x27;)}&lt;p&gt;모든 항의 부호를 한꺼번에 바꾸어 마지막 식으로 정리한다.&lt;/p&gt;`),step(&#x27;⑵ x축 대칭 · y 대신 -y를 넣는다&#x27;, `${formula(&#x27;x²+(-y)²-4x+10(-y)-7=0&#x27;)}${formula(&#x27;x²+y²-4x-10y-7=0&#x27;)}&lt;p&gt;(-y)²=y²이므로 y²항은 그대로이고, 10y의 부호만 바뀐다.&lt;/p&gt;`),step(&#x27;⑵ y축 대칭 · x 대신 -x를 넣는다&#x27;, `${formula(&#x27;(-x)²+y²-4(-x)+10y-7=0&#x27;)}${formula(&#x27;x²+y²+4x+10y-7=0&#x27;)}&lt;p&gt;(-x)²=x²이고, -4(-x)=+4x이다.&lt;/p&gt;`),step(&#x27;⑵ 원점 대칭 · x와 y 대신 -x와 -y를 넣는다&#x27;, `${formula(&#x27;(-x)²+(-y)²-4(-x)+10(-y)-7=0&#x27;)}${formula(&#x27;x²+y²+4x-10y-7=0&#x27;)}&lt;p&gt;제곱항은 그대로이고 일차항의 부호가 모두 바뀐다.&lt;/p&gt;`),step(&#x27;마지막 단계 · 여섯 개의 방정식을 확인한다&#x27;, answer(&#x27;⑴ x축: 2x+3y-1=0&lt;br&gt;⑴ y축: 2x+3y+1=0&lt;br&gt;⑴ 원점: 2x-3y+1=0&lt;br&gt;⑵ x축: x²+y²-4x-10y-7=0&lt;br&gt;⑵ y축: x²+y²+4x+10y-7=0&lt;br&gt;⑵ 원점: x²+y²+4x-10y-7=0&#x27;))] }),
          card({ id:&#x27;m50-p3&#x27;, page:51, label:&#x27;문제 3&#x27;, kind:&#x27;problem&#x27;, title:&#x27;평행이동한 뒤 x축에 대하여 대칭이동하기&#x27;, body:`&lt;p&gt;원 (x-3)²+(y+2)²=5를 x축의 방향으로 2만큼, y축의 방향으로 1만큼 평행이동한 다음 x축에 대하여 대칭이동한 원의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계 · 원래 원의 중심과 반지름을 읽는다&#x27;, `${formula(&#x27;(x-3)²+(y+2)²=5&#x27;)}&lt;p&gt;(y+2)²는 (y-(-2))²이므로 중심은 C(3,-2)이다. 오른쪽의 5는 반지름의 제곱이므로 반지름은 √5이다.&lt;/p&gt;${formula(&#x27;C(3,-2), r=√5&#x27;)}`),step(&#x27;2단계 · 중심을 x축 방향으로 2만큼 옮긴다&#x27;, `${formula(&#x27;3+2=5&#x27;)}&lt;p&gt;x축의 양의 방향은 오른쪽이므로 중심의 x좌표에 2를 더한다.&lt;/p&gt;`),step(&#x27;3단계 · 중심을 y축 방향으로 1만큼 옮긴다&#x27;, `${formula(&#x27;-2+1=-1&#x27;)}&lt;p&gt;y축의 양의 방향은 위쪽이므로 중심의 y좌표에 1을 더한다.&lt;/p&gt;`),step(&#x27;4단계 · 평행이동한 원의 중심과 식을 쓴다&#x27;, `${formula(&#x27;C₁(5,-1)&#x27;)}${formula(&#x27;(x-5)²+(y+1)²=5&#x27;)}&lt;p&gt;평행이동에서는 원의 크기가 바뀌지 않으므로 반지름은 계속 √5이다.&lt;/p&gt;`),step(&#x27;5단계 · 중심 C₁을 x축에 대하여 대칭이동한다&#x27;, `&lt;p&gt;x축 대칭에서는 x좌표는 그대로 두고 y좌표의 부호만 바꾼다.&lt;/p&gt;${formula(&#x27;(5,-1) → (5,1)&#x27;)}${formula(&#x27;C₂(5,1)&#x27;)}`),step(&#x27;6단계 · 최종 중심과 반지름으로 원의 방정식을 쓴다&#x27;, `${formula(&#x27;(x-5)²+(y-1)²=(√5)²&#x27;)}${formula(&#x27;(x-5)²+(y-1)²=5&#x27;)}`),step(&#x27;마지막 단계 · 이동 순서를 다시 확인한다&#x27;, `&lt;p&gt;C(3,-2)에서 먼저 (2,1)만큼 옮겨 C₁(5,-1)을 얻고, 그다음 x축 대칭으로 C₂(5,1)을 얻었다.&lt;/p&gt;${answer(&#x27;(x-5)²+(y-1)²=5&#x27;)}`)] }),
          card({ id:&#x27;m51-ex2&#x27;, page:52, label:&#x27;예제 2&#x27;, kind:&#x27;example&#x27;, title:&#x27;직선 y=x에 대하여 원을 대칭이동하기&#x27;, body:`&lt;p&gt;원 x²+(y-3)²=9를 직선 y=x에 대하여 대칭이동한 원의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 직선 y=x 대칭의 대입 규칙을 확인한다&#x27;, `${formula(&#x27;x 대신 y, y 대신 x&#x27;)}&lt;p&gt;점의 두 좌표가 서로 바뀌므로 도형의 식에서도 x와 y의 자리를 바꾼다.&lt;/p&gt;`),step(&#x27;2단계: 원래 식에 x 대신 y, y 대신 x를 대입한다&#x27;, formula(&#x27;y²+(x-3)²=9&#x27;)),step(&#x27;3단계: x가 들어 있는 항을 먼저 쓰도록 순서를 정리한다&#x27;, formula(&#x27;(x-3)²+y²=9&#x27;)),step(&#x27;4단계: 중심으로 결과를 다시 확인한다&#x27;, `${formula(&#x27;(0,3) → (3,0)&#x27;)}&lt;p&gt;반지름 3은 변하지 않으므로 얻은 식이 맞다.&lt;/p&gt;`),step(&#x27;마지막 단계: 두 원의 위치를 그림으로 확인한다&#x27;, `${diagonalCircleSymmetryFigure()}${answer(&#x27;(x-3)²+y²=9&#x27;)}`)] }),
          card({ id:&#x27;m51-p4&#x27;, page:52, label:&#x27;문제 4&#x27;, kind:&#x27;problem&#x27;, title:&#x27;직선 y=x에 대하여 대칭이동한 도형의 방정식&#x27;, body:`&lt;p&gt;다음 방정식이 나타내는 도형을 직선 y=x에 대하여 대칭이동한 도형의 방정식을 구하시오.&lt;/p&gt;&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;2x+y+3=0&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;x²+y²-6x+9y=0&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;준비 · 직선 y=x 대칭의 규칙을 확인한다&#x27;, `&lt;p&gt;점 (x,y)는 직선 y=x에 대하여 대칭이동하면 (y,x)가 된다. 따라서 도형의 방정식에서는 x와 y의 자리를 서로 바꾼다.&lt;/p&gt;${formula(&#x27;f(x,y)=0 → f(y,x)=0&#x27;)}`),step(&#x27;⑴ 1단계 · 2x+y+3=0에서 x와 y를 서로 바꾼다&#x27;, `&lt;p&gt;2x의 x는 y로, y는 x로 바뀐다. 상수항 3은 그대로이다.&lt;/p&gt;${formula(&#x27;2y+x+3=0&#x27;)}`),step(&#x27;⑴ 2단계 · x항을 먼저 쓰도록 순서를 정리한다&#x27;, `${formula(&#x27;x+2y+3=0&#x27;)}&lt;p&gt;항의 순서만 바꾸었으므로 같은 직선의 방정식이다.&lt;/p&gt;`),step(&#x27;⑵ 1단계 · 각 항의 x와 y를 서로 바꾼다&#x27;, `${formula(&#x27;x²+y²-6x+9y=0&#x27;)}${formula(&#x27;y²+x²-6y+9x=0&#x27;)}&lt;p&gt;x²은 y²으로, y²은 x²으로, -6x는 -6y로, 9y는 9x로 바뀐다.&lt;/p&gt;`),step(&#x27;⑵ 2단계 · x에 관한 항을 먼저 쓰도록 정리한다&#x27;, `${formula(&#x27;x²+y²+9x-6y=0&#x27;)}&lt;p&gt;y²+x²을 x²+y²으로, 9x를 y의 일차항보다 앞에 놓았다.&lt;/p&gt;`),step(&#x27;마지막 단계 · 두 방정식을 확인한다&#x27;, `${answer(&#x27;⑴ x+2y+3=0　⑵ x²+y²+9x-6y=0&#x27;)}`)] }),
          card({ id:&#x27;m52-p5&#x27;, page:52, label:&#x27;문제 5&#x27;, kind:&#x27;problem&#x27;, title:&#x27;당구공이 두 변에 부딪히는 점의 좌표 구하기&#x27;, body:`&lt;div class=&quot;textbook-problem-grid&quot;&gt;&lt;div class=&quot;textbook-problem-item&quot;&gt;&lt;i class=&quot;fa-solid fa-ruler-combined&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;당구대와 좌표축&lt;/strong&gt;&lt;p&gt;오른쪽 그림은 가로의 길이가 80, 세로의 길이가 40인 직사각형 모양의 당구대를 두 변이 좌표축에 놓이도록 그린 것이다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;textbook-problem-item&quot;&gt;&lt;i class=&quot;fa-solid fa-route&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;공의 이동과 구할 것&lt;/strong&gt;&lt;p&gt;점 P(10,30)의 위치에 놓인 노란 공을 쳐서 y축과 x축에 차례대로 부딪히게 하여 점 Q(70,10)의 위치에 놓인 빨간 공을 맞히려고 할 때, 두 점 A와 B의 좌표를 구하시오.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;textbook-problem-item&quot;&gt;&lt;i class=&quot;fa-solid fa-circle-info&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;조건&lt;/strong&gt;&lt;p&gt;(단, 공이 당구대의 변에 부딪힐 때의 입사각과 반사각의 크기는 같고, 공의 크기는 생각하지 않는다.)&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`, visual:billiardsFigure(false), steps:[step(&#x27;준비 · 꺾인 경로를 곧은 경로로 펼치는 방법을 생각한다&#x27;, `&lt;p&gt;입사각과 반사각의 크기가 같으므로, 축에 부딪힌 뒤의 경로를 축에 대하여 대칭이동하면 꺾인 두 선분이 한 직선으로 이어진다. 이 성질을 두 번 사용한다.&lt;/p&gt;`),step(&#x27;1단계 · 출발점 P를 y축에 대하여 대칭이동한다&#x27;, `${formula(&#x27;P(10,30) → P′(-10,30)&#x27;)}&lt;p&gt;y축 대칭에서는 x좌표의 부호만 바뀐다. 이렇게 하면 P에서 A로 들어오는 구간과 A에서 B로 나가는 구간을 y축에서 펼쳐 볼 수 있다.&lt;/p&gt;`),step(&#x27;2단계 · 도착점 Q를 x축에 대하여 대칭이동한다&#x27;, `${formula(&#x27;Q(70,10) → Q′(70,-10)&#x27;)}&lt;p&gt;x축 대칭에서는 y좌표의 부호만 바뀐다. 이제 P′, A, B, Q′은 하나의 직선 위에 놓인다.&lt;/p&gt;`),step(&#x27;3단계 · P′과 Q′을 지나는 직선의 기울기를 구한다&#x27;, `&lt;p&gt;P′(-10,30)에서 Q′(70,-10)으로 갈 때 x의 증가량은 80, y의 증가량은 -40이다.&lt;/p&gt;${formula(&#x27;x의 증가량=70-(-10)=80&#x27;)}${formula(&#x27;y의 증가량=-10-30=-40&#x27;)}${formula(&#x27;m={-40}/80=-1/2&#x27;)}`),step(&#x27;4단계 · 점 P′을 이용하여 펼친 직선의 방정식을 구한다&#x27;, `${formula(&#x27;y-30=-(1/2){x-(-10)}&#x27;)}${formula(&#x27;y-30=-(1/2)(x+10)&#x27;)}${formula(&#x27;y=-(1/2)x+25&#x27;)}&lt;p&gt;이 직선과 y축이 만나는 점이 A이고, x축과 만나는 점이 B이다.&lt;/p&gt;`),step(&#x27;5단계 · y축과의 교점 A를 구한다&#x27;, `&lt;p&gt;y축 위의 점은 x좌표가 0이다. 직선의 식에 x=0을 넣는다.&lt;/p&gt;${formula(&#x27;y=-(1/2)×0+25=25&#x27;)}${formula(&#x27;A(0,25)&#x27;)}`),step(&#x27;6단계 · x축과의 교점 B를 구한다&#x27;, `&lt;p&gt;x축 위의 점은 y좌표가 0이다. 직선의 식에 y=0을 넣는다.&lt;/p&gt;${formula(&#x27;0=-(1/2)x+25&#x27;)}${formula(&#x27;(1/2)x=25&#x27;)}${formula(&#x27;x=50&#x27;)}${formula(&#x27;B(50,0)&#x27;)}`),step(&#x27;7단계 · 좌표가 당구대의 변 위에 있는지 확인한다&#x27;, `&lt;p&gt;A(0,25)는 0≤25≤40이므로 왼쪽 변 위에 있고, B(50,0)는 0≤50≤80이므로 아래쪽 변 위에 있다.&lt;/p&gt;`),step(&#x27;마지막 단계 · 실제 경로 P-A-B-Q를 그림으로 확인한다&#x27;, `${answer(&#x27;A(0,25), B(50,0)&#x27;)}${billiardsFigure(true)}`)] }),
          card({ id:&#x27;m52-think&#x27;, page:52, label:&#x27;생각 넓히기&#x27;, kind:&#x27;thinking&#x27;, title:&#x27;대칭이동을 이용한 나만의 앰비그램 만들기&#x27;, body:`&lt;div class=&quot;thought-opening&quot;&gt;&lt;strong&gt;읽는 방향이나 보는 관점에 따라 모양이 변하거나 다르게 읽히는 글자 디자인을 ‘앰비그램(ambigram)’이라고 한다.&lt;/strong&gt;&lt;p&gt;다음은 대칭이동을 이용하여 디자인한 ‘love song’과 ‘perfect’의 앰비그램이다. 이처럼 대칭이동을 이용하여 나만의 앰비그램을 만들어 보자.&lt;/p&gt;&lt;/div&gt;`, steps:[step(&#x27;1단계: 표현할 낱말과 대칭의 기준을 정한다&#x27;, &#x27;&lt;p&gt;좌우 대칭이면 y축, 위아래 대칭이면 x축, 반 바퀴 돌려 읽게 하려면 원점을 기준으로 정한다.&lt;/p&gt;&#x27;),step(&#x27;2단계: 기준의 한쪽에 글자의 핵심 획을 그린다&#x27;, &#x27;&lt;p&gt;글자가 읽히는 데 꼭 필요한 굵은 획부터 단순하게 배치한다.&lt;/p&gt;&#x27;),step(&#x27;3단계: 대칭이동으로 대응하는 획을 만든다&#x27;, &#x27;&lt;p&gt;기준에서 같은 거리에 대응점이 놓이도록 옮기고, 서로 겹치는 부분은 하나의 획으로 다듬는다.&lt;/p&gt;&#x27;),step(&#x27;마지막 단계: 두 방향에서 읽히는지 확인한다&#x27;, answer(&#x27;교과서의 ‘love song’과 ‘perfect’처럼 대칭의 기준이 분명히 드러나도록 나만의 앰비그램을 완성한다.&#x27;))] })
        ].join(&#x27;&#x27;);
      }

      function wrapupParabolaFigure() {
        const X=x=&gt;230+38*x, Y=y=&gt;150-38*y;
        const p1=Array.from({length:101},(_,i)=&gt;{const x=-.5+i*.05;return `${X(x)},${Y(x*x-4*x)}`}).join(&#x27; &#x27;);
        const p2=Array.from({length:121},(_,i)=&gt;{const x=3+i*.05;return `${X(x)},${Y(x*x-12*x+27)}`}).join(&#x27; &#x27;);
        const foot={x:6/5,y:8/5};
        const hx=X(foot.x), hy=Y(foot.y), markerSize=13, root5=Math.sqrt(5);

        const rc={x:hx-2*markerSize/root5,y:hy+markerSize/root5};
        const rb={x:ra.x+rc.x-hx,y:ra.y+rc.y-hy};
        return `&lt;svg class=&quot;concept-diagram&quot; viewBox=&quot;0 0 760 520&quot; role=&quot;img&quot; aria-label=&quot;평행한 두 직선 l과 l 프라임, l 위의 점 P(0,1), P에서 l 프라임에 내린 수선 PH와 수선의 발 H(6/5,8/5), 그리고 평행이동한 두 포물선&quot;&gt;
          &lt;defs&gt;

          &lt;/defs&gt;
          ${Array.from({length:12},(_,i)=&gt;`&lt;line x1=&quot;${X(i-1)}&quot; y1=&quot;28&quot; x2=&quot;${X(i-1)}&quot; y2=&quot;500&quot; class=&quot;grid-line&quot;&gt;&lt;/line&gt;`).join(&#x27;&#x27;)}
          ${[-12,-9,-6,-3,3].map(v=&gt;`&lt;line x1=&quot;68&quot; y1=&quot;${Y(v)}&quot; x2=&quot;705&quot; y2=&quot;${Y(v)}&quot; class=&quot;grid-line&quot;&gt;&lt;/line&gt;`).join(&#x27;&#x27;)}
          &lt;line x1=&quot;68&quot; y1=&quot;${Y(0)}&quot; x2=&quot;710&quot; y2=&quot;${Y(0)}&quot; class=&quot;number-axis&quot; marker-end=&quot;url(#wrapup-parabola-axis-arrow)&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(0)}&quot; y1=&quot;500&quot; x2=&quot;${X(0)}&quot; y2=&quot;28&quot; class=&quot;number-axis&quot; marker-end=&quot;url(#wrapup-parabola-axis-arrow)&quot;&gt;&lt;/line&gt;
          &lt;polyline points=&quot;${p1}&quot; fill=&quot;none&quot; stroke=&quot;#20a996&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;/polyline&gt;
          &lt;polyline points=&quot;${p2}&quot; fill=&quot;none&quot; stroke=&quot;#4f7fd0&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;/polyline&gt;
          &lt;line x1=&quot;${X(-.5)}&quot; y1=&quot;${Y(2)}&quot; x2=&quot;${X(5.2)}&quot; y2=&quot;${Y(-9.4)}&quot; stroke=&quot;#20a996&quot; stroke-width=&quot;3.5&quot; stroke-dasharray=&quot;11 8&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(.5)}&quot; y1=&quot;${Y(3)}&quot; x2=&quot;${X(6.7)}&quot; y2=&quot;${Y(-9.4)}&quot; stroke=&quot;#4f7fd0&quot; stroke-width=&quot;3.5&quot; stroke-dasharray=&quot;11 8&quot;&gt;&lt;/line&gt;
          &lt;circle cx=&quot;${X(2)}&quot; cy=&quot;${Y(-4)}&quot; r=&quot;9&quot; class=&quot;number-point&quot;&gt;&lt;/circle&gt;
          &lt;circle cx=&quot;${X(6)}&quot; cy=&quot;${Y(-9)}&quot; r=&quot;9&quot; class=&quot;number-point-p&quot;&gt;&lt;/circle&gt;
          &lt;line x1=&quot;${X(2)+12}&quot; y1=&quot;${Y(-4)+4}&quot; x2=&quot;${X(6)-12}&quot; y2=&quot;${Y(-9)-4}&quot; stroke=&quot;#ef6070&quot; stroke-width=&quot;3.5&quot; marker-end=&quot;url(#wrapup-parabola-move-arrow)&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(0)}&quot; y1=&quot;${Y(1)}&quot; x2=&quot;${hx}&quot; y2=&quot;${hy}&quot; stroke=&quot;#ef6070&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
          &lt;path d=&quot;M${ra.x} ${ra.y} L${rb.x} ${rb.y} L${rc.x} ${rc.y}&quot; fill=&quot;none&quot; stroke=&quot;#24323d&quot; stroke-width=&quot;3&quot;&gt;&lt;/path&gt;
          &lt;circle cx=&quot;${X(0)}&quot; cy=&quot;${Y(1)}&quot; r=&quot;8&quot; fill=&quot;#ffffff&quot; stroke=&quot;#20a996&quot; stroke-width=&quot;4&quot;&gt;&lt;/circle&gt;
          &lt;circle cx=&quot;${hx}&quot; cy=&quot;${hy}&quot; r=&quot;8&quot; fill=&quot;#ffffff&quot; stroke=&quot;#4f7fd0&quot; stroke-width=&quot;4&quot;&gt;&lt;/circle&gt;
          &lt;text x=&quot;130&quot; y=&quot;54&quot; class=&quot;diagram-label&quot;&gt;y=x²-4x&lt;/text&gt;

          &lt;text x=&quot;330&quot; y=&quot;48&quot; class=&quot;diagram-note&quot;&gt;l′: 2x+y-4=0&lt;/text&gt;

      function wrapupTangentFigure() {
        const X=x=&gt;500+22*x, Y=y=&gt;215-22*y, ms=[(40-Math.sqrt(1456))/6,(40+Math.sqrt(1456))/6];
        const center={x:X(-4),y:Y(-5)}, origin={x:X(0),y:Y(0)};
        const tangent=(m,color,index)=&gt;{
          const t=(-4-5*m)/(1+m*m), tx=t, ty=m*t, sx=X(tx), sy=Y(ty), k=1.52;
          const tangentLength=Math.hypot(origin.x-sx,origin.y-sy), radiusLength=Math.hypot(center.x-sx,center.y-sy), markerSize=10;
          const u={x:(origin.x-sx)/tangentLength,y:(origin.y-sy)/tangentLength};
          const v={x:(center.x-sx)/radiusLength,y:(center.y-sy)/radiusLength};
          const a={x:sx+markerSize*u.x,y:sy+markerSize*u.y};
          const c={x:sx+markerSize*v.x,y:sy+markerSize*v.y};
          const b={x:a.x+markerSize*v.x,y:a.y+markerSize*v.y};
          const label=index===1?`&lt;text x=&quot;${sx-42}&quot; y=&quot;${sy-12}&quot; class=&quot;diagram-note&quot;&gt;T₁&lt;/text&gt;`:`&lt;text x=&quot;${sx+13}&quot; y=&quot;${sy-8}&quot; class=&quot;diagram-note&quot;&gt;T₂&lt;/text&gt;`;
          return `&lt;line x1=&quot;${origin.x}&quot; y1=&quot;${origin.y}&quot; x2=&quot;${X(tx*k)}&quot; y2=&quot;${Y(ty*k)}&quot; stroke=&quot;${color}&quot; stroke-width=&quot;6&quot;&gt;&lt;/line&gt;&lt;line x1=&quot;${center.x}&quot; y1=&quot;${center.y}&quot; x2=&quot;${sx}&quot; y2=&quot;${sy}&quot; stroke=&quot;#617383&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;7 5&quot;&gt;&lt;/line&gt;&lt;path d=&quot;M${a.x} ${a.y} L${b.x} ${b.y} L${c.x} ${c.y}&quot; fill=&quot;none&quot; stroke=&quot;#24323d&quot; stroke-width=&quot;2.5&quot;&gt;&lt;/path&gt;&lt;circle cx=&quot;${sx}&quot; cy=&quot;${sy}&quot; r=&quot;7&quot; fill=&quot;#fff&quot; stroke=&quot;${color}&quot; stroke-width=&quot;4&quot;&gt;&lt;/circle&gt;${label}`;
        };
        return `&lt;svg class=&quot;concept-diagram&quot; viewBox=&quot;0 0 760 470&quot; role=&quot;img&quot; aria-label=&quot;중심 C(-4,5)인 원을 x축에 대하여 대칭이동한 중심 C 프라임(-4,-5)인 원과 원점에서 그은 두 접선, 접점에서 접선과 반지름이 수직임을 나타낸 그림&quot;&gt;
          &lt;defs&gt;
            &lt;marker id=&quot;wrapup-tangent-axis-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10 z&quot; fill=&quot;#24323d&quot;&gt;&lt;/path&gt;&lt;/marker&gt;
            &lt;marker id=&quot;wrapup-tangent-reflect-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10 z&quot; fill=&quot;#ef6070&quot;&gt;&lt;/path&gt;&lt;/marker&gt;
          &lt;/defs&gt;
          &lt;line x1=&quot;65&quot; y1=&quot;${Y(0)}&quot; x2=&quot;710&quot; y2=&quot;${Y(0)}&quot; class=&quot;number-axis&quot; marker-end=&quot;url(#wrapup-tangent-axis-arrow)&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(0)}&quot; y1=&quot;405&quot; x2=&quot;${X(0)}&quot; y2=&quot;30&quot; class=&quot;number-axis&quot; marker-end=&quot;url(#wrapup-tangent-axis-arrow)&quot;&gt;&lt;/line&gt;
          &lt;circle cx=&quot;${X(-4)}&quot; cy=&quot;${Y(5)}&quot; r=&quot;${22*Math.sqrt(13)}&quot; fill=&quot;none&quot; stroke=&quot;#8b9298&quot; stroke-width=&quot;4&quot; stroke-dasharray=&quot;10 8&quot;&gt;&lt;/circle&gt;
          &lt;line x1=&quot;${X(-4)}&quot; y1=&quot;${Y(5)+12}&quot; x2=&quot;${X(-4)}&quot; y2=&quot;${Y(-5)-12}&quot; stroke=&quot;#ef6070&quot; stroke-width=&quot;3.5&quot; stroke-dasharray=&quot;8 7&quot; marker-end=&quot;url(#wrapup-tangent-reflect-arrow)&quot;&gt;&lt;/line&gt;
          &lt;circle cx=&quot;${X(-4)}&quot; cy=&quot;${Y(-5)}&quot; r=&quot;${22*Math.sqrt(13)}&quot; fill=&quot;rgba(31,151,139,.08)&quot; stroke=&quot;#1f978b&quot; stroke-width=&quot;5&quot;&gt;&lt;/circle&gt;
          ${tangent(ms[0],&#x27;#ee8b48&#x27;,1)}${tangent(ms[1],&#x27;#4f7fd3&#x27;,2)}
          &lt;circle cx=&quot;${X(-4)}&quot; cy=&quot;${Y(5)}&quot; r=&quot;7&quot; class=&quot;number-point&quot;&gt;&lt;/circle&gt;
          &lt;circle cx=&quot;${X(-4)}&quot; cy=&quot;${Y(-5)}&quot; r=&quot;9&quot; class=&quot;number-point&quot;&gt;&lt;/circle&gt;
          &lt;circle cx=&quot;${X(0)}&quot; cy=&quot;${Y(0)}&quot; r=&quot;9&quot; class=&quot;number-point-p&quot;&gt;&lt;/circle&gt;
          &lt;text x=&quot;${X(-4)-112}&quot; y=&quot;${Y(5)+7}&quot; class=&quot;diagram-label&quot;&gt;C(-4,5)&lt;/text&gt;
          &lt;text x=&quot;${X(-4)-126}&quot; y=&quot;${Y(-5)+10}&quot; class=&quot;diagram-label&quot;&gt;C′(-4,-5)&lt;/text&gt;
          &lt;text x=&quot;${X(0)+12}&quot; y=&quot;${Y(0)-12}&quot; class=&quot;diagram-label&quot;&gt;O(0,0)&lt;/text&gt;
          &lt;text x=&quot;${X(-4)+14}&quot; y=&quot;${Y(0)-15}&quot; class=&quot;diagram-note&quot;&gt;x축 대칭&lt;/text&gt;
          &lt;text x=&quot;302&quot; y=&quot;290&quot; class=&quot;diagram-note&quot;&gt;y=m₁x&lt;/text&gt;
          &lt;text x=&quot;515&quot; y=&quot;350&quot; class=&quot;diagram-note&quot;&gt;y=m₂x&lt;/text&gt;
          &lt;text x=&quot;55&quot; y=&quot;437&quot; class=&quot;diagram-note&quot;&gt;대칭이동한 원: (x+4)²+(y+5)²=13&lt;/text&gt;
          &lt;text x=&quot;55&quot; y=&quot;463&quot; class=&quot;diagram-note&quot;&gt;접점에서 반지름과 접선은 수직: C′T₁ ⟂ OT₁, C′T₂ ⟂ OT₂&lt;/text&gt;
          &lt;text x=&quot;714&quot; y=&quot;${Y(0)+22}&quot; class=&quot;diagram-label&quot;&gt;x&lt;/text&gt;
          &lt;text x=&quot;${X(0)+12}&quot; y=&quot;36&quot; class=&quot;diagram-label&quot;&gt;y&lt;/text&gt;
        &lt;/svg&gt;`;
      }

      function movementWrapupCards() {
        return [
          card({ id:&#x27;mw-summary&#x27;, page:54, label:&#x27;중단원 핵심 정리&#x27;, kind:&#x27;concept&#x27;, title:&#x27;평행이동과 대칭이동을 한눈에 정리하기&#x27;, body:`&lt;p&gt;문제를 풀기 전에 점의 좌표가 어떻게 바뀌는지와 도형의 식에 무엇을 대입하는지를 연결하여 확인하자.&lt;/p&gt;`, steps:[step(&#x27;1단계: 점의 평행이동&#x27;, formula(&#x27;P(x,y) → P′(x+a,y+b)&#x27;)),step(&#x27;2단계: 도형의 평행이동&#x27;, `${formula(&#x27;f(x,y)=0 → f(x-a,y-b)=0&#x27;)}&lt;p&gt;점의 좌표에는 이동량을 더하지만, 도형의 식에는 이동량을 반대로 뺀다.&lt;/p&gt;`),step(&#x27;3단계: 점의 대칭이동&#x27;, `${formula(&#x27;x축: (x,y) → (x,-y)&#x27;)}${formula(&#x27;y축: (x,y) → (-x,y)&#x27;)}${formula(&#x27;원점: (x,y) → (-x,-y)&#x27;)}${formula(&#x27;직선 y=x: (x,y) → (y,x)&#x27;)}`),step(&#x27;마지막 단계: 도형의 대칭이동&#x27;, `${formula(&#x27;x축: f(x,-y)=0&#x27;)}${formula(&#x27;y축: f(-x,y)=0&#x27;)}${formula(&#x27;원점: f(-x,-y)=0&#x27;)}${formula(&#x27;직선 y=x: f(y,x)=0&#x27;)}${answer(&#x27;점의 좌표 변화부터 확인하면 도형의 식에 넣을 값도 자연스럽게 정할 수 있다.&#x27;)}`)] }),
          card({ id:&#x27;mw01&#x27;, page:54, label:&#x27;중단원 마무리 문제 01&#x27;, kind:&#x27;problem&#x27;, title:&#x27;점의 평행이동량 구하기&#x27;, body:`&lt;p&gt;점 (2,-1)을 x축 방향으로 a만큼, y축 방향으로 b만큼 평행이동한 점의 좌표가 (-5,2)일 때, a, b를 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: x좌표의 관계를 쓴다&#x27;, formula(&#x27;2+a=-5&#x27;)),step(&#x27;2단계: a를 구한다&#x27;, formula(&#x27;a=-7&#x27;)),step(&#x27;3단계: y좌표의 관계를 쓴다&#x27;, formula(&#x27;-1+b=2&#x27;)),step(&#x27;4단계: b를 구한다&#x27;, formula(&#x27;b=3&#x27;)),step(&#x27;마지막 단계: 이동을 확인한다&#x27;, `${formula(&#x27;(2,-1)+(-7,3)=(-5,2)&#x27;)}${answer(&#x27;a=-7, b=3&#x27;)}`)] }),
          card({ id:&#x27;mw02&#x27;, page:54, label:&#x27;중단원 마무리 문제 02&#x27;, kind:&#x27;problem&#x27;, title:&#x27;도형을 x축 방향 6, y축 방향 -2만큼 평행이동하기&#x27;, body:`&lt;div class=&quot;problem-list&quot;&gt;${problem(&#x27;⑴&#x27;,&#x27;직선 2x+3y-1=0&#x27;)}${problem(&#x27;⑵&#x27;,&#x27;원 x²+(y-1)²=9&#x27;)}&lt;/div&gt;`, steps:[step(&#x27;⑴ 1단계: x 대신 x-6, y 대신 y+2를 넣는다&#x27;, formula(&#x27;2(x-6)+3(y+2)-1=0&#x27;)),step(&#x27;⑴ 2단계: 전개하여 정리한다&#x27;, formula(&#x27;2x+3y-7=0&#x27;)),step(&#x27;⑵ 1단계: 같은 값을 원의 식에 넣는다&#x27;, formula(&#x27;(x-6)²+{(y+2)-1}²=9&#x27;)),step(&#x27;⑵ 2단계: 괄호 안을 정리한다&#x27;, formula(&#x27;(x-6)²+(y+1)²=9&#x27;)),step(&#x27;마지막 단계: 두 답을 확인한다&#x27;, answer(&#x27;⑴ 2x+3y-7=0　⑵ (x-6)²+(y+1)²=9&#x27;))] }),
          card({ id:&#x27;mw03&#x27;, page:54, label:&#x27;중단원 마무리 문제 03&#x27;, kind:&#x27;problem&#x27;, title:&#x27;점 (-4,3)의 대칭점 좌표&#x27;, body:`&lt;p&gt;점 (-4,3)을 x축, y축, 원점, 직선 y=x에 대하여 각각 대칭이동한 점의 좌표를 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: x축 대칭&#x27;, formula(&#x27;(-4,3) → (-4,-3)&#x27;)),step(&#x27;2단계: y축 대칭&#x27;, formula(&#x27;(-4,3) → (4,3)&#x27;)),step(&#x27;3단계: 원점 대칭&#x27;, formula(&#x27;(-4,3) → (4,-3)&#x27;)),step(&#x27;4단계: 직선 y=x 대칭&#x27;, formula(&#x27;(-4,3) → (3,-4)&#x27;)),step(&#x27;마지막 단계: 네 좌표를 확인한다&#x27;, answer(&#x27;x축: (-4,-3), y축: (4,3), 원점: (4,-3), 직선 y=x: (3,-4)&#x27;))] }),
          card({ id:&#x27;mw04&#x27;, page:54, label:&#x27;중단원 마무리 문제 04&#x27;, kind:&#x27;problem&#x27;, title:&#x27;원을 네 가지 기준으로 대칭이동하기&#x27;, body:`&lt;p&gt;원 (x+5)²+(y-4)²=1을 x축, y축, 원점, 직선 y=x에 대하여 각각 대칭이동한 원의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 중심과 반지름을 읽는다&#x27;, formula(&#x27;중심 (-5,4), 반지름 1&#x27;)),step(&#x27;2단계: x축 대칭&#x27;, `${formula(&#x27;(-5,4) → (-5,-4)&#x27;)}${formula(&#x27;(x+5)²+(y+4)²=1&#x27;)}`),step(&#x27;3단계: y축 대칭&#x27;, `${formula(&#x27;(-5,4) → (5,4)&#x27;)}${formula(&#x27;(x-5)²+(y-4)²=1&#x27;)}`),step(&#x27;4단계: 원점 대칭&#x27;, `${formula(&#x27;(-5,4) → (5,-4)&#x27;)}${formula(&#x27;(x-5)²+(y+4)²=1&#x27;)}`),step(&#x27;5단계: 직선 y=x 대칭&#x27;, `${formula(&#x27;(-5,4) → (4,-5)&#x27;)}${formula(&#x27;(x-4)²+(y+5)²=1&#x27;)}`),step(&#x27;마지막 단계: 네 방정식을 확인한다&#x27;, answer(&#x27;x축: (x+5)²+(y+4)²=1&lt;br&gt;y축: (x-5)²+(y-4)²=1&lt;br&gt;원점: (x-5)²+(y+4)²=1&lt;br&gt;직선 y=x: (x-4)²+(y+5)²=1&#x27;))] }),
          card({ id:&#x27;mw05&#x27;, page:55, label:&#x27;중단원 마무리 문제 05&#x27;, kind:&#x27;problem&#x27;, title:&#x27;평행이동한 점이 직선 위에 있도록 하는 a&#x27;, body:`&lt;p&gt;점 (4,-5)를 x축 방향으로 -2, y축 방향으로 4만큼 평행이동한 점이 직선 x-ay+3=0 위에 있을 때, a의 값을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 점을 평행이동한다&#x27;, formula(&#x27;(4-2,-5+4)=(2,-1)&#x27;)),step(&#x27;2단계: 이동한 점을 직선의 식에 대입한다&#x27;, formula(&#x27;2-a(-1)+3=0&#x27;)),step(&#x27;3단계: 식을 정리한다&#x27;, formula(&#x27;a+5=0&#x27;)),step(&#x27;마지막 단계: a를 구한다&#x27;, `${formula(&#x27;a=-5&#x27;)}${answer(&#x27;a=-5&#x27;)}`)] }),
          card({ id:&#x27;mw06&#x27;, page:55, label:&#x27;중단원 마무리 문제 06&#x27;, kind:&#x27;problem&#x27;, title:&#x27;평행이동과 직선 y=x 대칭을 차례로 적용하기&#x27;, body:`&lt;p&gt;원 (x-1)²+(y-6)²=9를 x축의 방향으로 5만큼, y축의 방향으로 -1만큼 평행이동한 다음 직선 y=x에 대하여 대칭이동한 원의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 원래 원의 중심과 반지름을 읽는다&#x27;, `${formula(&#x27;C(1,6)&#x27;)}${formula(&#x27;r=3&#x27;)}`),step(&#x27;2단계: 중심을 x축 방향 5, y축 방향 -1만큼 옮긴다&#x27;, formula(&#x27;(1+5,6-1)=(6,5)&#x27;)),step(&#x27;3단계: 직선 y=x 대칭으로 두 좌표를 바꾼다&#x27;, formula(&#x27;(6,5) → (5,6)&#x27;)),step(&#x27;4단계: 두 이동에서 반지름은 변하지 않는다&#x27;, formula(&#x27;r=3&#x27;)),step(&#x27;마지막 단계: 최종 원의 방정식을 쓴다&#x27;, `${formula(&#x27;(x-5)²+(y-6)²=9&#x27;)}${answer(&#x27;(x-5)²+(y-6)²=9&#x27;)}`)] }),
          card({ id:&#x27;mw07&#x27;, page:55, label:&#x27;중단원 마무리 문제 07&#x27;, kind:&#x27;problem&#x27;, title:&#x27;대칭이동한 직선에 수직인 직선 구하기&#x27;, body:`&lt;p&gt;직선 y=2x-3을 x축에 대하여 대칭이동한 직선에 수직이고 점 (-2,3)을 지나는 직선의 방정식을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: x축 대칭인 직선을 구한다&#x27;, `${formula(&#x27;-y=2x-3&#x27;)}${formula(&#x27;y=-2x+3&#x27;)}`),step(&#x27;2단계: 대칭이동한 직선의 기울기를 확인한다&#x27;, formula(&#x27;-2&#x27;)),step(&#x27;3단계: 수직인 직선의 기울기를 구한다&#x27;, `&lt;p&gt;서로 수직인 두 직선의 기울기의 곱은 -1이다.&lt;/p&gt;${formula(&#x27;(-2)m=-1 → m=1/2&#x27;)}`),step(&#x27;4단계: 점 (-2,3)을 지나는 식을 쓴다&#x27;, formula(&#x27;y-3=(1/2)(x+2)&#x27;)),step(&#x27;5단계: 일반형으로 정리한다&#x27;, formula(&#x27;x-2y+8=0&#x27;)),step(&#x27;마지막 단계: 답을 확인한다&#x27;, answer(&#x27;x-2y+8=0&#x27;))] }),
          card({ id:&#x27;mw08&#x27;, page:55, label:&#x27;중단원 마무리 문제 08 · 서술형&#x27;, kind:&#x27;problem&#x27;, title:&#x27;대칭이동한 세 점이 만드는 삼각형의 넓이&#x27;, body:`&lt;p&gt;점 A(2,1)을 원점에 대하여 대칭이동한 점을 B, 직선 y=x에 대하여 대칭이동한 점을 C라 할 때, 세 점 A, B, C를 꼭짓점으로 하는 삼각형 ABC의 넓이를 구하는 풀이 과정과 답을 쓰시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 원점 대칭인 점 B의 좌표를 구한다&#x27;, `${formula(&#x27;A(2,1) → B(-2,-1)&#x27;)}&lt;p&gt;x좌표와 y좌표의 부호를 모두 바꾼다.&lt;/p&gt;`),step(&#x27;2단계: 직선 y=x 대칭인 점 C의 좌표를 구한다&#x27;, `${formula(&#x27;A(2,1) → C(1,2)&#x27;)}&lt;p&gt;x좌표와 y좌표를 서로 바꾼다.&lt;/p&gt;`),step(&#x27;3단계: 밑변 AB의 길이를 구한다&#x27;, `${formula(&#x27;AB=√{(2-(-2))²+(1-(-1))²}&#x27;)} ${formula(&#x27;AB=√20=2√5&#x27;)}`),step(&#x27;4단계: 두 점 A, B를 지나는 직선의 방정식을 구한다&#x27;, `${formula(&#x27;AB의 기울기={1-(-1)}/{2-(-2)}=1/2&#x27;)}${formula(&#x27;직선 AB: x-2y=0&#x27;)}`),step(&#x27;5단계: 점 C에서 직선 AB까지의 높이를 구한다&#x27;, `${formula(&#x27;h=|1-2×2|/√(1²+(-2)²)&#x27;)}${formula(&#x27;h=3/√5&#x27;)}`),step(&#x27;6단계: 밑변과 높이로 넓이를 계산한다&#x27;, `${formula(&#x27;S=(1/2)×AB×h&#x27;)}${formula(&#x27;S=(1/2)×2√5×{3/√5}=3&#x27;)}`),step(&#x27;마지막 단계: 세 점과 높이를 그림으로 확인한다&#x27;, `${answer(&#x27;3&#x27;)}${wrapupTriangleFigure()}`)] }),
          card({ id:&#x27;mw09&#x27;, page:55, label:&#x27;중단원 마무리 문제 09&#x27;, kind:&#x27;problem&#x27;, title:&#x27;대칭이동한 직선과 원의 교점의 개수&#x27;, body:`&lt;p&gt;직선 x+3y-4=0을 직선 y=x에 대하여 대칭이동한 직선과 원 (x-1)²+y²=4의 교점의 개수를 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: x와 y를 서로 바꾸어 대칭인 직선을 구한다&#x27;, `${formula(&#x27;y+3x-4=0&#x27;)}${formula(&#x27;3x+y-4=0&#x27;)}`),step(&#x27;2단계: 원의 중심과 반지름을 확인한다&#x27;, `${formula(&#x27;C(1,0)&#x27;)}${formula(&#x27;r=2&#x27;)}`),step(&#x27;3단계: 중심에서 직선까지의 거리를 구한다&#x27;, formula(&#x27;d={|3·1+0-4|}/√(3²+1²)=1/√10&#x27;)),step(&#x27;4단계: 거리와 반지름을 비교한다&#x27;, `${formula(&#x27;1/√10&lt;2&#x27;)}&lt;p&gt;중심에서 직선까지의 거리가 반지름보다 작으므로 직선은 원의 안쪽을 지난다.&lt;/p&gt;`),step(&#x27;마지막 단계: 교점의 개수를 그림으로 확인한다&#x27;, `${answer(&#x27;2개&#x27;)}${wrapupCircleLineFigure()}`)] }),
          card({ id:&#x27;mw10&#x27;, page:55, label:&#x27;중단원 마무리 문제 10 · 발전&#x27;, kind:&#x27;problem&#x27;, title:&#x27;포물선과 직선을 같은 만큼 평행이동하기&#x27;, body:`&lt;p&gt;포물선 y=x²-4x를 포물선 y=x²-12x+27로 옮기는 평행이동에 의하여 직선 l: 2x+y-1=0이 직선 l′으로 옮겨진다. 이때 두 직선 l과 l′ 사이의 거리를 구하는 풀이 과정과 답을 쓰시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 평행이동량을 (a,b)라 둔다&#x27;, `&lt;p&gt;x축 방향으로 a, y축 방향으로 b만큼 옮긴다고 하자.&lt;/p&gt;${formula(&#x27;x → x-a, y → y-b&#x27;)}`),step(&#x27;2단계: 원래 포물선의 식에 대입한다&#x27;, formula(&#x27;y-b=(x-a)²-4(x-a)&#x27;)),step(&#x27;3단계: y에 관하여 전개한다&#x27;, formula(&#x27;y=x²-(2a+4)x+(a²+4a+b)&#x27;)),step(&#x27;4단계: 옮긴 포물선의 x의 계수를 비교한다&#x27;, `${formula(&#x27;-(2a+4)=-12&#x27;)}${formula(&#x27;a=4&#x27;)}`),step(&#x27;5단계: 상수항을 비교하여 b를 구한다&#x27;, `${formula(&#x27;a²+4a+b=27&#x27;)}${formula(&#x27;16+16+b=27&#x27;)}${formula(&#x27;b=-5&#x27;)}`),step(&#x27;6단계: 직선 l도 (4,-5)만큼 평행이동한다&#x27;, `${formula(&#x27;2(x-4)+(y+5)-1=0&#x27;)}${formula(&#x27;l′: 2x+y-4=0&#x27;)}`),step(&#x27;7단계: l 위에서 계산하기 쉬운 점을 고른다&#x27;, `&lt;p&gt;l: 2x+y-1=0에서 x=0으로 두면 y=1이므로 점 P(0,1)을 잡을 수 있다.&lt;/p&gt;${formula(&#x27;P(0,1)&#x27;)}`),step(&#x27;8단계: P에서 l′까지의 거리를 구한다&#x27;, `${formula(&#x27;d=|2×0+1-4|/√(2²+1²)&#x27;)}${formula(&#x27;d=3/√5=3√5/5&#x27;)}`),step(&#x27;마지막 단계: 두 그래프의 이동을 그림으로 확인한다&#x27;, `${answer(&#x27;3√5/5&#x27;)}${wrapupParabolaFigure()}`)] }),
          card({ id:&#x27;mw11&#x27;, page:55, label:&#x27;중단원 마무리 문제 11 · 발전&#x27;, kind:&#x27;problem&#x27;, title:&#x27;대칭이동한 원에 접하는 직선의 기울기&#x27;, body:`&lt;p&gt;원 x²+y²+8x-10y+28=0을 x축에 대하여 대칭이동한 원이 직선 y=mx에 접하도록 하는 모든 실수 m의 값의 합을 구하시오.&lt;/p&gt;`, steps:[step(&#x27;1단계: 원래 원을 표준형으로 바꾼다&#x27;, `${formula(&#x27;x²+8x+y²-10y+28=0&#x27;)}${formula(&#x27;(x+4)²+(y-5)²=13&#x27;)}&lt;p&gt;원의 중심은 (-4,5), 반지름은 √13이다.&lt;/p&gt;`),step(&#x27;2단계: 원을 x축에 대하여 대칭이동한다&#x27;, `&lt;p&gt;x축 대칭에서는 중심의 y좌표 부호만 바뀐다.&lt;/p&gt;${formula(&#x27;(-4,5) → (-4,-5)&#x27;)}${formula(&#x27;(x+4)²+(y+5)²=13&#x27;)}`),step(&#x27;3단계: 직선 y=mx를 일반형으로 쓴다&#x27;, `${formula(&#x27;mx-y=0&#x27;)}&lt;p&gt;이 직선은 m의 값과 관계없이 항상 원점 O(0,0)을 지난다.&lt;/p&gt;`),step(&#x27;4단계: 대칭이동한 원의 중심에서 직선까지의 거리를 구한다&#x27;, `${formula(&#x27;d={|m(-4)-(-5)|}/√(m²+(-1)²)&#x27;)}${formula(&#x27;d={|5-4m|}/√(m²+1)&#x27;)}`),step(&#x27;5단계: 접선 조건을 식으로 나타낸다&#x27;, `&lt;p&gt;직선이 원에 접할 때 중심에서 직선까지의 거리는 반지름과 같다.&lt;/p&gt;${formula(&#x27;{|5-4m|}/√(m²+1)=√13&#x27;)}`),step(&#x27;6단계: 양변을 제곱한다&#x27;, formula(&#x27;(5-4m)²=13(m²+1)&#x27;)),step(&#x27;7단계: 이차방정식으로 정리한다&#x27;, `${formula(&#x27;25-40m+16m²=13m²+13&#x27;)}${formula(&#x27;3m²-40m+12=0&#x27;)}`),step(&#x27;8단계: 모든 m의 값의 합을 구한다&#x27;, `&lt;p&gt;이 이차방정식의 두 근이 접선의 두 기울기이다. 두 근을 m₁, m₂라 하면 근과 계수의 관계에서&lt;/p&gt;${formula(&#x27;m₁+m₂=40/3&#x27;)}`),step(&#x27;마지막 단계: 대칭된 원과 두 접선을 정확한 그림으로 확인한다&#x27;, `${answer(&#x27;40/3&#x27;)}${wrapupTangentFigure()}`)] })
        ].join(&#x27;&#x27;);
      }

      function chapterProblem05Figure(showSolution=false) {
        const X=x=&gt;350+48*x, Y=y=&gt;250-48*y;
        const I={x:X(0),y:Y(2)}, Q={x:X(2),y:Y(1)};

        const rightAngle=(p,u,v,size=10)=&gt;{
          const ul=Math.hypot(u.x,u.y), vl=Math.hypot(v.x,v.y);
          const un={x:u.x/ul,y:u.y/ul}, vn={x:v.x/vl,y:v.y/vl};
          const a={x:p.x+size*un.x,y:p.y+size*un.y};
          const c={x:p.x+size*vn.x,y:p.y+size*vn.y};
          const b={x:a.x+size*vn.x,y:a.y+size*vn.y};
          return `&lt;path d=&quot;M${a.x} ${a.y} L${b.x} ${b.y} L${c.x} ${c.y}&quot; fill=&quot;none&quot; stroke=&quot;#24323d&quot; stroke-width=&quot;2.5&quot;&gt;&lt;/path&gt;`;
        };

          &lt;defs&gt;&lt;marker id=&quot;chapter05-axis-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10 z&quot; fill=&quot;#24323d&quot;&gt;&lt;/path&gt;&lt;/marker&gt;&lt;/defs&gt;
          &lt;line x1=&quot;62&quot; y1=&quot;32&quot; x2=&quot;102&quot; y2=&quot;32&quot; stroke=&quot;#4f7fd3&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
          &lt;text x=&quot;114&quot; y=&quot;39&quot; class=&quot;diagram-note&quot;&gt;3x+y-2=0&lt;/text&gt;
          &lt;line x1=&quot;278&quot; y1=&quot;32&quot; x2=&quot;318&quot; y2=&quot;32&quot; stroke=&quot;#1f978b&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
          &lt;text x=&quot;330&quot; y=&quot;39&quot; class=&quot;diagram-note&quot;&gt;x-3y+6=0&lt;/text&gt;
          &lt;line x1=&quot;505&quot; y1=&quot;32&quot; x2=&quot;545&quot; y2=&quot;32&quot; stroke=&quot;#ef6070&quot; stroke-width=&quot;5&quot; stroke-dasharray=&quot;${showSolution?&#x27;&#x27;:&#x27;10 7&#x27;}&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
          &lt;text x=&quot;557&quot; y=&quot;39&quot; class=&quot;diagram-note&quot;&gt;${showSolution?&#x27;조건에 맞는 이등분선&#x27;:&#x27;음의 기울기 후보&#x27;}&lt;/text&gt;
          &lt;line x1=&quot;55&quot; y1=&quot;${Y(0)}&quot; x2=&quot;705&quot; y2=&quot;${Y(0)}&quot; class=&quot;number-axis&quot; marker-end=&quot;url(#chapter05-axis-arrow)&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(0)}&quot; y1=&quot;428&quot; x2=&quot;${X(0)}&quot; y2=&quot;65&quot; class=&quot;number-axis&quot; marker-end=&quot;url(#chapter05-axis-arrow)&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(-.55)}&quot; y1=&quot;${Y(3.65)}&quot; x2=&quot;${X(1.8)}&quot; y2=&quot;${Y(-3.4)}&quot; stroke=&quot;#4f7fd3&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(-5.7)}&quot; y1=&quot;${Y(.1)}&quot; x2=&quot;${X(5.2)}&quot; y2=&quot;${Y(3.733333)}&quot; stroke=&quot;#1f978b&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(-3)}&quot; y1=&quot;${Y(3.5)}&quot; x2=&quot;${X(6.2)}&quot; y2=&quot;${Y(-1.1)}&quot; stroke=&quot;#ef6070&quot; stroke-width=&quot;${showSolution?6:4}&quot; stroke-dasharray=&quot;${showSolution?&#x27;&#x27;:&#x27;11 8&#x27;}&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${X(-2.6)}&quot; y1=&quot;${Y(-3.2)}&quot; x2=&quot;${X(.75)}&quot; y2=&quot;${Y(3.5)}&quot; stroke=&quot;#8b9298&quot; stroke-width=&quot;3.5&quot; stroke-dasharray=&quot;10 8&quot;&gt;&lt;/line&gt;
          &lt;line x1=&quot;${Q.x}&quot; y1=&quot;${Q.y}&quot; x2=&quot;${F1.x}&quot; y2=&quot;${F1.y}&quot; stroke=&quot;#ef6070&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;7 5&quot;&gt;&lt;/line&gt;

          ${rightAngle(F1,{x:1,y:3},{x:3,y:-1})}

          &lt;circle cx=&quot;${F2.x}&quot; cy=&quot;${F2.y}&quot; r=&quot;5&quot; fill=&quot;#fff&quot; stroke=&quot;#1f978b&quot; stroke-width=&quot;3&quot;&gt;&lt;/circle&gt;
          &lt;text x=&quot;${I.x-68}&quot; y=&quot;${I.y-14}&quot; class=&quot;diagram-label&quot;&gt;I(0,2)&lt;/text&gt;
          &lt;text x=&quot;${Q.x+13}&quot; y=&quot;${Q.y+5}&quot; class=&quot;diagram-label&quot;&gt;Q&lt;/text&gt;
          &lt;text x=&quot;${X(.98)}&quot; y=&quot;${Y(1.05)}&quot; class=&quot;diagram-note&quot;&gt;d₁&lt;/text&gt;
          &lt;text x=&quot;${X(1.67)}&quot; y=&quot;${Y(1.98)}&quot; class=&quot;diagram-note&quot;&gt;d₂&lt;/text&gt;
          ${showSolution ? `
            &lt;line x1=&quot;68&quot; y1=&quot;454&quot; x2=&quot;108&quot; y2=&quot;454&quot; stroke=&quot;#ef6070&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;&gt;&lt;/line&gt;
            &lt;text x=&quot;120&quot; y=&quot;461&quot; class=&quot;diagram-note&quot;&gt;x+2y-4=0 (기울기 -1/2)&lt;/text&gt;
            &lt;line x1=&quot;390&quot; y1=&quot;454&quot; x2=&quot;430&quot; y2=&quot;454&quot; stroke=&quot;#8b9298&quot; stroke-width=&quot;3.5&quot; stroke-dasharray=&quot;10 8&quot;&gt;&lt;/line&gt;

            step(&#x27;마지막 단계 · 이동량과 거리를 정확한 그래프로 확인한다&#x27;, `${answer(&#x27;두 직선 l과 l′ 사이의 거리는 &#x27;+mathML(&#x27;{3√5}/5&#x27;)+&#x27;이다.&#x27;)}${wrapupParabolaFigure()}`)
          ] }),
          card({ id:&#x27;mw11&#x27;, page:55, label:&#x27;중단원 마무리 문제 11 · 발전&#x27;, kind:&#x27;problem&#x27;, title:&#x27;대칭이동한 원에 접하는 직선의 기울기&#x27;, body:wrapupProblemPrompt(&#x27;원 x²+y²+8x-10y+28=0을 x축에 대하여 대칭이동한 원이 직선 y=mx에 접하도록 하는 모든 실수 m의 값의 합을 구하시오.&#x27;,[&#x27;먼저 할 일: 원의 중심과 반지름 구하기&#x27;,&#x27;대칭 기준: x축&#x27;,&#x27;구할 것: 접선 기울기 m의 합&#x27;]), visual:wrapupTangentFigure(), visualFirst:true, steps:[

            step(&#x27;3단계 · 원래 원의 방정식에 x=x′, y=-y′을 대입한다&#x27;, `${formula(&#x27;x′²+(-y′)²+8x′-10(-y′)+28=0&#x27;)}${formula(&#x27;x′²+y′²+8x′+10y′+28=0&#x27;)}&lt;p&gt;제곱항 (-y′)²은 y′²이 되고, -10(-y′)은 +10y′이 된다.&lt;/p&gt;`),
            step(&#x27;4단계 · 완전제곱식으로 바꾸어 대칭이동한 원을 확인한다&#x27;, `${formula(&#x27;(x′²+8x′+16)+(y′²+10y′+25)=13&#x27;)}${formula(&#x27;(x′+4)²+(y′+5)²=13&#x27;)}&lt;p&gt;마지막에 x′, y′을 x, y로 바꾸어 쓰면 대칭이동한 원은 (x+4)²+(y+5)²=13이다. 중심은 (-4,-5), 반지름은 √13이다.&lt;/p&gt;`),
            step(&#x27;5단계 · 직선 y=mx를 거리 공식에 맞는 일반형으로 바꾼다&#x27;, `${formula(&#x27;y=mx → mx-y=0&#x27;)}&lt;p&gt;이 직선은 m의 값이 달라져도 항상 원점 O(0,0)을 지난다.&lt;/p&gt;`),

            step(&#x27;8단계 · 거리와 반지름을 같게 둔 뒤 양변을 제곱한다&#x27;, `${formula(&#x27;|5-4m|/√(m²+1)=√13&#x27;)}${formula(&#x27;(5-4m)²=13(m²+1)&#x27;)}&lt;p&gt;양변이 모두 0 이상이므로 제곱해도 같은 조건을 얻는다.&lt;/p&gt;`),
            step(&#x27;9단계 · 식을 전개하여 m에 관한 이차방정식으로 정리한다&#x27;, `${formula(&#x27;25-40m+16m²=13m²+13&#x27;)}${formula(&#x27;3m²-40m+12=0&#x27;)}&lt;p&gt;이 방정식의 두 실근이 원점에서 그을 수 있는 두 접선의 기울기이다.&lt;/p&gt;`),

          ] }),
          card({ id:&#x27;chapter05&#x27;, page:57, label:&#x27;대단원 마무리 문제 05&#x27;, kind:&#x27;problem&#x27;, title:&#x27;두 직선이 이루는 각의 이등분선&#x27;, body:wrapupProblemPrompt(&#x27;두 직선 3x+y-2=0과 x-3y+6=0이 이루는 각을 이등분하는 직선 중에서 기울기가 음수인 직선의 방정식을 구하시오.&#x27;,[&#x27;주어진 것: 두 직선&#x27;,&#x27;핵심 조건: 두 직선까지의 거리가 같음&#x27;,&#x27;구할 것: 기울기가 음수인 이등분선&#x27;]), visual:chapterProblem05Figure(false), visualFirst:true, steps:[
            step(&#x27;두 직선이 만나는 점을 먼저 확인한다&#x27;, `&lt;p&gt;각의 이등분선은 두 직선의 교점을 지나므로 교점을 먼저 확인하면 그림의 구조를 이해하기 쉽다. 첫 번째 식에서 y를 나타내고 두 번째 식에 대입한다.&lt;/p&gt;${formula(&#x27;3x+y-2=0 → y=-3x+2&#x27;)}${formula(&#x27;x-3(-3x+2)+6=0&#x27;)}${formula(&#x27;10x=0 → x=0, y=2&#x27;)}&lt;p&gt;따라서 두 직선의 교점은 I(0,2)이다. 구하려는 두 각의 이등분선도 모두 I를 지난다.&lt;/p&gt;${formula(&#x27;I(0,2)&#x27;)}`),
            step(&#x27;각의 이등분선 위의 점 Q(x,y)가 가지는 성질을 이용한다&#x27;, `&lt;p&gt;각의 이등분선 위의 점은 각을 이루는 두 직선까지의 &lt;strong&gt;수직거리&lt;/strong&gt;가 같다. 그림처럼 이등분선 위의 점을 Q(x,y)라 하고, Q에서 두 직선까지의 거리를 각각 d₁, d₂라 하면 다음 관계가 성립한다.&lt;/p&gt;${formula(&#x27;d₁=d₂&#x27;)}`),
            step(&#x27;Q에서 첫 번째 직선까지의 거리를 구한다&#x27;, `&lt;p&gt;첫 번째 직선 3x+y-2=0에서 x와 y의 계수는 각각 3과 1이다. 점과 직선 사이의 거리 공식에 Q(x,y)를 대입한다.&lt;/p&gt;${formula(&#x27;d₁=|3x+y-2|/√(3²+1²)&#x27;)}${formula(&#x27;d₁=|3x+y-2|/√10&#x27;)}`),
            step(&#x27;Q에서 두 번째 직선까지의 거리를 구한다&#x27;, `&lt;p&gt;두 번째 직선 x-3y+6=0에서 x와 y의 계수는 각각 1과 -3이다. 같은 방법으로 거리를 구한다.&lt;/p&gt;${formula(&#x27;d₂=|x-3y+6|/√(1²+(-3)²)&#x27;)}${formula(&#x27;d₂=|x-3y+6|/√10&#x27;)}`),
            step(&#x27;두 수직거리를 같게 두어 절댓값 식을 만든다&#x27;, `${formula(&#x27;|3x+y-2|/√10=|x-3y+6|/√10&#x27;)}${formula(&#x27;|3x+y-2|=|x-3y+6|&#x27;)}&lt;p&gt;두 거리의 분모가 모두 √10으로 같으므로 분자에 있는 절댓값끼리 같게 둘 수 있다.&lt;/p&gt;`),
            step(&#x27;절댓값이 같은 두 경우를 빠짐없이 나눈다&#x27;, `&lt;p&gt;|A|=|B|이면 A=B 또는 A=-B이다. 각에는 이등분선이 두 개 있으므로 두 경우를 모두 계산해야 한다.&lt;/p&gt;${formula(&#x27;① 3x+y-2=x-3y+6&#x27;)}${formula(&#x27;② 3x+y-2=-(x-3y+6)&#x27;)}`),
            step(&#x27;첫 번째 경우에서 기울기가 음수인 후보를 얻는다&#x27;, `${formula(&#x27;3x+y-2=x-3y+6&#x27;)}${formula(&#x27;2x+4y-8=0&#x27;)}${formula(&#x27;x+2y-4=0&#x27;)}${formula(&#x27;y=-(1/2)x+2&#x27;)}&lt;p&gt;이 직선의 기울기는 -1/2로 음수이므로 문제에서 요구한 후보이다.&lt;/p&gt;`),
            step(&#x27;두 번째 경우도 계산하여 조건에 맞는지 비교한다&#x27;, `${formula(&#x27;3x+y-2=-x+3y-6&#x27;)}${formula(&#x27;4x-2y+4=0&#x27;)}${formula(&#x27;2x-y+2=0&#x27;)}${formula(&#x27;y=2x+2&#x27;)}&lt;p&gt;이 직선의 기울기는 2로 양수이다. 따라서 두 후보 중 첫 번째 직선을 선택한다.&lt;/p&gt;`),
            step(&#x27;마지막 단계 · 두 후보와 결과를 그림으로 확인한다&#x27;, `${answer(&#x27;기울기가 음수인 각의 이등분선은 x+2y-4=0이다.&#x27;)}${chapterProblem05Figure(true)}`)
          ] }),
          card({ id:&#x27;chapter15&#x27;, page:58, label:&#x27;대단원 마무리 문제 15&#x27;, kind:&#x27;problem&#x27;, title:&#x27;두 건물에서 버스 정류장까지 거리의 합의 최솟값&#x27;, body:wrapupProblemPrompt(&#x27;다음 그림과 같이 직선으로 뻗은 도로변에 4 km 떨어진 두 지점 A와 B로부터 각각 수직으로 2 km와 1 km 떨어진 지점에 두 건물 C와 D가 있다. 도로변에 버스 정류장을 만들려고 할 때, 두 건물에서 버스 정류장까지의 거리의 합의 최솟값을 구하시오.&#x27;,[&#x27;AB=4 km&#x27;,&#x27;AC=2 km, BD=1 km&#x27;,&#x27;구할 것: 두 거리의 합의 최솟값&#x27;]), visual:chapterProblem15Figure(false), visualFirst:true, steps:[
            step(&#x27;도로를 x축의 수직선으로 나타내어 좌표를 정한다&#x27;, `&lt;p&gt;도로를 x축으로 보고 A를 원점으로 정한다. AB=4 km이므로 B(4,0)이다. C는 A에서 도로에 수직으로 2 km, D는 B에서 도로에 수직으로 1 km 떨어져 있다.&lt;/p&gt;${formula(&#x27;A(0,0), B(4,0)&#x27;)}${formula(&#x27;C(0,2), D(4,1)&#x27;)}&lt;p&gt;도로 위에 세울 버스 정류장을 P(t,0)라고 하면 0≤t≤4이다. 우리가 최소로 만들려는 길이는 CP+PD이다.&lt;/p&gt;${formula(&#x27;P(t,0), 0≤t≤4&#x27;)}${formula(&#x27;구할 것: CP+PD의 최솟값&#x27;)}${chapterProblem15CoordinateFigure()}`),
            step(&#x27;꺾인 경로를 곧게 펴기 위해 C를 x축 대칭이동한다&#x27;, `&lt;p&gt;점 C(0,2)를 도로인 x축에 대하여 대칭이동한 점을 C′이라 하면 C′(0,-2)이다. 점 P는 x축 위에 있으므로 P에서 C와 C′까지의 거리는 서로 같다.&lt;/p&gt;${formula(&#x27;C(0,2) → C′(0,-2)&#x27;)}${formula(&#x27;CP=C′P&#x27;)}&lt;p&gt;따라서 CP를 같은 길이인 C′P로 바꾸면 꺾인 길이를 한 직선으로 펼쳐 생각할 수 있다.&lt;/p&gt;`),
            step(&#x27;거리의 합을 C′에서 D까지 가는 경로로 바꾼다&#x27;, `${formula(&#x27;CP+PD=C′P+PD&#x27;)}&lt;p&gt;C′에서 P를 거쳐 D로 가는 꺾인 경로의 길이는 C′과 D를 바로 잇는 직선거리보다 짧을 수 없다.&lt;/p&gt;${formula(&#x27;C′P+PD≥C′D&#x27;)}&lt;p&gt;등호는 C′, P, D가 이 순서대로 한 직선 위에 있을 때 성립한다.&lt;/p&gt;`),
            step(&#x27;최솟값이 실제 도로 위에서 만들어지는지 P의 위치를 확인한다&#x27;, `&lt;p&gt;C′(0,-2)과 D(4,1)을 지나는 직선의 기울기와 방정식을 구한다.&lt;/p&gt;${formula(&#x27;m={1-(-2)}/{4-0}=3/4&#x27;)}${formula(&#x27;y+2=(3/4)x&#x27;)}${formula(&#x27;y=(3/4)x-2&#x27;)}&lt;p&gt;이 직선과 도로 y=0이 만나는 점이 P이다.&lt;/p&gt;${formula(&#x27;0=(3/4)x-2&#x27;)}${formula(&#x27;x=8/3&#x27;)}${formula(&#x27;P(8/3,0)&#x27;)}&lt;p&gt;0&amp;lt;8/3&amp;lt;4이므로 P는 실제로 A와 B 사이의 도로 위에 있다. 따라서 등호가 성립하는 정류장 위치가 존재한다.&lt;/p&gt;`),
            step(&#x27;C′과 D 사이의 직선거리를 계산한다&#x27;, `&lt;p&gt;등호가 성립할 때 CP+PD=C′D이므로 C′D만 계산하면 된다. x좌표의 차는 4, y좌표의 차는 3이다.&lt;/p&gt;${formula(&#x27;C′D=√{{4-0}²+{1-(-2)}²}&#x27;)}${formula(&#x27;C′D=√(4²+3²)&#x27;)}${formula(&#x27;C′D=√25=5&#x27;)}`),
            step(&#x27;마지막 단계 · 대칭으로 펼친 최단 경로를 그림으로 확인한다&#x27;, `${answer(&#x27;거리의 합의 최솟값은 5 km이다.&#x27;)}${chapterProblem15Figure(true)}`)
          ] }),
          card({ id:&#x27;chapter18&#x27;, page:59, label:&#x27;대단원 마무리 문제 18 · 서술형&#x27;, kind:&#x27;problem&#x27;, title:&#x27;두 대칭이동으로 세 선분 길이의 합 최소화하기&#x27;, body:wrapupProblemPrompt(&#x27;다음 그림과 같이 두 점 A(4,3)과 B(2,-4)에 대하여 서로 다른 두 점 C와 D가 각각 y축과 직선 y=x 위에 있을 때, AD+DC+CB의 최솟값을 구하시오.&#x27;,[&#x27;C는 y축 위&#x27;,&#x27;D는 직선 y=x 위&#x27;,&#x27;구할 것: AD+DC+CB의 최솟값&#x27;]), visual:chapterProblem18Figure(false), visualFirst:true, steps:[
            step(&#x27;세 선분으로 꺾인 경로를 대칭이동으로 곧게 편다&#x27;, `&lt;p&gt;구하려는 길이는 A에서 D, C를 차례로 지나 B까지 가는 &lt;strong&gt;AD+DC+CB&lt;/strong&gt;이다. 이 꺾인 경로를 그대로 계산하기보다, D가 놓인 직선 y=x와 C가 놓인 y축을 대칭의 기준으로 이용한다.&lt;/p&gt;&lt;p&gt;A를 y=x에 대하여 대칭이동한 점을 A′, B를 y축에 대하여 대칭이동한 점을 B′이라 하면 &lt;strong&gt;AD=A′D&lt;/strong&gt;, &lt;strong&gt;CB=CB′&lt;/strong&gt;이다. 따라서 회색 꺾인 경로를 굵은 초록색 직선 경로로 펼쳐 생각할 수 있다.&lt;/p&gt;${chapterProblem18StrategyFigure(false)}`),
            step(&#x27;A를 직선 y=x에 대하여 대칭이동한다&#x27;, `&lt;p&gt;직선 y=x에 대한 대칭에서는 x좌표와 y좌표를 서로 바꾼다.&lt;/p&gt;${formula(&#x27;A(4,3) → A′(3,4)&#x27;)}&lt;p&gt;D는 대칭의 기준인 직선 y=x 위에 있으므로 D에서 A와 A′까지의 거리는 같다.&lt;/p&gt;${formula(&#x27;AD=A′D&#x27;)}`),
            step(&#x27;B를 y축에 대하여 대칭이동한다&#x27;, `&lt;p&gt;y축 대칭에서는 x좌표의 부호만 바꾸고 y좌표는 그대로 둔다.&lt;/p&gt;${formula(&#x27;B(2,-4) → B′(-2,-4)&#x27;)}&lt;p&gt;C는 대칭의 기준인 y축 위에 있으므로 C에서 B와 B′까지의 거리는 같다.&lt;/p&gt;${formula(&#x27;CB=CB′&#x27;)}`),
            step(&#x27;원래 길이의 합을 대칭점으로 바꾸어 쓴다&#x27;, `&lt;p&gt;AD를 A′D로, CB를 CB′으로 바꾸어도 각각의 길이는 변하지 않는다.&lt;/p&gt;${formula(&#x27;AD+DC+CB=A′D+DC+CB′&#x27;)}&lt;p&gt;오른쪽은 A′에서 출발하여 D와 C를 차례로 지나 B′으로 가는 꺾인 경로의 길이이다.&lt;/p&gt;`),
            step(&#x27;꺾인 경로가 가장 짧아지는 조건을 찾는다&#x27;, `&lt;p&gt;두 점 사이의 가장 짧은 길이는 두 점을 곧게 이은 선분의 길이이다. 따라서 A′에서 D와 C를 거쳐 B′으로 가는 길이는 A′B′보다 작을 수 없다.&lt;/p&gt;${formula(&#x27;A′D+DC+CB′≥A′B′&#x27;)}&lt;p&gt;A′, D, C, B′이 이 순서대로 한 직선 위에 놓이면 꺾이는 부분이 없어져 등호가 성립한다.&lt;/p&gt;`),
            step(&#x27;A′과 B′을 지나는 직선의 방정식을 구한다&#x27;, `&lt;p&gt;A′(3,4)과 B′(-2,-4)를 지나는 직선의 기울기를 먼저 계산한다.&lt;/p&gt;${formula(&#x27;m={4-(-4)}/{3-(-2)}=8/5&#x27;)}${formula(&#x27;y-4=(8/5)(x-3)&#x27;)}${formula(&#x27;5y-20=8x-24&#x27;)}${formula(&#x27;8x-5y-4=0&#x27;)}`),
            step(&#x27;이 직선과 y=x의 교점 D를 구한다&#x27;, `&lt;p&gt;D는 직선 y=x 위에 있으므로 8x-5y-4=0에 y=x를 대입한다.&lt;/p&gt;${formula(&#x27;8x-5x-4=0&#x27;)}${formula(&#x27;3x=4 → x=4/3&#x27;)}${formula(&#x27;y=x=4/3&#x27;)}${formula(&#x27;D(4/3,4/3)&#x27;)}`),
            step(&#x27;이 직선과 y축의 교점 C를 구한다&#x27;, `&lt;p&gt;C는 y축 위에 있으므로 x=0이다. 8x-5y-4=0에 x=0을 대입한다.&lt;/p&gt;${formula(&#x27;-5y-4=0&#x27;)}${formula(&#x27;y=-4/5&#x27;)}${formula(&#x27;C(0,-4/5)&#x27;)}`),
            step(&#x27;D와 C가 필요한 순서로 놓이는지 확인한다&#x27;, `&lt;p&gt;A′에서 B′ 방향으로 갈 때 x좌표는 3에서 -2까지 감소한다. 구한 점들의 x좌표를 비교하면 다음과 같다.&lt;/p&gt;${formula(&#x27;3&gt;4/3&gt;0&gt;-2&#x27;)}&lt;p&gt;따라서 한 직선 위에서 A′-D-C-B′ 순서가 맞고, D와 C는 서로 다른 점이다. 그러므로 등호가 실제로 성립한다.&lt;/p&gt;`),
            step(&#x27;A′과 B′ 사이의 거리를 계산한다&#x27;, `&lt;p&gt;최솟값은 A′B′의 길이와 같다. 두 점의 x좌표 차는 5, y좌표 차는 8이다.&lt;/p&gt;${formula(&#x27;A′B′=√{{3-(-2)}²+{4-(-4)}²}&#x27;)}${formula(&#x27;A′B′=√(5²+8²)&#x27;)}${formula(&#x27;A′B′=√89&#x27;)}`),
            step(&#x27;마지막 단계 · 두 번 대칭하여 펼친 직선 경로를 확인한다&#x27;, `&lt;p&gt;A′(3,4)과 B′(-2,-4)를 곧게 이은 선분은 계산한 D(4/3,4/3)와 C(0,-4/5)를 차례로 지난다. 따라서 그림처럼 A′-D-C-B′가 한 직선 위에 놓일 때 실제로 최솟값이 만들어진다.&lt;/p&gt;${answer(&#x27;AD+DC+CB의 최솟값은 √89이다.&#x27;)}${chapterProblem18StrategyFigure(true)}`)
          ] })
        ].join(&#x27;&#x27;);
      }

      function setPrompt(statement, summaries=[]) {
        return textbookOriginal(wrapupProblemPrompt(statement, summaries));
      }

      function textbookOriginal(content) {
        return `&lt;div class=&quot;textbook-original&quot;&gt;
          &lt;span class=&quot;textbook-original-label&quot;&gt;&lt;i class=&quot;fa-solid fa-book-open&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 교과서 내용&lt;/span&gt;
          ${content}
        &lt;/div&gt;`;
      }

      function setOpeningAnimalsFigure() {
        return `&lt;svg class=&quot;venn-diagram&quot; viewBox=&quot;0 0 760 300&quot; role=&quot;img&quot; aria-label=&quot;늑대, 감돌고기, 혹고니, 수원청개구리, 수달을 포유류 여부에 따라 분류한 그림&quot;&gt;
          &lt;rect x=&quot;35&quot; y=&quot;30&quot; width=&quot;690&quot; height=&quot;235&quot; rx=&quot;18&quot; fill=&quot;rgba(238,250,247,.72)&quot; stroke=&quot;rgba(32,181,164,.28)&quot; stroke-width=&quot;2&quot;&gt;&lt;/rect&gt;
          &lt;text x=&quot;380&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; class=&quot;venn-label&quot;&gt;멸종 위기 야생 생물 I급 동물의 일부&lt;/text&gt;
          ${[[&#x27;늑대&#x27;,&#x27;포유류&#x27;,115],[&#x27;감돌고기&#x27;,&#x27;어류&#x27;,250],[&#x27;혹고니&#x27;,&#x27;조류&#x27;,380],[&#x27;수원청개구리&#x27;,&#x27;양서류&#x27;,520],[&#x27;수달&#x27;,&#x27;포유류&#x27;,650]].map(([name,type,x])=&gt;`
            &lt;circle cx=&quot;${x}&quot; cy=&quot;140&quot; r=&quot;45&quot; fill=&quot;${type===&#x27;포유류&#x27;?&#x27;rgba(79,127,208,.16)&#x27;:&#x27;rgba(255,255,255,.92)&#x27;}&quot; stroke=&quot;${type===&#x27;포유류&#x27;?&#x27;#4f7fd0&#x27;:&#x27;#b9c9d1&#x27;}&quot; stroke-width=&quot;${type===&#x27;포유류&#x27;?4:2}&quot;&gt;&lt;/circle&gt;
            &lt;text x=&quot;${x}&quot; y=&quot;147&quot; text-anchor=&quot;middle&quot; class=&quot;venn-note&quot;&gt;${name}&lt;/text&gt;

      function oneSetVennFigure(name, elements, suffix=&#x27;one&#x27;) {
        const isConcept=suffix===&#x27;one&#x27; || suffix===&#x27;concept&#x27;;
        const positions=elements.length&lt;=4
          ? [[335,150],[425,150],[335,225],[425,225]]
          : [[315,145],[380,135],[445,145],[340,225],[420,225]];
        const stroke=isConcept ? &#x27;#c06f22&#x27; : &#x27;#26333d&#x27;;
        const fill=isConcept ? &#x27;rgba(230,160,60,.10)&#x27; : &#x27;#ffffff&#x27;;
        const width=isConcept ? 5 : 3;
        return `&lt;svg class=&quot;venn-diagram&quot; data-venn-style=&quot;${isConcept?&#x27;concept&#x27;:&#x27;problem&#x27;}&quot; viewBox=&quot;0 0 760 350&quot; role=&quot;img&quot; aria-labelledby=&quot;venn-${suffix}-title venn-${suffix}-desc&quot;&gt;
          &lt;title id=&quot;venn-${suffix}-title&quot;&gt;집합 ${name}의 벤 다이어그램&lt;/title&gt;
          &lt;desc id=&quot;venn-${suffix}-desc&quot;&gt;원 안에 집합 ${name}의 원소 ${elements.join(&#x27;, &#x27;)}가 적혀 있다.&lt;/desc&gt;
          &lt;circle cx=&quot;380&quot; cy=&quot;180&quot; r=&quot;128&quot; fill=&quot;${fill}&quot; stroke=&quot;${stroke}&quot; stroke-width=&quot;${width}&quot;&gt;&lt;/circle&gt;
          &lt;text x=&quot;380&quot; y=&quot;61&quot; text-anchor=&quot;middle&quot; class=&quot;venn-label venn-set-name&quot;&gt;${name}&lt;/text&gt;
          ${elements.map((el,i)=&gt;`&lt;text x=&quot;${positions[i%positions.length][0]}&quot; y=&quot;${positions[i%positions.length][1]}&quot; text-anchor=&quot;middle&quot; class=&quot;venn-label&quot;&gt;${el}&lt;/text&gt;`).join(&#x27;&#x27;)}
        &lt;/svg&gt;`;
      }
