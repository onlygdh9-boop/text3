.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  /* Static audit aliases for the supplied reference shell:
     class=&quot;story&quot; class=&quot;workspace&quot; problem-focus className = &#x27;dock&#x27; focus-backdrop
     tabs-one-line-v1 formula-emphasis-v1 formula-separation-v2 answer-contrast-v1 answer-mode-v2

     axis-asymptote-emphasis-v1 subproblem-card-scope-v1 tab-scroll-reset-v1 algebra-before-graph-v1 concept-formula-contrast-v2

     graph-solution-unit-v2 beginner-detail-v2 solution-equivalence-v1 unit-outside-formula-v1

  /* responsive-equation-stack-v1 · radical-structural-v2 · graph-label-mathml-v1 · review-selection-lock-v1 · review-style-parity-v1 · graph-equation-rail-v1 · beginner-detail-contract-v1 */
  const root = document.getElementById(&#x27;function-classroom&#x27;);
  const manifest = JSON.parse(document.getElementById(&#x27;lesson-manifest&#x27;).textContent);
  const workspace = root.querySelector(&#x27;#lesson-workspace&#x27;);
  const focusLayer = root.querySelector(&#x27;#focus-layer&#x27;);
  const focusSlot = root.querySelector(&#x27;#focus-slot&#x27;);
  const state = { topic: manifest.sections[0].id, steps: {}, parameters: {} };
  let focused = null;
  let focusHome = null;
  let focusNext = null;
  const escapeHTML = value =&gt; String(value ?? &#x27;&#x27;).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;).replace(/&quot;/g,&#x27;&amp;quot;&#x27;);
  const sectionFor = id =&gt; manifest.sections.find(section =&gt; section.id === id);
  const cardKind = card =&gt; card.kind || &#x27;problem&#x27;;

  function formulaMarkup(items) {
    if (!items?.length) return &#x27;&#x27;;
    const visible = items.filter(item =&gt; item.visibility !== &#x27;solution&#x27; &amp;&amp; item.source_role !== &#x27;answer&#x27;);

  }

  function graphEquationRailMarkup(item) {
    const entries = [];
    const addEntry = (tone, label, labelHTML) =&gt; {
      if (!label &amp;&amp; !labelHTML) return;
      const visible = labelHTML || escapeHTML(label);
      entries.push(`&lt;div class=&quot;graph-equation-item graph-equation-${tone}&quot;&gt;&lt;span class=&quot;graph-equation-swatch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;graph-equation-text&quot;&gt;${visible}&lt;/span&gt;&lt;/div&gt;`);
    };
    if (item.type === &#x27;inverse_pair&#x27;) {
      addEntry(&#x27;primary&#x27;, item.original_label, item.original_label_html);
      addEntry(&#x27;secondary&#x27;, item.inverse_label, item.inverse_label_html);
      addEntry(&#x27;symmetry&#x27;, &#x27;y=x&#x27;, &#x27;&lt;math xmlns=&quot;http://www.w3.org/1998/Math/MathML&quot; aria-label=&quot;와이는 엑스&quot;&gt;&lt;mrow&gt;&lt;mi&gt;y&lt;/mi&gt;&lt;mo&gt;=&lt;/mo&gt;&lt;mi&gt;x&lt;/mi&gt;&lt;/mrow&gt;&lt;/math&gt;&#x27;);
    }
    (item.series || []).forEach((series,index) =&gt; addEntry(`series-${(index % 6) + 1}`, series.label, series.label_html));

    (item.guide_expressions || []).forEach(guide =&gt; addEntry(&#x27;guide&#x27;, guide.label, guide.label_html));
    return entries.length ? `&lt;div class=&quot;graph-equation-rail&quot; aria-label=&quot;그래프에 사용한 함수식&quot;&gt;${entries.join(&#x27;&#x27;)}&lt;/div&gt;` : &#x27;&#x27;;
  }

  function graphFigureMarkup(item, stageSteps = []) {
    const translation = item.translation_sequence;
    const hasAsymptotes = Boolean(translation || item.vertical_asymptotes?.length || item.horizontal_asymptotes?.length);
    const hasComparison = Array.isArray(item.series) &amp;&amp; item.series.some(series =&gt; series.role === &#x27;base&#x27;) &amp;&amp; item.series.some(series =&gt; series.role === &#x27;shifted&#x27;);
    const legend = `&lt;div class=&quot;coordinate-legend&quot; aria-label=&quot;그래프 선 구분&quot;&gt;&lt;span class=&quot;legend-axis&quot;&gt;x축·y축&lt;/span&gt;${hasAsymptotes ? &#x27;&lt;span class=&quot;legend-asymptote&quot;&gt;점근선&lt;/span&gt;&#x27; : &#x27;&#x27;}${hasComparison ? &#x27;&lt;span class=&quot;legend-base&quot;&gt;기본 무리함수&lt;/span&gt;&lt;span class=&quot;legend-shifted&quot;&gt;평행이동한 무리함수&lt;/span&gt;&#x27; : &#x27;&#x27;}&lt;/div&gt;`;
    if (!translation) return `&lt;figure class=&quot;sim-panel&quot; data-graph-id=&quot;${escapeHTML(item.id)}&quot; data-graph-mode=&quot;single&quot;&gt;&lt;svg viewBox=&quot;0 0 520 360&quot; role=&quot;img&quot; aria-label=&quot;${escapeHTML(item.label)}&quot;&gt;&lt;/svg&gt;${graphEquationRailMarkup(item)}${legend}&lt;figcaption&gt;${item.label_html || escapeHTML(item.label)}&lt;/figcaption&gt;${item.parameter ? `&lt;div class=&quot;sim-controls&quot;&gt;&lt;label class=&quot;form-label&quot;&gt;${escapeHTML(item.parameter.label)}&lt;input class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;${item.parameter.min}&quot; max=&quot;${item.parameter.max}&quot; step=&quot;${item.parameter.step}&quot; value=&quot;${item.parameter.value}&quot; data-parameter=&quot;${escapeHTML(item.id)}&quot;&gt;&lt;/label&gt;&lt;output data-parameter-output=&quot;${escapeHTML(item.id)}&quot;&gt;k=${item.parameter.value}&lt;/output&gt;&lt;/div&gt;` : &#x27;&#x27;}&lt;/figure&gt;`;
    const start = Number(translation.reveal_step_start || 1);
    const needsTransform = translation.requires_algebra_transform === true;
    const parentStep = needsTransform ? start + 1 : start;
    const xShiftStep = parentStep + 1;
    const finalStep = xShiftStep + 1;
    const subproblem = escapeHTML(translation.subproblem || &#x27;&#x27;);
    const stageAttrs = `data-translation-stage data-subproblem=&quot;${subproblem}&quot;`;
    const stepCards = stageSteps.map(stepMarkup);
    let stepCursor = 0;
    const takeStep = () =&gt; stepCards[stepCursor++] || &#x27;&#x27;;
    const transformStep = needsTransform ? takeStep() : &#x27;&#x27;;
    const parentStepCard = takeStep();
    const xShiftStepCard = takeStep();
    const finalStepCards = [takeStep(), ...stepCards.slice(stepCursor)].join(&#x27;&#x27;);
    const transformStage = needsTransform ? `&lt;section class=&quot;translation-study-step translation-transform&quot; ${stageAttrs} data-reveal-step=&quot;${start}&quot; hidden&gt;&lt;div class=&quot;translation-step-head&quot;&gt;&lt;span class=&quot;order-number&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;strong&gt;먼저 원래 식을 변형합니다&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;translation-formula transformation-equation&quot;&gt;${translation.transform_mathml}&lt;/div&gt;${transformStep}&lt;/section&gt;` : &#x27;&#x27;;
    return `&lt;div class=&quot;translation-study&quot; data-translation-subproblem=&quot;${subproblem}&quot; aria-label=&quot;기본함수부터 두 번의 평행이동까지 순서대로 확인&quot;&gt;
      ${transformStage}
      &lt;section class=&quot;translation-study-step translation-plane&quot; ${stageAttrs} data-reveal-step=&quot;${parentStep}&quot; hidden&gt;
        &lt;div class=&quot;translation-step-head&quot;&gt;&lt;span class=&quot;order-number&quot;&gt;${needsTransform ? 2 : 1}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;기본함수를 첫 번째 좌표평면에 그립니다&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;translation-formula&quot;&gt;${translation.parent_mathml}&lt;/div&gt;
        &lt;figure class=&quot;sim-panel translation-parent-figure&quot; data-graph-id=&quot;${escapeHTML(item.id)}&quot; data-graph-mode=&quot;parent&quot;&gt;&lt;svg viewBox=&quot;0 0 520 360&quot; role=&quot;img&quot; aria-label=&quot;평행이동 전 기본함수 그래프&quot;&gt;&lt;/svg&gt;${legend}&lt;figcaption&gt;평행이동 전 기본함수&lt;/figcaption&gt;&lt;/figure&gt;
        ${parentStepCard}
      &lt;/section&gt;
      &lt;section class=&quot;translation-study-step translation-plane translation-x-shift&quot; ${stageAttrs} data-reveal-step=&quot;${xShiftStep}&quot; hidden&gt;
        &lt;div class=&quot;translation-step-head&quot;&gt;&lt;span class=&quot;order-number&quot;&gt;${needsTransform ? 3 : 2}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;x축의 방향으로 평행이동한 그래프를 그립니다&lt;/strong&gt;&lt;p&gt;기본함수와 겹치지 않고, 이동한 그래프만 두 번째 좌표평면에 표시합니다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;translation-formula&quot;&gt;${translation.x_shift_mathml}&lt;/div&gt;
        &lt;figure class=&quot;sim-panel translation-x-shift-figure&quot; data-graph-id=&quot;${escapeHTML(item.id)}&quot; data-graph-mode=&quot;x-shift&quot;&gt;&lt;svg viewBox=&quot;0 0 520 360&quot; role=&quot;img&quot; aria-label=&quot;x축의 방향으로 평행이동한 그래프&quot;&gt;&lt;/svg&gt;${legend}&lt;figcaption&gt;x축의 방향으로 평행이동한 그래프&lt;/figcaption&gt;&lt;/figure&gt;
        ${xShiftStepCard}

      &lt;section class=&quot;translation-study-step translation-plane translation-final&quot; ${stageAttrs} data-reveal-step=&quot;${finalStep}&quot; hidden&gt;
        &lt;div class=&quot;translation-step-head&quot;&gt;&lt;span class=&quot;order-number&quot;&gt;${needsTransform ? 4 : 3}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;y축의 방향으로 평행이동한 최종 그래프를 그립니다&lt;/strong&gt;&lt;p&gt;두 번째 그래프와 겹치지 않고 최종 그래프만 세 번째 좌표평면에 표시합니다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;translation-formula&quot;&gt;${translation.final_mathml}&lt;/div&gt;
        &lt;figure class=&quot;sim-panel translation-final-figure&quot; data-graph-id=&quot;${escapeHTML(item.id)}&quot; data-graph-mode=&quot;final&quot;&gt;&lt;svg viewBox=&quot;0 0 520 360&quot; role=&quot;img&quot; aria-label=&quot;평행이동한 최종 그래프 ${escapeHTML(item.label)}&quot;&gt;&lt;/svg&gt;${legend}&lt;figcaption&gt;${escapeHTML(item.label)}&lt;/figcaption&gt;&lt;/figure&gt;
        ${finalStepCards}
      &lt;/section&gt;
    &lt;/div&gt;`;
  }

  function graphMarkup(items) {
    if (!items?.length) return &#x27;&#x27;;
    return `&lt;div class=&quot;exact-graph-grid&quot;&gt;${items.map(graphFigureMarkup).join(&#x27;&#x27;)}&lt;/div&gt;`;
  }

  function formulaGraphMarkup(card) {
    const formulas = (card.formulas || []).filter(item =&gt; item.visibility !== &#x27;solution&#x27; &amp;&amp; item.source_role !== &#x27;answer&#x27;);
    const graphs = card.graphs || [];
    if (card.visual_mode === &#x27;formula-graph-sequence&#x27; &amp;&amp; formulas.length &amp;&amp; formulas.length === graphs.length) {
      return `&lt;div class=&quot;formula-graph-sequence&quot; data-pair-count=&quot;${graphs.length}&quot;&gt;${graphs.map((graph,index) =&gt; `&lt;section class=&quot;formula-graph-pair${formulas[index].responsive_stack ? &#x27; responsive-formula-stack&#x27; : &#x27;&#x27;}&quot; aria-label=&quot;${index + 1}번째 식과 그래프&quot;&gt;&lt;div class=&quot;pair-order&quot;&gt;&lt;span&gt;${index + 1}&lt;/span&gt;식과 그래프를 함께 확인합니다&lt;/div&gt;&lt;div class=&quot;formula paired-formula&quot; aria-label=&quot;${escapeHTML(formulas[index].spoken)}&quot;&gt;${formulas[index].mathml}&lt;/div&gt;${graphFigureMarkup(graph, graph.translation_sequence ? card.steps || [] : [])}&lt;/section&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    }
    return formulaMarkup(formulas) + graphMarkup(graphs);
  }

  function sourceMarkup(card) {
    const markup = card.problem_original_html || card.body_html || &#x27;&#x27;;
    const terms = [...new Set(card.key_terms || [])].filter(Boolean).sort((a,b)=&gt;b.length-a.length);
    if (!markup || !terms.length) return markup;
    const template = document.createElement(&#x27;template&#x27;);
    template.innerHTML = markup;
    const escaped = terms.map(term =&gt; term.replace(/[.*+?^${}()|[\]\\]/g,&#x27;\\$&amp;&#x27;));
    const pattern = new RegExp(`(${escaped.join(&#x27;|&#x27;)})`,&#x27;g&#x27;);
    const nodes = [];
    const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode;
      const parent = node.parentElement;
      if (!parent?.closest(&#x27;math, mark, script, style&#x27;) &amp;&amp; pattern.test(node.nodeValue || &#x27;&#x27;)) nodes.push(node);
      pattern.lastIndex = 0;
    }
    const tones = [&#x27;sage&#x27;,&#x27;peach&#x27;,&#x27;blue&#x27;];
    nodes.forEach(node =&gt; {
      const fragment = document.createDocumentFragment();
      String(node.nodeValue || &#x27;&#x27;).split(pattern).filter(part =&gt; part !== &#x27;&#x27;).forEach(part =&gt; {
        const termIndex = terms.indexOf(part);
        if (termIndex &lt; 0) fragment.append(document.createTextNode(part));
        else {
          const mark = document.createElement(&#x27;mark&#x27;);
          mark.className = `textbook-key textbook-key-${tones[termIndex % tones.length]}`;
          mark.textContent = part;
          fragment.append(mark);
        }
      });
      node.replaceWith(fragment);
    });
    return template.innerHTML;
  }

  function stepMarkup(item) {
    if (item.transition) {
      return `&lt;div class=&quot;subproblem-transition&quot; data-subproblem=&quot;${escapeHTML(item.subproblem || &#x27;&#x27;)}&quot; data-step-card hidden&gt;&lt;div class=&quot;transition-title&quot;&gt;&lt;i class=&quot;fa-solid fa-arrow-turn-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;${escapeHTML(item.title)}&lt;/span&gt;&lt;/div&gt;${item.html || `&lt;p&gt;${escapeHTML(item.text)}&lt;/p&gt;`}&lt;/div&gt;`;
    }
    const body = item.html || `&lt;p&gt;${escapeHTML(item.text)}&lt;/p&gt;`;
    const modeClass = item.formula_only ? &#x27; formula-only-step&#x27; : &#x27;&#x27;;
    const marker = item.subproblem || String(item.title || &#x27;&#x27;).match(/[⑴⑵⑶⑷⑸]|\([1-5]\)/)?.[0] || &#x27;&#x27;;
    const subClass = marker ? ` subproblem-step subproblem-${marker.replace(/[^1-5⑴⑵⑶⑷⑸]/g,&#x27;&#x27;)}` : &#x27;&#x27;;
    const completion = item.subproblem_complete ? `&lt;div class=&quot;subproblem-complete&quot;&gt;&lt;i class=&quot;fa-solid fa-circle-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;${escapeHTML(marker)} 풀이 완료&lt;/span&gt;&lt;/div&gt;` : &#x27;&#x27;;
    return `&lt;div class=&quot;step-card${modeClass}${subClass}&quot; data-subproblem=&quot;${escapeHTML(marker)}&quot; data-step-card hidden&gt;&lt;span class=&quot;step-label&quot;&gt;${escapeHTML(item.title)}&lt;/span&gt;${item.answer ? `&lt;div class=&quot;answer&quot;&gt;${body}&lt;/div&gt;` : body}${completion}&lt;/div&gt;`;
  }

  function markerOfStep(item) {
    return item.subproblem || String(item.title || &#x27;&#x27;).match(/[⑴⑵⑶⑷⑸]|\([1-5]\)/)?.[0] || &#x27;&#x27;;
  }

  function subproblemFlowMarkup(card) {
    const steps = card.steps || [];
    const markers = [...new Set(steps.filter(item =&gt; !item.transition).map(markerOfStep).filter(Boolean))];
    const visibleFormulas = (card.formulas || []).filter(item =&gt; item.visibility !== &#x27;solution&#x27; &amp;&amp; item.source_role !== &#x27;answer&#x27;);
    const graphs = card.graphs || [];
    return `&lt;div class=&quot;subproblem-flow&quot; aria-label=&quot;소문항별 문제와 풀이&quot;&gt;${markers.map((marker,index) =&gt; {
      const markerSteps = steps.filter(item =&gt; markerOfStep(item) === marker);
      const transition = markerSteps.find(item =&gt; item.transition);
      const ordinary = markerSteps.filter(item =&gt; !item.transition);
      const firstPrompt = index === 0 &amp;&amp; visibleFormulas[index] ? `&lt;div class=&quot;subproblem-prompt&quot;&gt;&lt;strong&gt;현재 문제: ${escapeHTML(marker)}&lt;/strong&gt;&lt;div class=&quot;formula subproblem-prompt-formula&quot; aria-label=&quot;${escapeHTML(visibleFormulas[index].spoken)}&quot;&gt;${visibleFormulas[index].mathml}&lt;/div&gt;&lt;/div&gt;` : &#x27;&#x27;;
      const transitionBlock = transition ? stepMarkup(transition) : &#x27;&#x27;;
      const isTranslation = Boolean(graphs[index]?.translation_sequence);
      const graphBlock = graphs[index] ? `&lt;div class=&quot;subproblem-graph&quot;&gt;${graphFigureMarkup(graphs[index], isTranslation ? ordinary : [])}&lt;/div&gt;` : &#x27;&#x27;;
      const empty = index === 0 ? `&lt;div class=&quot;empty&quot; data-step-empty&gt;실행을 누르면 ${escapeHTML(marker)} 풀이가 이 문제 바로 아래에 한 단계씩 나타납니다.&lt;/div&gt;` : &#x27;&#x27;;
      return `&lt;section class=&quot;subproblem-unit&quot; data-subproblem-group=&quot;${escapeHTML(marker)}&quot;${index ? &#x27; hidden&#x27; : &#x27;&#x27;}&gt;${transitionBlock}${firstPrompt}${graphBlock}&lt;div class=&quot;step-list&quot;&gt;${empty}${isTranslation ? &#x27;&#x27; : ordinary.map(stepMarkup).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;`;
    }).join(&#x27;&#x27;)}&lt;/div&gt;`;
  }

  function cardMarkup(card) {
    const steps = card.steps || [];
    const caution = card.mistakes?.length ? `&lt;div class=&quot;friendly-check&quot;&gt;&lt;strong&gt;자주 하는 실수&lt;/strong&gt;&lt;ul&gt;${card.mistakes.map(item =&gt; `&lt;li&gt;${escapeHTML(item)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/div&gt;` : &#x27;&#x27;;
    const subproblemClass = card.subproblem_mode ? &#x27; subproblem-card&#x27; : &#x27;&#x27;;
    const hasTranslationFlow = (card.graphs || []).some(graph =&gt; graph.translation_sequence);
    const learningBody = card.subproblem_mode
      ? `&lt;div class=&quot;visual subproblem-source&quot;&gt;&lt;div class=&quot;text-flow&quot;&gt;${sourceMarkup(card)}&lt;/div&gt;&lt;/div&gt;${subproblemFlowMarkup(card)}`
      : `&lt;div class=&quot;visual&quot;&gt;&lt;div class=&quot;text-flow&quot;&gt;${sourceMarkup(card)}&lt;/div&gt;${formulaGraphMarkup(card)}${caution}&lt;/div&gt;${steps.length ? `&lt;div class=&quot;step-list&quot;&gt;&lt;div class=&quot;empty&quot; data-step-empty&gt;실행을 누르면 핵심 풀이가 한 단계씩 나타납니다.&lt;/div&gt;${hasTranslationFlow ? &#x27;&#x27; : steps.map(stepMarkup).join(&#x27;&#x27;)}&lt;/div&gt;` : &#x27;&#x27;}`;
    return `&lt;article class=&quot;card lesson-card practice-card ${escapeHTML(cardKind(card))}${subproblemClass}&quot; data-card-id=&quot;${escapeHTML(card.id)}&quot; data-page=&quot;${escapeHTML(card.page)}&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost focus-open&quot; data-focus-id=&quot;${escapeHTML(card.id)}&quot; aria-label=&quot;${escapeHTML(card.title)} 크게 보기&quot;&gt;&lt;i class=&quot;fa-solid fa-expand&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
      &lt;header class=&quot;practice-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;card-page&quot;&gt;교과서 ${escapeHTML(card.page)}쪽&lt;/p&gt;&lt;p class=&quot;practice-label&quot;&gt;${escapeHTML(card.label)}&lt;/p&gt;&lt;h3&gt;${card.title_html || escapeHTML(card.title)}&lt;/h3&gt;${card.subtitle ? `&lt;p class=&quot;text-muted&quot;&gt;${escapeHTML(card.subtitle)}&lt;/p&gt;` : &#x27;&#x27;}&lt;/div&gt;&lt;/header&gt;
      ${learningBody}${card.subproblem_mode ? caution : &#x27;&#x27;}
      ${steps.length ? `&lt;div class=&quot;dock&quot;&gt;&lt;span data-step-status=&quot;${escapeHTML(card.id)}&quot; aria-live=&quot;polite&quot;&gt;풀이를 보면서 다음 단계로 넘기기&lt;/span&gt;&lt;div class=&quot;dock-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run step-run&quot; data-step-run=&quot;${escapeHTML(card.id)}&quot;&gt;실행&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary focus-close-inline&quot;&gt;확대 화면 닫기&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;` : `&lt;div class=&quot;dock focus-only-dock&quot;&gt;&lt;span&gt;개념 설명과 그림을 크게 확인합니다.&lt;/span&gt;&lt;div class=&quot;dock-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary focus-close-inline&quot;&gt;확대 화면 닫기&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`}
    &lt;/article&gt;`;
  }

  function syncCard(cardEl) {
    const id = cardEl.dataset.cardId;
    const steps = [...cardEl.querySelectorAll(&#x27;[data-step-card]&#x27;)];
    const current = state.steps[id] || 0;
    steps.forEach((element,index) =&gt; { element.hidden = index &gt;= current; });
    const groups = [...cardEl.querySelectorAll(&#x27;[data-subproblem-group]&#x27;)];
    groups.forEach((group,index) =&gt; {
      if (index === 0) { group.hidden = false; return; }
      const marker = group.dataset.subproblemGroup;
      const transition = group.querySelector(`.subproblem-transition[data-subproblem=&quot;${marker}&quot;]`);
      group.hidden = !transition || transition.hidden;
    });
    cardEl.querySelectorAll(&#x27;[data-translation-stage]&#x27;).forEach(element =&gt; {
      const marker = element.dataset.subproblem || &#x27;&#x27;;
      const localCurrent = marker
        ? steps.filter(step =&gt; !step.hidden &amp;&amp; step.dataset.subproblem === marker &amp;&amp; !step.classList.contains(&#x27;subproblem-transition&#x27;)).length
        : current;
      element.hidden = localCurrent &lt; Number(element.dataset.revealStep || 1);
    });
    const button = cardEl.querySelector(&#x27;[data-step-run]&#x27;);
    const status = cardEl.querySelector(&#x27;[data-step-status]&#x27;);
    const empty = cardEl.querySelector(&#x27;[data-step-empty]&#x27;);
    if (!button) return;
    if (empty) empty.hidden = current !== 0;
    const nextStep = steps[current];
    button.textContent = current === 0 ? &#x27;실행&#x27; : current &lt; steps.length ? (nextStep?.classList.contains(&#x27;subproblem-transition&#x27;) ? &#x27;다음 문제 확인&#x27; : &#x27;다음 단계&#x27;) : &#x27;처음부터 다시&#x27;;
    status.textContent = current === 0 ? &#x27;실행을 누르면 첫 번째 문제 풀이부터 시작합니다.&#x27; : nextStep?.classList.contains(&#x27;subproblem-transition&#x27;) ? &#x27;앞 문제 풀이 완료 · 다음 문제를 다시 확인합니다.&#x27; : `${current}/${steps.length}단계 · 한 번에 한 단계씩 보기`;
  }

  function closeFocus() {
    if (!focused) return;
    if (focusNext &amp;&amp; focusNext.parentNode === focusHome) focusHome.insertBefore(focused,focusNext);
    else focusHome.appendChild(focused);
    focusLayer.hidden = true;
    const reopen = focused.querySelector(&#x27;.focus-open&#x27;);
    focused = null; focusHome = null; focusNext = null;
    reopen?.focus();
  }

  function openFocus(cardEl) {
    if (focused) closeFocus();
    focused = cardEl; focusHome = cardEl.parentNode; focusNext = cardEl.nextSibling;
    focusSlot.appendChild(cardEl); focusLayer.hidden = false;
    cardEl.querySelector(&#x27;.focus-close-inline&#x27;)?.focus();
  }

  function compileExpression(expression) {
    const safe = String(expression).replace(/\^/g,&#x27;**&#x27;);
    if (!/^[0-9x+\-*/()., _A-Za-z]+$/.test(safe)) return () =&gt; NaN;
    return Function(&#x27;x&#x27;,&#x27;sqrt&#x27;,&#x27;abs&#x27;,&#x27;sin&#x27;,&#x27;cos&#x27;,&#x27;tan&#x27;,&#x27;exp&#x27;,&#x27;log&#x27;,&#x27;pi&#x27;,`return (${safe});`).bind(null);
  }

  function drawGraph(figure, spec) {
    const svg = figure.querySelector(&#x27;svg&#x27;);
    const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
    const XHTML = &#x27;http://www.w3.org/1999/xhtml&#x27;;
    const add = (tag,attrs,text=&#x27;&#x27;) =&gt; { const element=document.createElementNS(NS,tag); Object.entries(attrs).forEach(([key,value])=&gt;element.setAttribute(key,String(value))); if(text) element.textContent=text; svg.appendChild(element); return element; };
    const rationalParts = value =&gt; {
      if (Number.isInteger(value)) return {numerator:value, denominator:1};
      for (let denominator=2; denominator&lt;=24; denominator++) {
        const numerator=Math.round(value*denominator);
        if (Math.abs(value-numerator/denominator)&lt;1e-8) {
          const gcd=(a,b)=&gt;b?gcd(b,a%b):Math.abs(a);
          const divisor=gcd(numerator,denominator);
          return {numerator:numerator/divisor,denominator:denominator/divisor};
        }
      }
      return null;
    };
    const numberMathML = value =&gt; {
      const parts=rationalParts(Number(value));
      if (!parts) return `&lt;mn&gt;${Number(value).toFixed(2).replace(/0+$/,&#x27;&#x27;).replace(/\.$/,&#x27;&#x27;)}&lt;/mn&gt;`;
      if (parts.denominator===1) return parts.numerator&lt;0 ? `&lt;mrow&gt;&lt;mo&gt;−&lt;/mo&gt;&lt;mn&gt;${Math.abs(parts.numerator)}&lt;/mn&gt;&lt;/mrow&gt;` : `&lt;mn&gt;${parts.numerator}&lt;/mn&gt;`;
      const sign=parts.numerator&lt;0?&#x27;&lt;mo&gt;−&lt;/mo&gt;&#x27;:&#x27;&#x27;;
      return `&lt;mrow&gt;${sign}&lt;mfrac&gt;&lt;mn&gt;${Math.abs(parts.numerator)}&lt;/mn&gt;&lt;mn&gt;${parts.denominator}&lt;/mn&gt;&lt;/mfrac&gt;&lt;/mrow&gt;`;
    };
    const addCoordinateLabel = (px,py,label=&#x27;&#x27;,labelHTML=&#x27;&#x27;) =&gt; {
      const foreign=add(&#x27;foreignObject&#x27;,{x:X(px)+6,y:Y(py)-36,width:160,height:52,class:&#x27;graph-point-foreign&#x27;});
      const box=document.createElementNS(XHTML,&#x27;div&#x27;);
      box.className=&#x27;graph-point-label&#x27;;
      if (labelHTML) box.innerHTML=labelHTML;
      else if (label) box.textContent=label;
      else box.innerHTML=`&lt;math xmlns=&quot;http://www.w3.org/1998/Math/MathML&quot; aria-label=&quot;좌표 ${px}, ${py}&quot;&gt;&lt;mrow&gt;&lt;mo&gt;(&lt;/mo&gt;${numberMathML(px)}&lt;mo&gt;,&lt;/mo&gt;&lt;mspace width=&quot;0.35em&quot;/&gt;${numberMathML(py)}&lt;mo&gt;)&lt;/mo&gt;&lt;/mrow&gt;&lt;/math&gt;`;
      foreign.appendChild(box);
    };
    svg.replaceChildren();
    const translation = spec.translation_sequence;
    const graphMode = figure.dataset.graphMode || &#x27;single&#x27;;
    const isParent = Boolean(translation &amp;&amp; graphMode === &#x27;parent&#x27;);
    const isXShift = Boolean(translation &amp;&amp; graphMode === &#x27;x-shift&#x27;);
    const active = isParent ? {
      expression: translation.parent_expression,
      domain_segments: translation.parent_domain_segments,
      vertical_asymptotes: translation.parent_vertical_asymptotes,
      horizontal_asymptotes: translation.parent_horizontal_asymptotes,
      key_points: translation.parent_key_points,
      x_range: translation.parent_x_range,
      y_range: translation.parent_y_range,
    } : isXShift ? {
      expression: translation.x_shift_expression,
      domain_segments: translation.x_shift_domain_segments,
      vertical_asymptotes: translation.x_shift_vertical_asymptotes,
      horizontal_asymptotes: translation.x_shift_horizontal_asymptotes,
      key_points: translation.x_shift_key_points,
      x_range: translation.x_shift_x_range,
      y_range: translation.x_shift_y_range,
    } : spec;
    const xr=active.x_range || [-6,6], yr=active.y_range || [-6,6], pad=42, width=520, height=360;
    const X=value=&gt;pad+(value-xr[0])*(width-2*pad)/(xr[1]-xr[0]);
    const Y=value=&gt;height-pad-(value-yr[0])*(height-2*pad)/(yr[1]-yr[0]);
    for(let value=Math.ceil(xr[0]);value&lt;=Math.floor(xr[1]);value++){ add(&#x27;line&#x27;,{x1:X(value),y1:pad,x2:X(value),y2:height-pad,class:&#x27;grid-line&#x27;}); }
    for(let value=Math.ceil(yr[0]);value&lt;=Math.floor(yr[1]);value++){ add(&#x27;line&#x27;,{x1:pad,y1:Y(value),x2:width-pad,y2:Y(value),class:&#x27;grid-line&#x27;}); }
    add(&#x27;line&#x27;,{x1:pad,y1:Y(0),x2:width-pad,y2:Y(0),class:&#x27;axis&#x27;}); add(&#x27;line&#x27;,{x1:X(0),y1:pad,x2:X(0),y2:height-pad,class:&#x27;axis&#x27;});
    add(&#x27;polygon&#x27;,{points:`${width-pad},${Y(0)} ${width-pad-10},${Y(0)-5} ${width-pad-10},${Y(0)+5}`,class:&#x27;axis-arrow&#x27;});
    add(&#x27;polygon&#x27;,{points:`${X(0)},${pad} ${X(0)-5},${pad+10} ${X(0)+5},${pad+10}`,class:&#x27;axis-arrow&#x27;});
    add(&#x27;text&#x27;,{x:width-pad-16,y:Y(0)-10,class:&#x27;axis-label&#x27;},&#x27;x&#x27;);
    add(&#x27;text&#x27;,{x:X(0)+10,y:pad+18,class:&#x27;axis-label&#x27;},&#x27;y&#x27;);
    if (active.case_badge) {
      add(&#x27;rect&#x27;,{x:pad+8,y:pad+8,width:74,height:28,rx:14,class:&#x27;case-badge-bg&#x27;});
      add(&#x27;text&#x27;,{x:pad+45,y:pad+28,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:&#x27;case-badge-text&#x27;},active.case_badge);
    }
    (active.vertical_asymptotes||[]).forEach(value=&gt;{ add(&#x27;line&#x27;,{x1:X(value),y1:pad,x2:X(value),y2:height-pad,class:&#x27;guide&#x27;}); add(&#x27;text&#x27;,{x:X(value)+6,y:pad+15,class:&#x27;svg-note&#x27;},`x=${value}`); });
    (active.horizontal_asymptotes||[]).forEach(value=&gt;{ add(&#x27;line&#x27;,{x1:pad,y1:Y(value),x2:width-pad,y2:Y(value),class:&#x27;guide&#x27;}); add(&#x27;text&#x27;,{x:width-pad-42,y:Y(value)-7,class:&#x27;svg-note&#x27;},`y=${value}`); });
    const parameter = spec.parameter ? Number(state.parameters[spec.id] ?? spec.parameter.value) : null;
    let expression = active.expression;
    if (spec.parameter) expression = parameter === 0 ? &#x27;NaN&#x27; : `${parameter}/x`;
    const drawExpression = (source,domains,className) =&gt; {
      const fn = compileExpression(source);
      domains.forEach(([start,end])=&gt;{
        let d=&#x27;&#x27;,started=false,previous=null;
        for(let index=0;index&lt;=420;index++){
          const x=start+(end-start)*index/420;
          let y;
          try { y=fn(x,Math.sqrt,Math.abs,Math.sin,Math.cos,Math.tan,Math.exp,Math.log,Math.PI); } catch { y=NaN; }
          if(!Number.isFinite(y)||y&lt;yr[0]-2||y&gt;yr[1]+2){ started=false; previous=null; continue; }
          if(previous!==null &amp;&amp; Math.abs(y-previous)&gt;(yr[1]-yr[0])*.45){ started=false; }
          d += `${started?&#x27;L&#x27;:&#x27;M&#x27;}${X(x).toFixed(2)},${Y(y).toFixed(2)} `; started=true; previous=y;
        }
        if(d) add(&#x27;path&#x27;,{d,class:className});
      });
    };
    (active.guides||[]).forEach(guide=&gt;add(&#x27;line&#x27;,{x1:X(guide.x1),y1:Y(guide.y1),x2:X(guide.x2),y2:Y(guide.y2),class:&#x27;construction-guide&#x27;}));
    if (active.type === &#x27;inverse_pair&#x27;) {
      drawExpression(active.original_expression, [active.original_domain || xr], &#x27;line-a&#x27;);
      drawExpression(active.inverse_expression, [active.inverse_domain || xr], &#x27;line-b&#x27;);
      drawExpression(&#x27;x&#x27;, [xr], &#x27;line-symmetry&#x27;);
      // Function equations are rendered in the dedicated rail outside the SVG.
      // Keeping equations out of the plot prevents curves and points from covering them.
      (active.pairs||[]).forEach(([px,py])=&gt;{
        add(&#x27;circle&#x27;,{cx:X(px),cy:Y(py),r:4.5,class:&#x27;point-a&#x27;});
        if (px !== py) add(&#x27;circle&#x27;,{cx:X(py),cy:Y(px),r:4.5,class:&#x27;point-b&#x27;});
      });
      (active.intersection_points||[]).forEach(([px,py])=&gt;{
        add(&#x27;circle&#x27;,{cx:X(px),cy:Y(py),r:7,class:&#x27;intersection-point&#x27;});
      });
    } else if (Array.isArray(active.series) &amp;&amp; active.series.length) {
      const classes=[&#x27;line-series-1&#x27;,&#x27;line-series-2&#x27;,&#x27;line-series-3&#x27;,&#x27;line-series-4&#x27;,&#x27;line-series-5&#x27;,&#x27;line-series-6&#x27;];
      active.series.forEach((series,index)=&gt;{
        const seriesClass=series.role===&#x27;base&#x27;?&#x27;line-reference&#x27;:series.role===&#x27;shifted&#x27;?&#x27;line-b&#x27;:classes[index % classes.length];
        drawExpression(series.expression, [series.domain || xr], seriesClass);
      });
      (active.key_points||[]).forEach(([px,py])=&gt;add(&#x27;circle&#x27;,{cx:X(px),cy:Y(py),r:5,class:&#x27;point-a&#x27;}));
    } else {
      drawExpression(expression, active.domain_segments || [active.domain || xr], (isParent || isXShift) ? &#x27;line-reference&#x27; : &#x27;line-a&#x27;);
      const points = spec.parameter &amp;&amp; parameter !== 0 ? spec.parameter.key_x.map(value=&gt;[value,parameter/value]) : (active.key_points||[]);
      points.forEach(([px,py])=&gt;{ if(px&gt;=xr[0]&amp;&amp;px&lt;=xr[1]&amp;&amp;py&gt;=yr[0]&amp;&amp;py&lt;=yr[1]){ add(&#x27;circle&#x27;,{cx:X(px),cy:Y(py),r:4.5,class:(isParent || isXShift)?&#x27;point-reference&#x27;:&#x27;point-a&#x27;}); if(active.show_key_point_labels!==false) addCoordinateLabel(px,py); } });
    }
    (active.guide_expressions||[]).forEach(guide=&gt;{
      drawExpression(guide.expression,[guide.domain || xr],&#x27;line-guide-function&#x27;);
    });
    (active.extra_points||[]).forEach(([px,py,label])=&gt;{
      add(&#x27;circle&#x27;,{cx:X(px),cy:Y(py),r:7,class:&#x27;intersection-point&#x27;});
      if(label) add(&#x27;text&#x27;,{x:X(px)+9,y:Y(py)-10,class:&#x27;svg-series-label&#x27;},label);
    });
    (active.symbolic_points||[]).forEach(([px,py,label,labelHTML])=&gt;{ add(&#x27;circle&#x27;,{cx:X(px),cy:Y(py),r:5,class:&#x27;point-b&#x27;}); addCoordinateLabel(px,py,label,labelHTML); });
    // Curve names stay in graphEquationRailMarkup rather than inside the plot.
    const output=figure.querySelector(`[data-parameter-output=&quot;${spec.id}&quot;]`); if(output) output.textContent=`k=${parameter}${parameter===0?&#x27; (조건에서 제외)&#x27;:&#x27;&#x27;}`;
  }

  function drawGraphs() {
    const section=sectionFor(state.topic);
    const graphMap=new Map(section.cards.flatMap(card =&gt; card.graphs||[]).map(item=&gt;[item.id,item]));
    workspace.querySelectorAll(&#x27;[data-graph-id]&#x27;).forEach(figure=&gt;{ const spec=graphMap.get(figure.dataset.graphId); if(spec) drawGraph(figure,spec); });
  }

  function render() {
    closeFocus();
    const section=sectionFor(state.topic);
    root.querySelector(&#x27;#story-label&#x27;).textContent=section.title;
    root.querySelector(&#x27;#story-pages&#x27;).textContent=`교과서 ${section.pages}쪽`;
    root.querySelector(&#x27;#lesson-story-title&#x27;).textContent=section.objective;
    root.querySelector(&#x27;#story-problem&#x27;).textContent=section.route;
    root.querySelector(&#x27;#story-principle&#x27;).innerHTML=`&lt;strong&gt;수업 기준&lt;/strong&gt; ${escapeHTML(section.principle)}`;
    root.querySelectorAll(&#x27;[data-topic]&#x27;).forEach(button=&gt;{ const active=button.dataset.topic===state.topic; button.classList.toggle(&#x27;btn-primary&#x27;,active); button.setAttribute(&#x27;aria-selected&#x27;,String(active)); });
    workspace.innerHTML=`&lt;div class=&quot;simulation&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;strong&gt;${escapeHTML(section.title)} 단계별 학습&lt;/strong&gt;&lt;span&gt;샘플과 같은 순서로 각 자료와 문제를 한 카드씩 학습합니다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;practice-grid&quot;&gt;${section.cards.map(cardMarkup).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
    workspace.querySelectorAll(&#x27;.lesson-card&#x27;).forEach(syncCard); drawGraphs();
  }

  function resetSectionScroll() {
    requestAnimationFrame(() =&gt; window.scrollTo({top:0,left:0,behavior:&#x27;auto&#x27;}));
  }

  root.addEventListener(&#x27;click&#x27;,event=&gt;{
    const menu=event.target.closest(&#x27;.menu-toggle&#x27;); if(menu){ const tabs=root.querySelector(&#x27;#lesson-tabs&#x27;); const open=tabs.classList.toggle(&#x27;is-open&#x27;); menu.setAttribute(&#x27;aria-expanded&#x27;,String(open)); return; }
    const tab=event.target.closest(&#x27;[data-topic]&#x27;); if(tab){ state.topic=tab.dataset.topic; root.querySelector(&#x27;#lesson-tabs&#x27;).classList.remove(&#x27;is-open&#x27;); root.querySelector(&#x27;.menu-toggle&#x27;).setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;); render(); resetSectionScroll(); return; }
    const run=event.target.closest(&#x27;[data-step-run]&#x27;); if(run){ const cardEl=run.closest(&#x27;.lesson-card&#x27;); const id=cardEl.dataset.cardId; const total=cardEl.querySelectorAll(&#x27;[data-step-card]&#x27;).length; state.steps[id]=(state.steps[id]||0)&gt;=total?0:(state.steps[id]||0)+1; syncCard(cardEl); drawGraphs(); return; }
    const focus=event.target.closest(&#x27;[data-focus-id]&#x27;); if(focus){ openFocus(focus.closest(&#x27;.lesson-card&#x27;)); return; }
    if(event.target.closest(&#x27;.focus-close-inline&#x27;)) closeFocus();
  });
  root.addEventListener(&#x27;input&#x27;,event=&gt;{ const input=event.target.closest(&#x27;[data-parameter]&#x27;); if(!input)return; state.parameters[input.dataset.parameter]=Number(input.value); const section=sectionFor(state.topic); const spec=section.cards.flatMap(card=&gt;card.graphs||[]).find(item=&gt;item.id===input.dataset.parameter); if(spec) drawGraph(input.closest(&#x27;[data-graph-id]&#x27;),spec); });
  focusLayer.addEventListener(&#x27;click&#x27;,event=&gt;{ if(event.target===focusLayer) closeFocus(); });
  root.addEventListener(&#x27;keydown&#x27;,event=&gt;{ if(event.key===&#x27;Escape&#x27;) closeFocus(); });
  render();
})();
&lt;/script&gt;
&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></body></html>
