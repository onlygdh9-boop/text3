<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문제 05 · 집합과 부분집합 해설</title>
<meta name="description" content="홀수 집합의 경계를 이용해 부분집합 조건을 해석하고 n의 최댓값을 찾는 단계별 수학 해설 웹앱입니다.">
<meta property="og:title" content="문제 05 · 집합과 부분집합 해설">
<meta property="og:description" content="Aₙ과 A₁₀₀의 부분집합 관계를 홀수가 바뀌는 경계에서 이해합니다.">
<style>
:root{
  --bg:#f7f5ef;
  --surface:#fffefa;
  --surface-2:#f0f2e9;
  --line:#dedfd5;
  --text:#262821;
  --muted:#6e7167;
  --sage:#75866b;
  --sage-dark:#4f6248;
  --sage-soft:#e7ece2;
  --olive:#7d8061;
  --peach:#f0ded1;
  --radius:16px;
  --shadow:0 8px 24px rgba(49,52,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.65;
  word-break:keep-all;
}
button{font:inherit}
button,.tab-btn{min-height:44px}
button:focus-visible,[role="tab"]:focus-visible,a:focus-visible{outline:3px solid rgba(117,134,107,.34);outline-offset:3px}
.skip-link{position:fixed;left:12px;top:-70px;z-index:100;background:#fff;padding:10px 14px;border-radius:10px;border:1px solid var(--line);color:var(--text)}
.skip-link:focus{top:12px}
.app-shell{max-width:1180px;margin:0 auto;padding:28px 24px 36px}
.hero{padding:2px 2px 18px}
.eyebrow{font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--sage-dark);margin-bottom:7px}
h1{font-size:clamp(1.55rem,2.5vw,2.18rem);line-height:1.25;margin:0;font-weight:800;letter-spacing:-.025em}
.hero-desc{margin:9px 0 0;color:var(--muted);font-size:1rem;max-width:850px}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.flow-chip{border:1px solid var(--line);background:#fbfaf5;border-radius:999px;padding:5px 10px;font-size:.83rem;color:#62665c;font-weight:650}
.flow-arrow{color:#a0a497;font-size:.84rem}
.workspace{display:grid;grid-template-columns:minmax(0,1.03fr) minmax(0,.97fr);gap:20px;align-items:stretch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.visual-panel{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);background:#fbfaf6}
.tab-btn{appearance:none;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px 10px 0 0;font-weight:700;cursor:pointer}
.tab-btn[aria-selected="true"]{color:var(--sage-dark);background:var(--surface);box-shadow:inset 0 -2px 0 var(--sage)}
.tab-panel{display:none;min-height:460px;padding:20px}
.tab-panel.active{display:flex;flex-direction:column}
.original-wrap{height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px}
.problem-image{width:100%;max-width:560px;align-self:center;border-radius:12px;border:1px solid #ecebe4;background:#fff;display:block}
.transcription{border-top:1px solid var(--line);padding-top:16px;color:#3a3c36}
.transcription .problem-line{margin:7px 0}
.math-display{display:flex;justify-content:center;align-items:center;min-height:52px;margin:8px 0;font-size:1.12rem;overflow:visible}
.scene{display:flex;flex-direction:column;gap:16px;height:100%}
.scene-kicker{font-size:.82rem;font-weight:750;color:var(--sage-dark)}
.scene-title{font-size:1.25rem;font-weight:800;line-height:1.35;margin:0}
.scene-note{margin:0;color:var(--muted)}
.threshold-board{background:#fbfaf6;border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.threshold-row{display:flex;align-items:flex-end;justify-content:space-between;gap:7px;position:relative;padding:24px 0 5px}
.threshold-row::before{content:"";position:absolute;left:2%;right:2%;top:43px;height:2px;background:#d9dbd1}
.odd{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:32px;color:#a0a399;font-weight:750}
.dot{width:13px;height:13px;border-radius:50%;background:#cfd1c8;border:3px solid #fbfaf6;box-shadow:0 0 0 1px #c4c7bd}
.odd.in .dot{background:var(--sage);box-shadow:0 0 0 2px rgba(117,134,107,.13)}
.odd.in{color:var(--sage-dark)}
.odd.hot .dot{width:17px;height:17px;background:var(--sage-dark);box-shadow:0 0 0 4px rgba(117,134,107,.16)}
.odd.hot{color:var(--sage-dark);font-weight:850}
.odd.blocked .dot{background:#d8b7a1;box-shadow:0 0 0 3px rgba(216,183,161,.18)}
.odd.blocked{color:#9a6d55}
.threshold-caption{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;font-size:.87rem;color:var(--muted)}
.limit-badge{display:inline-flex;align-items:center;gap:7px;background:var(--sage-soft);color:var(--sage-dark);padding:7px 10px;border-radius:999px;font-weight:750}
.limit-badge.danger{background:var(--peach);color:#855c47}
.scene-equation{margin-top:auto;border-left:4px solid var(--sage);background:var(--sage-soft);border-radius:8px 12px 12px 8px;padding:13px 15px;font-weight:760;color:#3f4c3a;min-height:58px;display:flex;align-items:center}
.solution-panel{padding:22px;display:flex;flex-direction:column;min-height:518px}
.step-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.step-count{font-size:.82rem;font-weight:800;color:var(--sage-dark);letter-spacing:.045em}
.progress-track{width:142px;height:5px;background:#e5e5dd;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--sage);border-radius:999px;transition:width .18s ease}
.step-title{font-size:1.37rem;line-height:1.34;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
.focus-strip{border-left:4px solid var(--sage);background:var(--sage-soft);border-radius:8px 12px 12px 8px;padding:12px 14px;margin-bottom:16px;font-weight:720;line-height:1.6}
.step-body{font-size:1rem;color:#3e403a;display:flex;flex-direction:column;gap:10px}
.step-body p{margin:0}
.reason{padding:12px 14px;background:#f8f6ef;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#55584f}
.equation-block{padding:13px 10px;margin:2px 0;text-align:center;font-size:1.13rem;overflow:visible}
.equation-block.key{background:#f1f4ed;border-radius:12px;border:1px solid #dde4d7}
.result-line{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-weight:730}
.final-answer{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--sage-dark);color:#fff;font-weight:800;font-size:1.05rem;align-items:center;justify-content:space-between;gap:10px}
.final-answer.show{display:flex}
.controls{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav-btn{border:1px solid var(--line);background:#fff;color:#4e514a;border-radius:12px;padding:10px 15px;font-weight:750;cursor:pointer;min-width:108px}
.nav-btn.primary{background:var(--sage);color:#fff;border-color:var(--sage)}
.nav-btn:disabled{opacity:.42;cursor:not-allowed}
.nav-btn:not(:disabled):active{transform:translateY(1px)}
.footer-note{font-size:.78rem;color:#8b8e84;margin-top:14px;text-align:right}
.mjx-container[jax="SVG"]{max-width:100%}
.mjx-container svg{max-width:100%;height:auto}
@media (max-width:900px){
 .app-shell{padding:22px 18px 30px}
 .workspace{grid-template-columns:1fr;gap:16px}
 .tab-panel{min-height:390px}
 .solution-panel{min-height:480px}
}
@media (max-width:600px){
 .app-shell{padding:16px 12px 24px}
 .hero{padding-bottom:14px}
 h1{font-size:1.55rem}
 .hero-desc{font-size:.94rem}
 .flow{gap:6px}
 .flow-chip{font-size:.78rem;padding:5px 8px}
 .panel{border-radius:14px}
 .tab-panel{padding:15px;min-height:340px}
 .problem-image{border-radius:9px}
 .threshold-board{padding:14px 10px}
 .threshold-row{gap:3px;padding-top:18px}
 .threshold-row::before{top:37px}
 .odd{font-size:.78rem;min-width:25px}
  .threshold-caption{font-size:.8rem;align-items:flex-start;flex-direction:column}
 .solution-panel{padding:18px 16px;min-height:500px}
 .step-title{font-size:1.23rem}
 .progress-track{width:104px}
 .equation-block{font-size:1.04rem;padding-left:2px;padding-right:2px}
 .controls{gap:8px}
 .nav-btn{min-width:0;flex:1;padding:11px 10px}
 .final-answer{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

function renderRich(parts, container){
  container.replaceChildren();
  parts.forEach(part=>{
    if(part.type==='text'){
      container.appendChild(document.createTextNode(part.value));
    }else if(part.type==='math' || part.type==='blockMath'){
      const isBlock=part.type==='blockMath';
      const el=document.createElement(isBlock?'div':'span');
      el.className=isBlock?'equation-block'+(part.key?' key':''):'math-token';
      const svg=MATH_SVG[(isBlock?'d:':'i:')+part.value];
      if(!svg){
        console.error('Missing pre-rendered math token');
        el.textContent='수식 렌더링 오류';
      }else{
        el.innerHTML=svg;
      }
      container.appendChild(el);
    }else if(part.type==='paragraph' || part.type==='result' || part.type==='reason'){
      const el=document.createElement(part.type==='paragraph'?'p':'div');
      el.className=part.type==='result'?'result-line':part.type==='reason'?'reason':'';
      renderRich(part.parts,el);
      container.appendChild(el);
    }
  });
}

function visibleTextHasForbiddenMath(){
  const forbidden=[/\b\d+[a-zA-Z]?\/\d+\b/,/\\(?:frac|sqrt|overline|qquad)\b/,/\b(?:frac|sqrt|overline|qquad)\b/];
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode(node){
    const p=node.parentElement;
    if(!p || ['SCRIPT','STYLE','NOSCRIPT'].includes(p.tagName)) return NodeFilter.FILTER_REJECT;
    if(p.closest('mjx-container')) return NodeFilter.FILTER_REJECT;
    const style=getComputedStyle(p);
    if(style.display==='none' || style.visibility==='hidden') return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const bad=[];let n;
  while(n=walker.nextNode()){
    const t=n.nodeValue.trim();
    if(t && forbidden.some(r=>r.test(t))) bad.push(t);
  }
  if(bad.length) console.error('Visible math validation failed:',bad);
  document.documentElement.dataset.mathValidation=bad.length?'fail':'pass';
}

function assertStructuredData(){
  const plain=[];
  const walk=o=>{
    if(Array.isArray(o)) return o.forEach(walk);
    if(o&&typeof o==='object'){
      if(o.type==='text' && /(?:\d+[a-zA-Z]?|[a-zA-Z])\/\d+/.test(o.value)) plain.push(o.value);
      Object.values(o).forEach(walk);
    }
  };
  walk(problem);
  if(plain.length) console.error('Unstructured slash math found:',plain);
}

    const dot=document.createElement('span');dot.className='dot';dot.setAttribute('aria-hidden','true');
    const label=document.createElement('span');label.textContent=v;
    el.append(dot,label);row.appendChild(el);

  renderRich(scene.caption,document.getElementById('thresholdCaption'));
  const badge=document.getElementById('limitBadge');
  badge.className='limit-badge'+(scene.danger?' danger':'');
  renderRich(scene.badge,badge);
  renderRich(scene.eq,document.getElementById('sceneEquation'));
}

  const step=problem.steps[currentStep];
  document.getElementById('stepCount').textContent=`STEP ${currentStep+1} / ${problem.steps.length}`;
  document.getElementById('progressFill').style.width=`${(currentStep+1)/problem.steps.length*100}%`;
  document.getElementById('stepTitle').textContent=step.title;
  renderRich(step.focus,document.getElementById('focusStrip'));
  renderRich(step.body,document.getElementById('stepBody'));
  renderScene(step.scene);
  const final=document.getElementById('finalAnswer');
  final.classList.toggle('show',currentStep===problem.steps.length-1);
  if(currentStep===problem.steps.length-1) renderRich([M(String.raw`n=110`)],document.getElementById('answerMath'));
  document.getElementById('prevBtn').disabled=currentStep===0;
  const next=document.getElementById('nextBtn');
  next.disabled=currentStep===problem.steps.length-1;
  next.textContent=currentStep===problem.steps.length-2?'마지막 단계':'다음 단계';
  visibleTextHasForbiddenMath();
}

function selectTab(which){
  const original=which==='original';
  const tabO=document.getElementById('tabOriginal'), tabV=document.getElementById('tabVisual');
  const panO=document.getElementById('panelOriginal'), panV=document.getElementById('panelVisual');
  tabO.setAttribute('aria-selected',String(original));
  tabV.setAttribute('aria-selected',String(!original));
  tabO.tabIndex=original?0:-1; tabV.tabIndex=original?-1:0;
  panO.hidden=!original; panV.hidden=original;
  panO.classList.toggle('active',original);panV.classList.toggle('active',!original);
  visibleTextHasForbiddenMath();
}

document.getElementById('prevBtn').addEventListener('click',()=>{if(currentStep>0){currentStep--;renderStep();}});
document.getElementById('nextBtn').addEventListener('click',()=>{if(currentStep<problem.steps.length-1){currentStep++;renderStep();}});
document.getElementById('tabOriginal').addEventListener('click',()=>selectTab('original'));
document.getElementById('tabVisual').addEventListener('click',()=>selectTab('visual'));
document.querySelector('.tabs').addEventListener('keydown',e=>{
  if(!['ArrowLeft','ArrowRight'].includes(e.key))return;
  e.preventDefault();
  const to=document.getElementById(e.key==='ArrowLeft'?'tabOriginal':'tabVisual');
  to.click();to.focus();
});

(function init(){
  assertStructuredData();
  renderRich(problem.hero,document.getElementById('heroDesc'));
  renderRich(problem.transcription,document.getElementById('transcription'));
  renderStep();
  visibleTextHasForbiddenMath();
})();
</script>
