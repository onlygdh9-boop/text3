<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>수학 문제 단계형 해설 모음</title>
  <meta name="description" content="여러 수학 문제의 단계형 해설 웹앱을 한 페이지의 탭에서 전환해 학습합니다." />
  <style>
    :root{--bg:#f7f4ed;--paper:#fffdf8;--line:#ddd6c8;--text:#292b26;--muted:#6d7168;--sage:#77866d;--sage-dark:#596a52;--sage-soft:#e5eadf;--focus:0 0 0 3px rgba(119,134,109,.28)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,a{font:inherit}
    :focus-visible{outline:none;box-shadow:var(--focus)}
    .topbar{position:relative;z-index:10;border-bottom:1px solid var(--line);background:rgba(247,244,237,.96);backdrop-filter:blur(10px)}
    .top-inner{width:min(1240px,calc(100% - 24px));margin:0 auto;padding:10px 0 9px}
    .head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .brand{min-width:0;font-weight:850;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand small{margin-left:8px;color:var(--muted);font-weight:650}
    .open-current{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--sage-dark);text-decoration:none;font-size:.86rem;font-weight:800;white-space:nowrap}
    .tab-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
    .tabs{display:flex;gap:6px;width:max-content;min-width:100%;padding-bottom:1px}
    .tab{min-width:76px;min-height:42px;padding:0 13px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);font-weight:820;cursor:pointer;white-space:nowrap}
    .tab:hover{color:var(--text);background:rgba(255,253,248,.58)}
    .tab[aria-selected="true"]{border-color:#cfd8ca;background:var(--sage-soft);color:var(--sage-dark)}
    .stage{position:relative;height:calc(100vh - 112px);height:calc(100dvh - 112px);background:var(--bg)}
    .frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
    .frame[hidden]{display:none}
    @media(max-width:680px){.top-inner{width:min(100% - 16px,1240px);padding-top:8px}.head-row{margin-bottom:6px}.brand{font-size:.92rem}.brand small{display:none}.open-current{min-height:36px;padding:0 10px;font-size:.8rem}.tab{min-width:68px;min-height:40px;padding:0 11px}.stage{height:calc(100vh - 101px);height:calc(100dvh - 101px)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="head-row">
        <div class="brand">수학 문제 단계형 해설 <small>문제를 탭으로 선택하세요</small></div>
        <a class="open-current" id="openCurrent" href="problems/current.html" target="_blank" rel="noopener">현재 문제 크게 보기</a>
      </div>
      <div class="tab-scroll" aria-label="문제 선택 영역">
        <div class="tabs" role="tablist" aria-label="문제 선택">
          <button class="tab" role="tab" aria-selected="true" data-key="current">7·9번</button>
          <button class="tab" role="tab" aria-selected="false" data-key="p11">11번</button>
          <button class="tab" role="tab" aria-selected="false" data-key="p13">13번</button>
          <button class="tab" role="tab" aria-selected="false" data-key="p14">14번</button>
          <button class="tab" role="tab" aria-selected="false" data-key="p15">15번</button>
          <button class="tab" role="tab" aria-selected="false" data-key="p17">17번</button>
        </div>
      </div>
    </div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <script>
    const pages={
      current:'problems/current.html',p11:'problems/p11.html',p13:'problems/p13.html',p14:'problems/p14.html',p15:'problems/p15.html',p17:'problems/p17.html'
    };
    const labels={current:'7·9번',p11:'11번',p13:'13번',p14:'14번',p15:'15번',p17:'17번'};
    const stage=document.getElementById('stage');
    const openCurrent=document.getElementById('openCurrent');
    const tabs=[...document.querySelectorAll('.tab')];
    const frames=new Map();
    function ensureFrame(key){
      if(frames.has(key)) return frames.get(key);
      const f=document.createElement('iframe');
      f.className='frame';f.title=`${labels[key]} 수학 문제 해설`;f.src=pages[key];f.loading=key==='current'?'eager':'lazy';
      f.setAttribute('allow','fullscreen');f.hidden=true;stage.appendChild(f);frames.set(key,f);return f;
    }
    function select(key,push=true){
      if(!pages[key]) key='current';
      const target=ensureFrame(key);
      frames.forEach((f,k)=>{f.hidden=k!==key});
      tabs.forEach(t=>{const active=t.dataset.key===key;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;if(active)t.scrollIntoView({block:'nearest',inline:'nearest'});});
      openCurrent.href=pages[key];openCurrent.setAttribute('aria-label',`${labels[key]} 문제를 새 창에서 크게 보기`);
      document.title=`${labels[key]} · 수학 문제 단계형 해설`;
      if(push) history.replaceState(null,'',`#${key}`);
    }
    tabs.forEach((t,i)=>{
      t.addEventListener('click',()=>select(t.dataset.key));
      t.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let n=i;if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;if(e.key==='ArrowRight')n=(i+1)%tabs.length;if(e.key==='Home')n=0;if(e.key==='End')n=tabs.length-1;tabs[n].focus();select(tabs[n].dataset.key);});
    });
    select(location.hash.slice(1)||'current',false);
  </script>
</body>
</html>
