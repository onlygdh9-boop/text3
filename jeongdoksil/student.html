<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정독실 학생용 신청 화면</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./student.css">
</head>
<body class="student-body">
  <div class="student-shell">
    <header class="student-hero">
      <div>
        <p class="eyebrow">Student Portal</p>
        <h1>정독실 학생용 신청 화면</h1>
        <p class="student-hero-copy">아이디와 비밀번호로 로그인한 뒤 불참 신청을 남기고, 권한이 있는 학생은 오늘 날짜 출석 체크도 진행할 수 있습니다.</p>
      </div>
    </header>
    <main class="student-main">
      <section class="panel student-login-panel" id="student-login-panel">
        <div class="panel-head"><div><p class="panel-kicker">학생 로그인</p><h2>로그인 후 이용하기</h2></div></div>
        <form id="student-page-login-form" class="stack-form">
          <label class="field"><span>아이디</span><input type="text" id="student-page-login-id" required></label>
          <label class="field"><span>비밀번호</span><input type="password" id="student-page-login-password" required></label>
          <button class="primary-btn" type="submit">로그인</button>
        </form>
      </section>
      <section class="student-session hidden" id="student-page-session">
        <div class="panel">
          <div class="panel-head"><div><p class="panel-kicker">내 대시보드</p><h2 id="student-page-welcome"></h2></div><div class="panel-actions"><label class="inline-field"><span>조회 월</span><input type="month" id="student-page-month"></label><button class="secondary-btn" type="button" id="student-page-logout-btn">로그아웃</button></div></div>
          <div class="stats-grid" id="student-page-summary"></div>
        </div>
        <section class="panel hidden" id="student-page-attendance-panel">
          <div class="panel-head"><div><p class="panel-kicker">학생 출석 담당</p><h2>오늘 출석 체크</h2></div></div>
          <div class="student-attendance-meta" id="student-page-attendance-meta"></div>
          <div class="seat-card-grid" id="student-page-attendance-grid"></div>
        </section>
        <div class="panel-grid student-page-grid">
          <section class="panel">
            <div class="panel-head"><div><p class="panel-kicker">불참 신청</p><h2>날짜와 교시 선택</h2></div></div>
            <form id="student-page-request-form" class="stack-form">
              <label class="field"><span>불참 날짜</span><input type="date" id="student-page-request-date" required></label>
              <div class="field"><span>불참 교시</span><div class="student-period-picker" id="student-page-period-picker"></div></div>
              <label class="field"><span>사유</span><textarea id="student-page-request-reason" rows="4" required placeholder="예: 병원 진료, 학원 시험 일정"></textarea></label>
              <button class="primary-btn" type="submit">불참 신청 제출</button>
            </form>
          </section>
          <section class="panel">
            <div class="panel-head"><div><p class="panel-kicker">내 신청 내역</p><h2>승인 상태 확인</h2></div></div>
            <div class="table-wrap"><table><thead><tr><th>대상 날짜</th><th>교시</th><th>사유</th><th>상태</th></tr></thead><tbody id="student-page-history-body"></tbody></table></div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script src="./shared-store.js"></script>
  <script src="./student.js"></script>
</body>
</html>
